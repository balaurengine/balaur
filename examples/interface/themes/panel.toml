# One theme for the whole screen: the colours it is built from, the look of
# each widget kind, and the roles a node names instead of spelling a look.
type = "widget_theme"

# Four sources. Every other token a table names, from `bg_panel` to
# `primary_bg`, is derived from them, and stating one overrides its rule.
[colors]
background = "#0e1116"
foreground = "#e6e9ee"
primary = "#6fa4d8"
warning = "#d5814e"

[panel]
fill = "bg_panel"
corner_radius = "radius_large"
padding = 12

[button]
fill = "bg_control"
text_color = "text_muted"
corner_radius = "radius"
padding_x = 10
font_size = 13

[button.hover]
fill = "bg_control_hover"
text_color = "text_default"

[button.active]
fill = "primary_bg"
text_color = "primary_text"

[text_field]
fill = "bg_control"
text_color = "text_default"
corner_radius = "radius"

[list]
fill = "bg_control"
corner_radius = "radius_large"

[tree]
fill = "bg_control"
corner_radius = "radius_large"

[table]
fill = "bg_control"
corner_radius = "radius_large"
padding_x = 10

[roles.title]
font_family = "heading"
font_size = 22
font_weight = 700
text_color = "text_default"

[roles.caption]
font_family = "mono"
font_size = 12
text_color = "text_subtle"

[roles.primary]
fill = "primary_fill"
text_color = "text_on_primary"
font_weight = 700

[roles.primary.hover]
fill = "warning_fill"

# A group heading: the one role a whole section wears.
[roles.group]
font_family = "heading"
font_size = 11
font_weight = 700
text_color = "text_subtle"

[roles.chip]
fill = "bg_control"
text_color = "text_muted"
font_size = 12
corner_radius = "full"
padding_x = 12

# The number is egui's widget; the theme reaches it the way it reaches a
# field, so a spin box beside a button is dressed like the button.
[number_field]
fill = "bg_control"
text_color = "text_default"
stroke = "border_default"
corner_radius = "radius"

[number_field.hover]
fill = "bg_control_hover"

# A toast is read over the screen, so it sits on a raised plate with the
# primary ink down its outline rather than on the sheet's own fill.
[toast]
fill = "bg_control_hover"
text_color = "text_default"
stroke = "primary_text"
corner_radius = "radius_large"
