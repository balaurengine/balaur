# Every widget kind on one screen, grouped by what it is for. Nothing here is
# positioned: `grow` divides what is left and `gap` is the air between.

[[nodes]]
id = "n_screen"
name = "Screen"

[nodes.script]
source = "scripts/screen.rn"
[nodes.script.props]
# Set when the manual's picture is being taken; empty for a normal run.
shot = ""

[[nodes]]
id = "sheet"
name = "Sheet"
parent = "n_screen"
[nodes.widget]
theme = "themes/panel.toml"
kind = "panel"
text = ""
# Centred and hugging: the sheet is as tall as what is in it, which is what
# a gallery wants and what a root with no `fill` anchor does.
anchor = "center"
x = 0
y = 0
width = 940
padding = 14
gap = 10

# The header: a title, a caption, then two buttons against the far edge.
[[nodes]]
id = "head"
name = "Head"
parent = "sheet"
[nodes.widget]
kind = "row"
height = 30
gap = 10
align = "center"

[[nodes]]
id = "title"
name = "Title"
parent = "head"
[nodes.widget]
kind = "label"
text = "Widget kinds"
role = "title"

[[nodes]]
id = "subtitle"
name = "Subtitle"
parent = "head"
[nodes.widget]
kind = "label"
text = "one component, twenty kinds"
role = "caption"
grow = 1

[[nodes]]
id = "shuffle"
name = "Shuffle"
parent = "head"
[nodes.widget]
kind = "button"
text = "Shuffle"
# A glyph from the theme's icon family, drawn before the caption.
icon = "\ue3ee"
tooltip = "Re-order the cards"
on_click = "shuffle"

[[nodes]]
id = "apply"
name = "Apply"
parent = "head"
[nodes.widget]
kind = "button"
text = "Apply"
role = "primary"
tooltip = "The role is the point; nothing is applied"

[[nodes]]
id = "rule"
name = "Rule"
parent = "sheet"
[nodes.widget]
kind = "separator"

# Two columns of groups, sharing the width.
[[nodes]]
id = "body"
name = "Body"
parent = "sheet"
[nodes.widget]
kind = "row"
# No `grow`: the sheet hugs, so there is no leftover to divide and the row
# takes what its two columns measure.
gap = 14
align = "start"

[[nodes]]
id = "left"
name = "Left"
parent = "body"
[nodes.widget]
kind = "column"
width = 440
gap = 8

[[nodes]]
id = "right"
name = "Right"
parent = "body"
[nodes.widget]
kind = "column"
width = 440
gap = 8

[[nodes]]
id = "h_text"
name = "HText"
parent = "left"
[nodes.widget]
kind = "label"
text = "TEXT"
role = "group"

[[nodes]]
id = "type_row"
name = "TypeRow"
parent = "left"
[nodes.widget]
kind = "row"
height = 24
gap = 12
align = "center"

[[nodes]]
id = "t_title"
name = "TTitle"
parent = "type_row"
[nodes.widget]
kind = "label"
text = "Title"
role = "title"

[[nodes]]
id = "t_body"
name = "TBody"
parent = "type_row"
[nodes.widget]
kind = "label"
text = "body"

[[nodes]]
id = "t_mono"
name = "TMono"
parent = "type_row"
[nodes.widget]
kind = "label"
text = "mono"
font = "mono"

[[nodes]]
id = "t_caption"
name = "TCaption"
parent = "type_row"
[nodes.widget]
kind = "label"
text = "caption"
role = "caption"
grow = 1

[[nodes]]
id = "t_markup"
name = "TMarkup"
parent = "left"
[nodes.widget]
kind = "label"
markup = true
text = "markup: [b]bold[/b], [i]italic[/i], [color=#6fa4d8]a colour[/color]"

[[nodes]]
id = "f_field"
