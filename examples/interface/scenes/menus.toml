# Menus, popups and what they open: a bar of menus, the rows one of them
# drops with their shortcuts, a submenu, a context menu any widget can name,
# and a notice on top in the corner. Nothing here is placed by hand.

[[nodes]]
id = "n_screen"
name = "Screen"
[nodes.script]
source = "scripts/shot.bs"

[[nodes]]
id = "sheet"
name = "Sheet"
parent = "n_screen"
[nodes.widget]
theme = "themes/panel.toml"
kind = "panel"
anchor = "center"
x = 0
y = 0
width = 640
height = 320
padding = 14
[nodes.widget_layout]
gap = [12, 12]

[[nodes]]
id = "head"
name = "Head"
parent = "sheet"
[nodes.widget]
kind = "row"
height = 30
[nodes.widget_layout]
gap = [10, 10]
align_items = "center"

[[nodes]]
id = "title"
name = "Title"
parent = "head"
[nodes.widget]
kind = "label"
text = "Menus and popups"
role = "title"

# The bar: a row of menus, each dropping its own rows.
[[nodes]]
id = "bar"
name = "Bar"
parent = "sheet"
[nodes.widget]
kind = "row"
height = 28
[nodes.widget_layout]
gap = [4, 4]

[[nodes]]
id = "file"
name = "File"
parent = "bar"
[nodes.widget]
kind = "menu"
text = "File"
[nodes.widget_button]
trailing = "▾"
[nodes.widget_menu]
showing = true

# Held open by the scene rather than by a click, which is how a screenshot
# and an offscreen run can show what a menu looks like open.
[[nodes]]
id = "file_new"
name = "New"
parent = "file"
[nodes.widget]
kind = "button"
text = "New scene"
width = 210
height = 24
[nodes.widget_shortcut]
shortcut = "cmd+n"

[[nodes]]
id = "file_open"
name = "Open"
parent = "file"
[nodes.widget]
kind = "button"
text = "Open project"
width = 210
height = 24
[nodes.widget_shortcut]
shortcut = "cmd+o"

[[nodes]]
id = "file_recent"
name = "Recent"
parent = "file"
[nodes.widget]
kind = "menu"
text = "Open recent"
width = 210
height = 24
[nodes.widget_button]
trailing = "⏵"

[[nodes]]
id = "recent_one"
name = "Platformer"
parent = "file_recent"
[nodes.widget]
kind = "button"
text = "Platformer"
width = 150
height = 24

[[nodes]]
id = "recent_two"
name = "Shooter"
parent = "file_recent"
[nodes.widget]
kind = "button"
text = "Shooter"
width = 150
height = 24

[[nodes]]
id = "file_save"
name = "Save"
parent = "file"
[nodes.widget]
kind = "button"
text = "Save"
width = 210
height = 24
[nodes.widget_shortcut]
shortcut = "cmd+s"

[[nodes]]
id = "file_grid"
name = "Grid"
parent = "file"
[nodes.widget]
kind = "button"
text = "Show grid"
width = 210
height = 24
[nodes.widget_check]
checked = true
[nodes.widget_child]
keep_open = true

[[nodes]]
id = "edit"
name = "Edit"
parent = "bar"
[nodes.widget]
kind = "menu"
text = "Edit"
[nodes.widget_button]
trailing = "▾"

[[nodes]]
id = "edit_undo"
name = "Undo"
parent = "edit"
[nodes.widget]
kind = "button"
text = "Undo"
width = 180
height = 24
[nodes.widget_shortcut]
shortcut = "cmd+z"

[[nodes]]
id = "view"
name = "View"
parent = "bar"
[nodes.widget]
kind = "menu"
text = "View"
[nodes.widget_button]
trailing = "▾"
[nodes.widget_menu]
placement = "above"

[[nodes]]
id = "view_zoom"
name = "Zoom"
parent = "view"
[nodes.widget]
kind = "button"
text = "Zoom in"
width = 180
height = 24
[nodes.widget_shortcut]
shortcut = "cmd+equals"

# What a right click or a long press opens, named by the canvas below.
[[nodes]]
id = "canvas_menu"
name = "canvas_menu"
parent = "sheet"
[nodes.widget]
kind = "menu"

[[nodes]]
id = "canvas_cut"
name = "Cut"
parent = "canvas_menu"
[nodes.widget]
kind = "button"
text = "Cut"
width = 160
height = 24
[nodes.widget_shortcut]
shortcut = "cmd+x"

[[nodes]]
id = "canvas_paste"
name = "Paste"
parent = "canvas_menu"
[nodes.widget]
kind = "button"
text = "Paste"
width = 160
height = 24
[nodes.widget_shortcut]
shortcut = "cmd+v"

[[nodes]]
id = "canvas"
name = "Canvas"
parent = "sheet"
[nodes.widget]
kind = "panel"
grow = 1
padding = 16
context = "canvas_menu"
tooltip = "Right click, or press and hold"
[nodes.widget_text]
text_align = "end"
[nodes.widget_layout]
gap = [6, 6]
align_items = "end"

[[nodes]]
id = "canvas_text"
name = "CanvasText"
parent = "canvas"
[nodes.widget]
kind = "label"
text = "Right click anywhere here"
role = "group"

[[nodes]]
id = "canvas_hint"
name = "CanvasHint"
parent = "canvas"
[nodes.widget]
kind = "label"
text = "context = \"canvas_menu\" on this panel;\na long press does the same on a phone"
role = "caption"

# A notice: its own root at its own corner, drawn over every other root, and
# read out by a screen reader. A game's script frees it when it is done.
[[nodes]]
id = "notice"
name = "Notice"
parent = "n_screen"
[nodes.widget]
theme = "themes/panel.toml"
kind = "panel"
role = "notice"
anchor = "top_right"
x = 18
y = 18
padding = 12
on_top = true
announce = true
[nodes.widget_layout]
# Hugging: the two lines decide the card's width, not the screen.
align_items = "start"
gap = [2, 2]

[[nodes]]
id = "notice_line"
name = "NoticeLine"
parent = "notice"
[nodes.widget]
kind = "label"
text = "Scene saved"
width = 200

[[nodes]]
id = "notice_note"
name = "NoticeNote"
parent = "notice"
[nodes.widget]
kind = "label"
text = "on_top · announce"
role = "caption"
width = 200
