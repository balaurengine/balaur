[package]
name = "extension_greeter"
description = "An extension built outside the engine, loaded at run time"
version = "0.1.0"
edition = "2024"
publish = false

# A workspace of its own: extension tests load a plugin built apart from the engine.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
balaur_plugin = { path = "../../crates/balaur_plugin", version = "0.2.0-alpha.1" }
