# A small angry-birds game, entirely declarative: 2D shapes, 2D physics
# bodies and HUD widgets are all components, so the whole level is editable
# in the balaur editor. scripts/game.luau drives the slingshot, scoring and
# restarts.

[[nodes]]
name = "Game"
parent = ""
script = "scripts/game.luau"

[[nodes]]
name = "Score"
parent = ""

[nodes.widget]
kind = "label"
text = "Score 0"
anchor = "top_left"
x = 20
y = 16
size = 22
color = "#2b2b2b"

[[nodes]]
name = "Birds"
parent = ""

[nodes.widget]
kind = "label"
text = "Birds 3"
anchor = "top_right"
x = 20
y = 16
size = 22
color = "#2b2b2b"

[[nodes]]
name = "Hint"
parent = ""

[nodes.widget]
kind = "label"
text = "Drag the bird, release to launch · R restarts"
anchor = "bottom_left"
x = 20
y = 14
size = 15
color = "#4b4b4b"

[[nodes]]
name = "Ground"
parent = ""
position = [0, -0.5, 0]
body2d = "fixed"

[nodes.shape2d]
