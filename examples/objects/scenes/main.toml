# Every object the engine builds, one row per category twelve units apart
# along -z: primitives, paths, booleans, cloners, then a word and paint. The
# 2D layer the tour shows last is scenes/flat.toml.

[[assets]]
id = "ring"
type = "mesh"
kind = "torus"
radius = 0.7
tube_radius = 0.22

[[assets]]
id = "arch_outline"
type = "path2d"
closed = true
points = [
  [-1.0, 0.0], [-1.0, 0.4], [-1.0, 0.8], [-1.0, 1.2],
  [-1.0, 1.8], [-0.4, 2.4], [0.0, 2.4],
  [0.4, 2.4], [1.0, 1.8], [1.0, 1.2],
