# An angry-birds game. The level is pure scene data, editable in the balaur
# editor; scripts/game.rn drives the slingshot, scoring and restarts.

[[nodes]]
id = "n_game"
name = "Game"
parent = ""
script = "scripts/game.rn"

[[nodes]]
id = "n_score"
name = "Score"
parent = ""

[nodes.widget]
kind = "label"
text = "Score 0"
anchor = "top_left"
x = 20
y = 16
font_size = 22
text_color = "#2b2b2b"

[[nodes]]
id = "n_birds"
name = "Birds"
parent = ""

[nodes.widget]
kind = "label"
text = "Birds 3"
anchor = "top_right"
x = 20
y = 16
font_size = 22
text_color = "#2b2b2b"

[[nodes]]
id = "n_hint"
name = "Hint"
parent = ""

[nodes.widget]
kind = "label"
text = "Drag the bird, release to launch · R restarts"
anchor = "bottom_left"
x = 20
y = 14
font_size = 15
text_color = "#4b4b4b"

