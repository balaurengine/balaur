# A prefab: any scene file a node can name with `instance`. Its nodes become
# that node's children, with ids prefixed by the instance's, so two crates in
# one scene never share an identity.

[[nodes]]
id = "n_crate"
name = "Crate"
body3d = "dynamic"

[nodes.collider3d]
half_extents = [0.35, 0.35, 0.35]
kind = "cuboid"

# The tint is a property of the shape; an instance overrides it with
# `[nodes.overrides."Crate/Lid".shape3d] color = [...]`, which patches that
# one property and leaves the rest of the shape as the prefab has it.
[nodes.shape3d]
half_extents = [0.35, 0.35, 0.35]
kind = "cuboid"
color = [0.72, 0.52, 0.28, 1]

[[nodes]]
id = "n_lid"
name = "Lid"
parent = "n_crate"
position = [0, 0.4, 0]

[nodes.shape3d]
half_extents = [0.37, 0.05, 0.37]
kind = "cuboid"
color = [0.45, 0.32, 0.17, 1]
