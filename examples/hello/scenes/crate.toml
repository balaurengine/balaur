# A prefab: any scene file a node can name with `instance`. That node is this
# file's root, and the ids under it are prefixed by the instance's, so two
# crates in one scene never share an identity.

[[nodes]]
id = "n_crate"
name = "Crate"
body3d = { kind = "dynamic" }

[nodes.collider3d]
shape = { kind = "box", size = [0.7, 0.7, 0.7] }

# The tint is a property of the shape; an instance overrides it with
# `[nodes.overrides.Lid.shape3d] color = [...]`, which patches that
# one property and leaves the rest of the shape as the prefab has it.
[nodes.shape3d]
shape = { kind = "box", size = [0.7, 0.7, 0.7] }
color = [0.72, 0.52, 0.28, 1]

[[nodes]]
id = "n_lid"
name = "Lid"
parent = "n_crate"

[nodes.transform]
position = [0, 0.4, 0]

[nodes.shape3d]
shape = { kind = "box", size = [0.74, 0.1, 0.74] }
color = [0.45, 0.32, 0.17, 1]
