# Values the scene owns. A binding's `when` reads them, and so does a page
# the game is embedded in.
[variables]
score = { type = "int", value = 0 }

# The torus below is drawn from this asset and collided with it: one mesher
# builds both, so the ring a ball rolls through is the ring on screen.
[[assets]]
id = "ring"
type = "mesh"
kind = "torus"
radius = 1.1
tube_radius = 0.28
segments = 32
rings = 16

[[nodes]]
id = "n_main"
name = "Main"

[[nodes]]
id = "n_world"
name = "World"
parent = "n_main"

[[nodes]]
body3d = "static"
id = "n_ground"
name = "Ground"
parent = "n_world"

[nodes.transform]
position = [0, -1, 0]

[nodes.collider3d]
half_extents = [10, 0.5, 10]
kind = "cuboid"

[nodes.shape3d]
half_extents = [10, 0.5, 10]
kind = "cuboid"
color = [0.3, 0.55, 0.3, 1]

[[nodes]]
id = "n_ball"
name = "Ball"
parent = "n_world"
script = "scripts/ball.rn"

[nodes.transform]
position = [0, 6, 0]

[nodes.shape3d]
kind = "ball"
radius = 0.5
color = [0.9, 0.9, 0.9, 1]

# Two rows, in order: the click counts, and the count opens the door.
[[nodes.bindings]]
event = "pointer_click"
action = "add_variable"
target = "score"
value = 1

[[nodes.bindings]]
event = "pointer_click"
when = "score >= 3"
action = "state"
target = "../Door"
value = "open"

[[nodes]]
id = "n_spinner"
name = "Spinner"
parent = "n_world"

[nodes.transform]
position = [2.5, 0.5, 0]

[nodes.script]
source = "scripts/spinner.rn"

[nodes.script.props]
speed = 3.5

[nodes.shape3d]
half_extents = [0.5, 0.5, 0.5]
kind = "cuboid"
color = [0.2, 0.4, 0.9, 1]

[[nodes]]
body3d = "kinematic"
id = "n_platform"
name = "Platform"
parent = "n_world"
script = "scripts/platform.rn"

[nodes.transform]
position = [-2.5, 0.25, -2]

[nodes.animation]
autoplay = "patrol"
library = "animations/platform.toml"

[nodes.collider3d]
half_extents = [1, 0.25, 1]
kind = "cuboid"

[nodes.shape3d]
half_extents = [1, 0.25, 1]
kind = "cuboid"
color = [0.55, 0.35, 0.8, 1]

# Two instances of one prefab. The second overrides a node inside it, which
# is the only thing that makes them differ.
[[nodes]]
id = "n_crate_a"
name = "CrateA"
parent = "n_world"
instance = "scenes/crate.toml"

[nodes.transform]
position = [-1.5, 3, 1.5]

[[nodes]]
id = "n_crate_b"
name = "CrateB"
parent = "n_world"
instance = "scenes/crate.toml"

[nodes.transform]
position = [-0.5, 5, 1.5]

[nodes.overrides.Lid.shape3d]
color = [0.9, 0.3, 0.25, 1]

# A shape the renderer could not have built for itself, with a collider
# fitted to the very triangles it draws rather than to a box around them.
[[nodes]]
body3d = "static"
id = "n_ring"
name = "Ring"
parent = "n_world"

[nodes.transform]
position = [2.5, 1.6, -2.5]
rotation_euler = [1.5708, 0, 0]

[nodes.mesh]
source = "#ring"

[nodes.collider3d]
kind = "trimesh"
mesh = "#ring"

# Interactivity with no script in the project: clicking the ball counts, and
# on the third click the door opens. The door is two named looks; the count and
# the condition are the scene's own.
[[nodes]]
id = "n_door"
name = "Door"
parent = "n_world"

[nodes.transform]
position = [-4.5, 0.75, 0]

[nodes.shape3d]
kind = "cuboid"
half_extents = [0.15, 1.25, 1.1]
color = [0.45, 0.32, 0.17, 1]

[nodes.states]
current = "shut"

[nodes.states.shut]
shape3d = { color = [0.45, 0.32, 0.17, 1] }

[nodes.states.open]
shape3d = { color = [0.3, 0.75, 0.4, 1] }

# The scene lights itself: a key light with a shadow, and the environment it
# sits in. Without these the engine's own sun draws it, which is what every
# scene got before `light3d` existed.
[[nodes]]
id = "n_key"
name = "KeyLight"
parent = "n_world"

[nodes.transform]
position = [4, 7, 4]
rotation_euler = [-0.87266, 0.69813, 0]

[nodes.light3d]
kind = "spot"
color = "#fff2e0"
intensity = 6
radius = 30
inner = 25
outer = 45

[[nodes]]
id = "n_env"
name = "Environment"
parent = "n_main"

[nodes.environment]
ambient = "#20242a"
tonemap = "neutral"
exposure = 1.1
fog = "exponential"
fog_color = "#9fb4c8"
fog_density = 0.012

[[nodes]]
id = "n_hud"
name = "Hud"
parent = "n_main"

[nodes.widget]
anchor = "top_left"
text_color = "#f9f4ed"
kind = "label"
font_size = 16
text = "hello · balaur"
x = 16
y = 16

# A menu is nodes. The panel lays its children out in a column; each entry is
# a button whose `on_click` names a method on the menu's own script, and none
# of them says where it goes — the container decides that.
[[nodes]]
id = "n_menu"
name = "Menu"
parent = "n_main"
script = "scripts/menu.rn"

[nodes.widget]
kind = "panel"
anchor = "bottom_left"
x = 16
y = 16
text_key = "menu.title"
font_size = 13
padding = 6
gap = 6
text_color = "#8d8478"
# Named once on the menu's root; every button under it is drawn this way.
theme = "themes/menu.toml"

[[nodes]]
id = "n_menu_faster"
name = "Faster"
parent = "n_menu"

[nodes.widget]
kind = "button"
text_key = "menu.faster"
font_size = 13
on_click = "on_faster"

[[nodes]]
id = "n_menu_slower"
name = "Slower"
parent = "n_menu"

[nodes.widget]
kind = "button"
text_key = "menu.slower"
font_size = 13
on_click = "on_slower"

[[nodes]]
id = "n_menu_reverse"
name = "Reverse"
parent = "n_menu"

[nodes.widget]
kind = "button"
text_key = "menu.reverse"
font_size = 13
on_click = "on_reverse"

# On-screen controls for a phone. They feed the same actions the keys do, so
# the spinner's script never learns a finger moved it.
[[nodes]]
id = "n_stick"
name = "Stick"
parent = "n_main"

[nodes.touch_stick]
action_x = "spin"
anchor = "center_bottom"
offset = [0.0, -110.0]
radius = 70.0
knob_radius = 30.0

[[nodes]]
id = "n_flip"
name = "Flip"
parent = "n_main"

[nodes.touch_button]
action = "reverse"
anchor = "bottom_right"
offset = [-80.0, -80.0]
width = 90.0
height = 90.0
