# A clip library: entries under `[clips.<name>]` are addressed
# `animations/platform.toml#patrol`, which is what `autoplay = "patrol"` names.
type = "animation_clip"

[clips.patrol]
length = 4.0
loop = "pingpong"          # none | loop | pingpong

# Slide along z and back. `ease` shapes the segment that *arrives* at the key
# it is written on, so the platform eases into the far end.
[[clips.patrol.tracks]]
property = "position"      # position | rotation_euler | scale | <component>/<property>
interp = "linear"          # step | linear | cubic
keys = [
  { t = 0.0, value = [-2.5, 0.25, -2.0] },
  { t = 4.0, value = [-2.5, 0.25, 2.0], ease = "in_out_sine" },
]

# A track with no `property` is a method track: its keys call a method on the
# script of the node the track targets.
[[clips.patrol.tracks]]
keys = [{ t = 4.0, call = "on_reached_end" }]
