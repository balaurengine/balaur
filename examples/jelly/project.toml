[application]
name = "jelly"
main_scene = "scenes/main.toml"

# The size the manual's clip is taken at, which is what the website's player
# expects of every clip on a page.
[window]
width = 1920
height = 1080

# What a phone export names the game by and numbers it as: each is required
# to export for iOS or Android.
[apple]
bundle_id = "org.balaurengine.jelly"
version = "0.1.0"
build_number = "1"

[android]
application_id = "org.balaurengine.jelly"
version = "0.1.0"
version_code = 1
