# Pinned because the dependency tree has hard MSRVs above what older
# toolchains provide: wesl 0.4.4 (via kiss3d) needs 1.97.1, egui 0.36.1
# needs 1.95. Without this, a clone on a default toolchain fails with a
# "select compatible dependency versions" error that never names the cause.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
