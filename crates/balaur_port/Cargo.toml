[package]
name = "balaur_port"
description = "Translates Rune scripts into Balaur Script drafts: `balaur port`"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "balaur-port"
path = "src/main.rs"

[dependencies]
# Only the parser: no VM, no compiler.
rune = { version = "0.14", default-features = false, features = ["std"] }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
