[package]
name = "balaur_gamend"
description = "Balaur plugin for the Gamend backend: login, REST, realtime and server hooks for scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
balaur_core.workspace = true
balaur_plugin.workspace = true
balaur_script.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
# A token's own expiry, read from its claims; core's version.
base64 = "0.23"

# The realtime socket, on every platform: the same connection a script's
# `websocket` module opens.
balaur_websocket.workspace = true

# The blocking REST client, for the worker threads a native build runs.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq.workspace = true

# The browser: Fetch and the WebSocket API through web-sys, driving the same
# protocol code from callbacks, with a pump per tick instead of a thread.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "AbortSignal",
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Headers",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "WebSocket",
    "Window",
] }

[dev-dependencies]
balaur_testkit.workspace = true
tempfile = "3"
balaur = { workspace = true, features = ["gamend", "http", "compile", "physics2d", "physics3d"] }

[lints]
workspace = true
