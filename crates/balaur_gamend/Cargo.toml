[package]
name = "balaur_gamend"
description = "Balaur plugin for the Gamend backend: login, REST, realtime and server hooks for scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
balaur_core.workspace = true
balaur_plugin.workspace = true
balaur_script.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true

# The blocking transports, for the worker threads a native build runs.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq.workspace = true
tungstenite.workspace = true

# The browser: Fetch and the WebSocket API through web-sys, driving the same
# protocol code from callbacks, with a pump per tick instead of a thread.
[target.'cfg(all(target_family = "wasm", not(target_os = "emscripten")))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AbortSignal",
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Headers",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "WebSocket",
    "Window",
] }

[dev-dependencies]
tempfile = "3"
tungstenite.workspace = true
balaur = { workspace = true, features = ["gamend"] }

[lints]
workspace = true
