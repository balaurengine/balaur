[package]
name = "balaur_http"
description = "Balaur HTTP plugin: requests off the frame, for scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
balaur_core.workspace = true
balaur_plugin.workspace = true
balaur_script.workspace = true
anyhow.workspace = true

# No HTTP stack compiles for wasm; the browser backend takes over there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq.workspace = true

# The browser: the Fetch API through web-sys. No threads — a promise settles
# between frames and feeds the same channel.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "Window",
    "Request",
    "RequestInit",
    "Headers",
    "Response",
    "AbortSignal",
] }

[dev-dependencies]
balaur_testkit.workspace = true
tempfile = "3"
balaur = { workspace = true, features = ["http"] }
balaur_plugin.workspace = true

[lints]
workspace = true
