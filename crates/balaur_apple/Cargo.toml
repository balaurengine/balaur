[package]
name = "balaur_apple"
description = "Balaur Apple platform services: Game Center, iCloud and Sign in with Apple"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The StoreKit shim is Swift, and swift-rs is the linker for it: a static
# Swift library needs the runtime's search paths and rpaths, which differ for
# a Mac, a device and the simulator.
[target.'cfg(target_vendor = "apple")'.build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
balaur_core.workspace = true
balaur_platform.workspace = true
balaur_plugin.workspace = true
balaur_script.workspace = true
anyhow.workspace = true
tracing.workspace = true

# The frameworks, on the platforms that have them. Everywhere else the crate
# still compiles and every call answers `unsupported`, so a game's scripts and
# its tests do not change shape between a Mac and a CI runner.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSData",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
    "NSUbiquitousKeyValueStore",
] }
objc2-authentication-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "ASAuthorization",
    "ASAuthorizationController",
    "ASAuthorizationCredential",
    "ASAuthorizationRequest",
    "ASAuthorizationOpenIDRequest",
    "ASAuthorizationAppleIDProvider",
    "ASAuthorizationAppleIDRequest",
] }
objc2-game-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "GKBasePlayer",
    "GKPlayer",
    "GKLocalPlayer",
    "GKAchievement",
    "GKLeaderboard",
    "GKLeaderboardEntry",
] }

# No facade here: what these tests drive is the plugin and the seam under it,
# and pulling the whole engine in to do that costs a script backend.
[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
