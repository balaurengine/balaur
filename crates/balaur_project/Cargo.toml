[package]
name = "balaur_project"
description = "Balaur projects shipped: a pack built from a project, its report and strip, and the desktop's shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
balaur_core.workspace = true
balaur_script.workspace = true
anyhow.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

# A desktop's opener: the URL handed to the system's own handler, a file
# selected in the file manager.
[target.'cfg(not(any(target_family = "wasm", target_os = "android", target_os = "ios")))'.dependencies]
opener = { version = "0.9", features = ["reveal"] }

# A phone's browser: an `ACTION_VIEW` intent, `UIApplication.openURL:`.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
webbrowser = "1"

# The window, which is what opens a URL in a tab.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.106", features = ["Window"] }

[build-dependencies]
balaur_cfg.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
