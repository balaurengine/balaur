[package]
name = "balaur_steam"
description = "Balaur on Steam: who is playing, and the ticket a server checks with Steam"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
balaur_platform.workspace = true
balaur_plugin.workspace = true

# Valve's library, only where it builds: Windows, macOS and Linux. It links
# `steam_api` dynamically, so a build with this crate ships the library
# beside its executable; everywhere else the plugin leaves `platform.*` alone.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
steamworks = { version = "0.13.1", features = ["raw-bindings"] }

[dev-dependencies]
balaur_core.workspace = true

[lints]
workspace = true
