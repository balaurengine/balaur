[package]
name = "balaur"
description = "Balaur game engine: batteries-included facade over the core and standard plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["audio", "flac", "mp3", "mp4", "vorbis", "wav", "http", "websocket", "webtransport", "gamend", "multiplayer", "browser", "parallel", "compile", "physics2d", "physics3d"]
# rapier's solver on rayon. Native builds want it; a browser can only take it
# with shared memory and atomics, which is the threaded web runtime alone.
parallel = ["balaur_physics/parallel"]
# Windowed rendering (kiss3d/wgpu).
window = ["balaur_render/window"]
# Sound. Off, a build drops rodio, cpal and the platform audio stack.
audio = ["dep:balaur_audio", "balaur_audio/dither"]
# One feature per container `audio` decodes; a build without one plays none
# of that format.
flac = ["balaur_audio?/flac"]
mp3 = ["balaur_audio?/mp3"]
mp4 = ["balaur_audio?/mp4"]
vorbis = ["balaur_audio?/vorbis"]
wav = ["balaur_audio?/wav"]
# Load extensions from a project's extensions/ directory at run time.
extensions = ["balaur_plugin/extensions"]
# `http.*` for scripts. Off, a build drops ureq and its TLS stack.
http = ["dep:balaur_http"]
# `websocket.*` for scripts, and the websocket `Transport`. Off, a build
# without `gamend` drops tungstenite, rustls and the frame codec; Gamend's
# realtime socket runs on them.
websocket = ["dep:balaur_websocket", "balaur_multiplayer?/websocket"]
# The WebTransport `Transport`, over QUIC: the transport rollback and
# replication are meant to run on. Off, a build drops quinn, its runtime and
# the certificate machinery, which is most of what a networked build costs.
webtransport = ["dep:balaur_webtransport", "balaur_multiplayer?/webtransport"]
# `gamend.*` for scripts: the Gamend backend (auth, REST, realtime, hooks).
gamend = ["dep:balaur_gamend"]
# `multiplayer.*` for scripts: host, join and play a rollback match over
# whichever of `websocket` and `webtransport` the build has.
multiplayer = ["dep:balaur_multiplayer"]
# `browser.*` for scripts: the page a browser build runs in. Always compiles;
# off the web every call answers nil.
browser = ["dep:balaur_browser"]
# `apple.*` for scripts, and Game Center and iCloud under `platform.*`. Off,
# a build drops GameKit and the objc2 bindings to it. `platform.*` is always
# there; with no store behind it every call answers `unsupported`.
apple = ["dep:balaur_apple"]
# SVG textures read in place. An exported pack holds their rasters, so a game
# template leaves it off.
svg = ["balaur_core/svg"]
# The 2D physics world: `physics2d.*`, its components and presets.
physics2d = ["balaur_physics/physics2d"]
# The 3D physics world: `physics3d.*`, its components and presets.
physics3d = ["balaur_physics/physics3d"]
# The Rune compiler and the WESL shader linker: a dev run, a pack carrying
# sources, the editor and `balaur check`. A template leaves it off and draws
# with the shaders an export linked into the pack.
compile = ["balaur_script_rune/compile", "balaur_render/compile"]
# egui's bundled faces behind a project's own: Ubuntu Light, Hack and two
# emoji fonts, 1.35 MiB. The editor has them; a game falls back to its own
# faces and the one balaur_text carries.
fallback-fonts = ["balaur_ui/fallback-fonts"]

[dependencies]
balaur_core.workspace = true
balaur_plugin.workspace = true
balaur_script.workspace = true
balaur_script_rune.workspace = true
balaur_physics = { workspace = true, default-features = false }
balaur_animation.workspace = true
balaur_render.workspace = true
balaur_audio = { workspace = true, optional = true }
balaur_input.workspace = true
balaur_http = { workspace = true, optional = true }
balaur_websocket = { workspace = true, optional = true }
balaur_webtransport = { workspace = true, optional = true }
balaur_gamend = { workspace = true, optional = true }
balaur_multiplayer = { workspace = true, optional = true }
balaur_browser = { workspace = true, optional = true }
balaur_platform.workspace = true
balaur_apple = { workspace = true, optional = true }
balaur_ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
toml.workspace = true

[dev-dependencies]
egui.workspace = true
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
