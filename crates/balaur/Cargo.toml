[package]
name = "balaur"
description = "Balaur game engine: batteries-included facade over the core and standard plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
test = false

[features]
default = ["audio", "flac", "mp3", "mp4", "vorbis", "wav", "http", "websocket", "webtransport", "multiplayer", "browser", "parallel", "compile", "physics2d", "physics3d", "bs", "bs-jit", "env-filter"]
# rapier's solver on rayon. Native builds want it; a browser can only take it
# with shared memory and atomics, which is the threaded web runtime alone.
parallel = ["balaur_physics/parallel"]
# Windowed rendering (kiss3d/wgpu).
window = ["balaur_render/window"]
# WebGL2 beside WebGPU in a browser, for a page without WebGPU. 1.0 MB of a web
# module, and nothing on any other target.
webgl = ["balaur_render/webgl"]
# `RUST_LOG` with tracing's full filter syntax, regex included. Off, plain
# `target=level` rows, and 0.23 MB less of a web module.
env-filter = ["balaur_core/env-filter"]
# Sound. Off, a build drops rodio, cpal and the platform audio stack.
audio = ["dep:balaur_audio", "balaur_audio/dither"]
# One feature per container `audio` decodes; a build without one plays none
# of that format.
flac = ["balaur_audio?/flac"]
mp3 = ["balaur_audio?/mp3"]
mp4 = ["balaur_audio?/mp4"]
vorbis = ["balaur_audio?/vorbis"]
wav = ["balaur_audio?/wav"]
# Load extensions from a project's extensions/ directory at run time.
extensions = ["balaur_plugin/extensions"]
# `http.*` for scripts. Off, a build drops ureq and its TLS stack.
http = ["dep:balaur_http"]
# `websocket.*` for scripts, and the websocket `Transport`. Off, a build
# drops tungstenite, rustls and the frame codec; the Gamend addon's realtime
# socket runs on them.
websocket = ["dep:balaur_websocket", "balaur_multiplayer?/websocket"]
# The WebTransport `Transport`, over QUIC: the transport rollback and
# replication are meant to run on. Off, a build drops quinn, its runtime and
# the certificate machinery, which is most of what a networked build costs.
webtransport = ["dep:balaur_webtransport", "balaur_multiplayer?/webtransport"]
# `multiplayer.*` for scripts: host, join and play a rollback match over
# whichever of `websocket` and `webtransport` the build has.
multiplayer = ["dep:balaur_multiplayer"]
# `browser.*` for scripts: the page a browser build runs in. Always compiles;
# off the web every call answers nil.
browser = ["dep:balaur_browser"]
# `apple.*` for scripts, and Game Center and iCloud under `platform.*`. Off,
# a build drops GameKit and the objc2 bindings to it. `platform.*` is always
# there; with no store behind it every call answers `unsupported`.
apple = ["dep:balaur_apple"]
# `platform.*` from Steam where its client runs the game. Off by default:
# Valve's library is linked, so a build with it ships `steam_api` beside it.
steam = ["dep:balaur_steam"]
# `google.*` for scripts: Sign in with Google through Android's Credential
# Manager. Always compiles; off Android every call answers `unsupported`.
google = ["dep:balaur_google"]
# SVG textures read in place. An export pack holds their rasters, so a game
# template leaves it off.
svg = ["balaur_asset/svg"]
# The 2D physics world: `physics2d.*` and its components.
physics2d = ["balaur_physics/physics2d"]
# The 3D physics world: `physics3d.*` and its components.
physics3d = ["balaur_physics/physics3d"]
# The WESL shader linker, the `.bs` compiler and its C translator: a dev run,
# the editor and an export. A template leaves it off and draws with the shaders
# an export linked, and runs the script units it compiled, into the export pack.
compile = ["balaur_render/compile", "balaur_script_bs?/c", "balaur_script_bs?/compile"]
# Balaur Script (`.bs`), the language scripts are written in: `bs` on wasmi
# or an iOS export's native build, `bs-jit` on wasmtime (5 to 7 times wasmi,
# about 11 MB; not on the web or iOS), `bs-web` on the page's own engine.
bs = ["bs-backend", "balaur_script_bs?/wasmi", "balaur_script_bs?/native"]
# The interpreter alone: what the web editor's module adds beside `bs-web` so a
# debugger can park a call.
bs-wasmi = ["bs-backend", "balaur_script_bs?/wasmi"]
bs-jit = ["bs-backend", "balaur_script_bs?/wasmtime"]
bs-web = ["bs-backend", "balaur_script_bs?/web"]
# What those three share; on its own it has no engine to run a script on.
bs-backend = ["dep:balaur_script_bs"]
# egui's bundled faces behind a project's own: Ubuntu Light, Hack and two
# emoji fonts, 1.35 MiB. The editor has them; a game falls back to its own
# faces and the one balaur_text carries.
fallback-fonts = ["balaur_ui/fallback-fonts"]

[dependencies]
balaur_net.workspace = true
balaur_project.workspace = true
balaur_debug.workspace = true
balaur_core.workspace = true
balaur_geometry.workspace = true
balaur_asset.workspace = true
balaur_plugin.workspace = true
balaur_script.workspace = true
balaur_script_bs = { workspace = true, optional = true }
balaur_physics = { workspace = true, default-features = false }
balaur_animation.workspace = true
balaur_render.workspace = true
balaur_audio = { workspace = true, optional = true }
balaur_input.workspace = true
balaur_http = { workspace = true, optional = true }
balaur_websocket = { workspace = true, optional = true }
balaur_webtransport = { workspace = true, optional = true }
balaur_multiplayer = { workspace = true, optional = true }
balaur_browser = { workspace = true, optional = true }
balaur_platform.workspace = true
balaur_apple = { workspace = true, optional = true }
balaur_steam = { workspace = true, optional = true }
balaur_google = { workspace = true, optional = true }
balaur_ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
toml.workspace = true

[dev-dependencies]
egui.workspace = true
serde_json.workspace = true
tempfile = "3"
# The live Gamend suites: the e2e gate, and a second player over plain HTTP.
balaur_testkit.workspace = true
ureq.workspace = true

[lints]
workspace = true
