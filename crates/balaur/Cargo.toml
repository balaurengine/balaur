[package]
name = "balaur"
description = "Balaur game engine: batteries-included facade over the core and standard plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["audio", "http", "websocket", "webtransport", "gamend", "web"]
# Windowed rendering (kiss3d/wgpu).
window = ["balaur_render/kiss3d"]
# Sound. Off, a build drops rodio, cpal and the platform audio stack.
audio = ["dep:balaur_audio"]
# Load extensions from a project's extensions/ directory at run time.
extensions = ["balaur_plugin/dylib"]
# `http.*` for scripts. Off, a build drops ureq and its TLS stack.
http = ["dep:balaur_http"]
# `websocket.*` for scripts, and the websocket `Transport`. Off, a build drops
# tungstenite, rustls and the frame codec.
websocket = ["dep:balaur_websocket"]
# The WebTransport `Transport`, over QUIC: the transport rollback and
# replication are meant to run on. Off, a build drops quinn, its runtime and
# the certificate machinery, which is most of what a networked build costs.
webtransport = ["dep:balaur_webtransport"]
# `gamend.*` for scripts: the Gamend backend (auth, REST, realtime, hooks).
gamend = ["dep:balaur_gamend"]
# `web.*` for scripts: the page a browser build runs in. Always compiles;
# off the web every call answers nil.
web = ["dep:balaur_web"]
# `apple.*` for scripts, and Game Center and iCloud under `platform.*`. Off,
# a build drops GameKit and the objc2 bindings to it. `platform.*` is always
# there; with no store behind it every call answers `unsupported`.
apple = ["dep:balaur_apple"]

[dependencies]
balaur_core.workspace = true
balaur_plugin.workspace = true
balaur_script.workspace = true
balaur_script_rune.workspace = true
balaur_physics = { workspace = true, default-features = false }
balaur_anim.workspace = true
balaur_render.workspace = true
balaur_audio = { workspace = true, optional = true }
balaur_input.workspace = true
balaur_http = { workspace = true, optional = true }
balaur_websocket = { workspace = true, optional = true }
balaur_webtransport = { workspace = true, optional = true }
balaur_gamend = { workspace = true, optional = true }
balaur_web = { workspace = true, optional = true }
balaur_platform.workspace = true
balaur_apple = { workspace = true, optional = true }
balaur_ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
