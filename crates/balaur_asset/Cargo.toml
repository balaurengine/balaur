[package]
name = "balaur_asset"
description = "Balaur assets: glTF models, images and textures"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
balaur_core.workspace = true
balaur_geometry.workspace = true
anyhow.workspace = true
toml.workspace = true
glamx.workspace = true
serde_json.workspace = true
tracing.workspace = true
# `.glb` meshes, skins, clips and morph targets. No `import` feature: an export pack
# hands the reader bytes; `extras` carries a shape's own name, and the
# extensions below carry a surface's paint and the lights a scene places.
gltf = { version = "1.4", default-features = false, features = [
    "utils",
    "names",
    "extras",
    "KHR_materials_transmission",
    "KHR_materials_ior",
    "KHR_materials_volume",
    "KHR_materials_specular",
    "KHR_materials_emissive_strength",
    "KHR_materials_unlit",
    "KHR_texture_transform",
    "KHR_materials_pbrSpecularGlossiness",
    "KHR_materials_variants",
    "KHR_lights_punctual",
] }
# `pixels`: one decoder for the renderer, the UI and the exporter. The formats
# a material and a sky are documented to read, and no others.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga", "hdr", "exr"] }
resvg = { version = "0.49", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# SVG textures rasterized at their `scale`. Off in a game runtime: an export
# has already written the raster into the export pack.
svg = ["dep:resvg"]

[lints]
workspace = true
