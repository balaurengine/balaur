[package]
name = "balaur_core"
description = "Balaur engine core: ECS data plane, scene tree, frame scheduler, plugin API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hecs.workspace = true
glamx.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
balaur_script.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
# Platform-standard user-data locations for `engine.user_data_dir`.
dirs = "6"
sha2.workspace = true
# Bone rest poses go through sin/cos once per bone; the platform libm differs
# across operating systems and this one does not.
libm.workspace = true
# `.glb` meshes, skins and clips. No `import` feature: a pack hands the
# reader bytes, and nothing here decodes an image.
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true