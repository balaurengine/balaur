[package]
name = "balaur_core"
description = "Balaur engine core: ECS world, scene tree, frame scheduler, plugin API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
balaur_cfg.workspace = true

[features]

[dependencies]
hecs.workspace = true
glamx.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex-lite.workspace = true
# `toml.patch`: the one writer that keeps a hand-written file's comments and
# key order, which `toml::to_string` cannot.
toml_edit = "0.25"
anyhow.workspace = true
indexmap.workspace = true
smol_str.workspace = true
rustc-hash.workspace = true
balaur_script.workspace = true
balaur_derive.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
# Platform-standard user-data locations for `engine.user_data_directory`.
dirs = "7"
sha2.workspace = true
# Bone rest poses go through sin/cos once per bone; the platform libm differs
# across operating systems and this one does not.
libm.workspace = true
sys-locale = "0.3"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# `wake::worker`: the poll an I/O thread sleeps in, and the waker its queue fires.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mio.workspace = true
# The process's CPU time, for how many cores a frame kept busy (`timings`).
cpu-time = "1"
# The running executable mapped to read a fused game's trailer without
# loading the whole binary (`standalone`).
memmap2 = "0.9"
# A typed system's batches on the thread pool (`Query::par_for_each`): native
# only, since a web build runs them in order.
rayon = "1"

# The browser has no `std::time::Instant`; `web_time` reads `performance.now()`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
# The console, for the log lines a browser has no stderr for.
web-sys = { version = "0.3.106", features = ["console"] }

# The page's random numbers: the one salt an install id can draw in a browser,
# since `std::process::id` panics on that target.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3.106"

# The shared-memory web build's workers, for `task::compute`: the pool the page
# starts through `wasm-bindgen-rayon`, since `std::thread` cannot spawn there.
[target.'cfg(all(target_family = "wasm", target_feature = "atomics"))'.dependencies]
rayon = "1"

# Which cores are the fast ones (`task::performance_cores`), where the crate
# reads them: it has no phone or browser backend, and refuses an Intel Mac,
# whose cores are all alike.
[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), target_os = "linux", target_os = "windows"))'.dependencies]
gdt-cpus = { version = "0.2606", default-features = false }
