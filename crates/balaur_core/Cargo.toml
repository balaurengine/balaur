[package]
name = "balaur_core"
description = "Balaur engine core: ECS world, scene tree, frame scheduler, plugin API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hecs.workspace = true
glamx.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# `toml.patch`: the one writer that keeps a hand-written file's comments and
# key order, which `toml::to_string` cannot.
toml_edit = "0.25"
anyhow.workspace = true
indexmap.workspace = true
smol_str.workspace = true
rustc-hash.workspace = true
balaur_script.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
# Platform-standard user-data locations for `engine.user_data_dir`.
dirs = "7"
sha2.workspace = true
# Bone rest poses go through sin/cos once per bone; the platform libm differs
# across operating systems and this one does not.
libm.workspace = true
# `.glb` meshes, skins, clips and morph targets. No `import` feature: a pack
# hands the reader bytes. `extras` carries `targetNames`, a shape's own name.
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras"] }
sys-locale = "0.3"
i_overlay = "8"
# The one triangulator: `balaur_core::triangulate` is where it is named, and
# `balaur_ui`'s glyph filler goes through that. `i_overlay`'s sibling.
i_triangle = "0.48"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# The browser has no `std::time::Instant`; `web_time` reads `performance.now()`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
# The console, for the log lines a browser has no stderr for, and the window,
# which is what opens a URL in a tab.
web-sys = { version = "0.3", features = ["console", "Window"] }

# The browser outside emscripten, which keeps process ids: the one salt an
# install id can draw there, since `std::process::id` panics on that target.
[target.'cfg(all(target_family = "wasm", not(target_os = "emscripten")))'.dependencies]
js-sys = "0.3"
