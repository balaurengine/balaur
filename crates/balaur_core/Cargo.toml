[package]
name = "balaur_core"
description = "Balaur engine core: ECS world, scene tree, frame scheduler, plugin API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hecs.workspace = true
glamx.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# `toml.patch`: the one writer that keeps a hand-written file's comments and
# key order, which `toml::to_string` cannot.
toml_edit = "0.25"
anyhow.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
balaur_script.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
# Platform-standard user-data locations for `engine.user_data_dir`.
dirs = "6"
sha2.workspace = true
# Bone rest poses go through sin/cos once per bone; the platform libm differs
# across operating systems and this one does not.
libm.workspace = true
# `.glb` meshes, skins and clips. No `import` feature: a pack hands the
# reader bytes, and nothing here decodes an image.
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
sys-locale = "0.3"
i_overlay = "8"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# The browser has no `std::time::Instant`; `web_time` reads `performance.now()`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
# The console, for the log lines a browser has no stderr for.
web-sys = { version = "0.3", features = ["console"] }
