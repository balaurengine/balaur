[package]
name = "balaur_websocket"
description = "Balaur websocket plugin: connections for scripts, and a Transport for sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
balaur_core.workspace = true
balaur_plugin.workspace = true
balaur_script.workspace = true
anyhow.workspace = true
tracing.workspace = true
toml.workspace = true

# No websocket stack compiles for wasm; those get the browser backend or,
# outside emscripten, a stub whose every connect resolves to an error event.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tungstenite.workspace = true
# The worker speaks frames itself so `permessage-deflate` can set the bit
# tungstenite's message API refuses; these are its handshake, TLS,
# compression and masking.
httparse = "1"
flate2 = "1"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "0.26"

# Compiles the emscripten websocket shim for web builds only; see build.rs.
[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
balaur = { workspace = true, features = ["websocket"] }
# The loopback echo servers the tests speak to, and the compression the
# negotiation tests check for on the wire.
tungstenite.workspace = true
flate2 = "1"
balaur_plugin.workspace = true

[lints]
workspace = true
