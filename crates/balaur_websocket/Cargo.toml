[package]
name = "balaur_websocket"
description = "Balaur websocket plugin: connections for scripts, and a Transport for sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
balaur_core.workspace = true
balaur_plugin.workspace = true
balaur_script.workspace = true
anyhow.workspace = true
tracing.workspace = true
toml.workspace = true

# No websocket stack compiles for wasm; the browser backend takes over there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tungstenite.workspace = true
# The worker speaks frames itself so `permessage-deflate` can set the bit
# tungstenite's message API refuses; these are its handshake, TLS,
# compression and masking.
httparse = "1"
flate2 = "1"
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "1"

# The browser: the WebSocket API through web-sys. No threads — the browser
# fires callbacks and `pump` flushes sends per tick.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "MessageEvent",
    "WebSocket",
] }

[dev-dependencies]
balaur_testkit.workspace = true
tempfile = "3"
balaur = { workspace = true, features = ["websocket"] }
# The loopback echo servers the tests speak to, and the compression the
# negotiation tests check for on the wire.
tungstenite.workspace = true
flate2 = "1"
balaur_plugin.workspace = true

[lints]
workspace = true
