[package]
name = "balaur_audio"
description = "Balaur audio plugin backed by rodio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# One feature per container rodio decodes. All on: a project picks its own
# formats, and dropping one only pays off in a build that ships none of it.
default = ["flac", "mp3", "mp4", "vorbis", "wav"]
flac = ["rodio/flac"]
mp3 = ["rodio/mp3"]
mp4 = ["rodio/mp4"]
vorbis = ["rodio/vorbis"]
wav = ["rodio/wav"]
# Microphone capture. Off, because nothing in the engine records, and rodio's
# default turns it on: it links cpal's input path and rtrb for nothing.
recording = ["rodio/recording"]
# Dithering when a sample format is converted. Off: it links rand and
# rand_distr, which a game that ships matched sample rates never reaches.
dither = ["rodio/dither"]

[dependencies]
balaur_core.workspace = true
balaur_plugin.workspace = true
anyhow.workspace = true
balaur_script.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[dev-dependencies]
tempfile = "3"

# The WebAudio host: cpal reaches the browser's AudioContext through
# wasm-bindgen, so the same rodio backend plays on every target.
[target.'cfg(target_family = "wasm")'.dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback", "wasm-bindgen"] }

# For the COM keep-alive in the backend; see `keep_com_alive` in lib.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com"] }

[lints]
workspace = true
