[package]
name = "balaur_audio"
description = "Balaur audio plugin backed by rodio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
balaur_core.workspace = true
balaur_plugin.workspace = true
anyhow.workspace = true
balaur_script.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

# No cpal host compiles for wasm (cpal 0.18 dropped emscripten), so wasm gets
# the stub backend in lib.rs; the gate also keeps getrandom out of the wasm tree.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rodio = "0.22"

[lints]
workspace = true
