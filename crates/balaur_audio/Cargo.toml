[package]
name = "balaur_audio"
description = "Balaur audio plugin backed by rodio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
balaur_core.workspace = true
balaur_plugin.workspace = true
anyhow.workspace = true
balaur_script.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
rodio = "0.22"

[dev-dependencies]
tempfile = "3"

# The WebAudio host: cpal reaches the browser's AudioContext through
# wasm-bindgen, so the same rodio backend plays on every target.
[target.'cfg(target_family = "wasm")'.dependencies]
rodio = { version = "0.22", features = ["wasm-bindgen"] }

# For the COM keep-alive in the backend; see `keep_com_alive` in lib.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com"] }

[lints]
workspace = true
