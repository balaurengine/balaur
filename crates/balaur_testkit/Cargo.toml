[package]
name = "balaur_testkit"
description = "Balaur test harness: one booted app, ticked until its script says so"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
test = false

[dependencies]
tempfile = "3"
# `bs`: the kit's projects attach scripts, which need a backend to load.
balaur = { workspace = true, features = ["bs", "compile", "physics2d", "physics3d"] }
balaur_core.workspace = true

[lints]
workspace = true
