[package]
name = "balaur_lang"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A small statically typed scripting language compiled to WebAssembly: compiler, runtime and debugger."

[dependencies]
libm.workspace = true
wasm-encoder = "0.262"
# `deterministic` canonicalises NaNs, the one result wasm leaves to the platform.
wasmi = { version = "2", optional = true, default-features = false, features = ["stable", "std", "validate", "auto-dispatch", "deterministic"] }
wasmtime = { version = "48", optional = true, default-features = false, features = ["cranelift", "runtime", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.106", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }

[features]
default = ["wasmi"]
# An interpreter, on every platform: the engine when no faster one is built in.
wasmi = ["dep:wasmi"]
# Cranelift compiles scripts to machine code: desktop and Android, not iOS.
wasmtime = ["dep:wasmtime"]
# The page's own WebAssembly engine, for a wasm32 build in a browser.
web = ["dep:js-sys", "dep:wasm-bindgen"]

[lints]
workspace = true
