[package]
name = "balaur_ui"
description = "Balaur UI plugin: an immediate-mode egui API for scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# egui's bundled faces behind a project's own: Ubuntu Light, Hack and two
# emoji fonts.
fallback-fonts = ["egui/default_fonts"]

[dependencies]
balaur_core.workspace = true
balaur_input.workspace = true
balaur_plugin.workspace = true
balaur_text.workspace = true
egui.workspace = true
taffy.workspace = true
# The widget pass hashes entity bits and arena indices tens of thousands of
# times a frame; SipHash is most of what that walk costs.
rustc-hash.workspace = true
smol_str.workspace = true
anyhow.workspace = true
toml.workspace = true
serde.workspace = true
balaur_script.workspace = true
tracing.workspace = true
# `webp` because an export may re-encode a PNG as lossless WebP: a headless
# run still reads that sprite's size off the header.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# The wave in marked-up text is drawn with a sine that must not vary by OS.
libm.workspace = true

[dev-dependencies]
# `fallback-fonts`: the editor's faces, which the glyph test checks it covers.
balaur = { workspace = true, features = ["compile", "physics2d", "physics3d", "fallback-fonts"] }
tempfile = "3"
egui.workspace = true

[lints]
workspace = true
