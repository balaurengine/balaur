[package]
name = "balaur_ui"
description = "Balaur UI plugin: an immediate-mode egui API for scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
balaur_core.workspace = true
balaur_plugin.workspace = true
egui.workspace = true
anyhow.workspace = true
toml.workspace = true
serde.workspace = true
balaur_script.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
# The wave in marked-up text is drawn with a sine that must not vary by OS.
libm.workspace = true
cosmic-text = { version = "0.19", default-features = false, features = ["std", "shape-run-cache", "swash"] }
unicode-script = "0.5"

[dev-dependencies]
balaur.workspace = true
tempfile = "3"
egui.workspace = true

[lints]
workspace = true
