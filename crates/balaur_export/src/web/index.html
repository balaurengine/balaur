<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>{{title}}</title>
{{icons}}
<style>
  /* The safe area, where the engine reads it: `render.safe_area()`. */
  :root { --balaur-safe-left: env(safe-area-inset-left); --balaur-safe-top: env(safe-area-inset-top);
          --balaur-safe-right: env(safe-area-inset-right); --balaur-safe-bottom: env(safe-area-inset-bottom); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* `cover`: until the engine presents at a new window size, the browser
     scales its last frame evenly instead of stretching it to the new shape. */
  canvas { display: block; width: 100vw; height: 100vh; object-fit: cover;
           outline: none; touch-action: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #ddd; font: 16px/1.4 system-ui, sans-serif; text-align: center; padding: 1em;
            background: #000; }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="status">Loading…</div>
<script type="module">
  import init, { start } from "./balaur.js";
  const status = document.getElementById("status");
  const canvas = document.getElementById("canvas");
  // The page stays over the canvas until the game's first frame is on it:
  // the runtime says so with a `balaur-ready` event on the window.
  addEventListener("balaur-ready", () => { status.hidden = true; }, { once: true });
  try {
    await init();
    canvas.focus();
    await start("canvas", "./{{pack}}");
  } catch (error) {
    status.hidden = false;
    status.textContent = String(error);
  }
</script>
</body>
</html>
