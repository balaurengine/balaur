[package]
name = "balaur_platform"
description = "Balaur platform services: one script module over every store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
test = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
balaur_core.workspace = true
balaur_plugin.workspace = true
balaur_script.workspace = true
anyhow.workspace = true
tracing.workspace = true

# The Java shims in `crates/*/java`, which the Android template carries as its
# `classes.dex` (scripts/package_runtime.sh), reached over JNI; `android.rs`
# holds what every crate with one shares.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

# A page's motor, `navigator.vibrate` (`device.vibrate`).
[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3.106", features = ["Navigator", "Window"] }
js-sys = "0.3.106"

[dev-dependencies]
balaur_testkit.workspace = true
tempfile = "3"
# `apple` as every template has it, so a test reads the same store whether
# the workspace or this crate alone is built.
balaur = { workspace = true, features = ["compile", "physics2d", "physics3d", "apple"] }

[lints]
workspace = true
