[package]
name = "balaur_render"
description = "Balaur rendering plugin: renderable components, with a kiss3d backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
balaur_cfg.workspace = true

[features]
default = ["compile"]
# The WESL linker: a material's shader linked when it loads, and the editor's
# shader preview. Off, every shader comes from the table an export wrote into
# the pack (`prelinked`).
compile = ["dep:wesl"]
# The windowed kiss3d/wgpu backend. Off by default so headless tools, tests,
# and servers build without a graphics stack.
window = ["dep:kiss3d", "dep:pollster", "dep:balaur_text", "dep:balaur_ui", "dep:egui", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-ui-kit", "dep:windows-sys", "dep:libloading", "dep:bytemuck"]
# `balaur import file.aseprite`: reads the editor's own format. A tool's
# dependency, so a game build carries none of it.
aseprite = ["dep:aseprite-loader"]

[dependencies]
balaur_core.workspace = true
balaur_plugin.workspace = true
glamx.workspace = true
anyhow.workspace = true
balaur_script.workspace = true
tracing.workspace = true
toml.workspace = true
# The prelinked shader table, deflated in the pack: a host serves a `.bpak` as
# it is, and the table is mostly repeated WGSL. png links the same crate.
flate2 = "1"
# Emitter spread goes through sin/cos; the platform libm differs across
# operating systems and this one does not.
libm.workspace = true
# Balaur draws text with balaur_text, hands egui its fonts and decodes images
# through balaur_core, so kiss3d's own text, faces and codecs stay out.
kiss3d = { version = "0.46", optional = true, default-features = false, features = ["egui"] }
egui = { workspace = true, optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "1", optional = true }
balaur_input = { workspace = true }
balaur_text = { workspace = true, optional = true }
balaur_ui = { workspace = true, optional = true }
# Not optional, and `webp` with it: a sprite's size comes off its image header
# in every build, and an export may rewrite that PNG as lossless WebP.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# Geometry only, never in a public signature: ARCHITECTURE.md "parry: geometry
# every crate may use". `enhanced-determinism` is named, not inherited.
parry3d = { version = "0.31", default-features = false, features = ["dim3", "f32", "std", "alloc", "enhanced-determinism"] }
aseprite-loader = { version = "0.4", optional = true }
# Not optional: linking a shader is CPU work, and `eval` validates one — and
# asserts on a `@const` function — before naga and without a GPU, which is what
# lets a headless test catch a shader that will not link.
wesl = { version = "0.5", features = ["eval"], optional = true }

# A hidden tab gets no animation frames, so the simulation is stepped on a
# timer there instead; the page's clock and visibility come from web-sys.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["CssStyleDeclaration", "Document", "Element", "MediaQueryList", "Navigator", "VisualViewport", "Window"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSApplication", "NSImage", "NSResponder"], optional = true }
objc2-foundation = { version = "0.3", optional = true }

# Dark mode, asked of each system its own way: `appearance.rs`.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", optional = true }
objc2-ui-kit = { version = "0.3", features = ["UIInterface", "UIResponder", "UIScreen", "UITraitCollection", "UIView"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = { version = "0.9", optional = true }

[dev-dependencies]
balaur = { workspace = true, features = ["compile", "physics2d", "physics3d"] }
tempfile = "3"
# Validates a linked shader's types without a GPU, as wgpu will at
# `create_shader_module`, and writes it as the GLSL ES a GLES device compiles.
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }

[lints]
workspace = true
