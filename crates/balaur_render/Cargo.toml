[package]
name = "balaur_render"
description = "Balaur rendering plugin: renderable components, with a kiss3d backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# The windowed kiss3d/wgpu backend. Off by default so headless tools, tests,
# and servers build without a graphics stack.
kiss3d = ["dep:kiss3d", "dep:pollster", "dep:balaur_input", "dep:balaur_ui", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:wgpu", "dep:bytemuck"]

[dependencies]
balaur_core.workspace = true
balaur_plugin.workspace = true
glamx.workspace = true
anyhow.workspace = true
balaur_script.workspace = true
tracing.workspace = true
toml.workspace = true
# Emitter spread goes through sin/cos; the platform libm differs across
# operating systems and this one does not.
libm.workspace = true
kiss3d = { version = "0.46", optional = true, features = ["egui"] }
# The same wgpu kiss3d builds against: the skinned polygon material is
# written here against kiss3d's material trait, so the types must unify.
wgpu = { version = "30", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "1", optional = true }
balaur_input = { workspace = true, optional = true }
balaur_ui = { workspace = true, optional = true }
# Not optional: a sprite sized from its image puts that size in a component
# scripts read, so a headless build has to compute it too.
image = { version = "0.25", default-features = false, features = ["png"] }
# Not optional: linking a shader is CPU work, and `eval` validates one — and
# asserts on a `@const` function — before naga and without a GPU, which is what
# lets a headless test catch a shader that will not link.
wesl = { version = "0.4", features = ["eval"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"], optional = true }
objc2-foundation = { version = "0.3", optional = true }

[dev-dependencies]
balaur.workspace = true
tempfile = "3"

[lints]
workspace = true
