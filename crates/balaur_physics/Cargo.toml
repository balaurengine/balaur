[package]
name = "balaur_physics"
description = "Balaur plugin wrapping the Rapier physics engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
balaur_core.workspace = true
balaur_plugin.workspace = true
# `scalar.rs` is the seam between rapier's `Real` and the engine's `f32`.
rapier3d = { workspace = true }
rapier2d = { workspace = true }
# Cutting and intersecting meshes need parry's `spade` feature, which rapier
# leaves off; naming parry here turns it on for the copy rapier uses.
parry3d = { version = "0.30.2", features = ["spade"] }
parry2d = { version = "0.30.2", features = ["spade"] }
glamx.workspace = true
anyhow.workspace = true
balaur_script.workspace = true
tracing.workspace = true
toml.workspace = true
# Sizes the pool rapier's solver runs on.
rayon = "1"


[dev-dependencies]
balaur.workspace = true
tempfile = "3"

[lints]
workspace = true
