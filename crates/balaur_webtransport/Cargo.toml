[package]
name = "balaur_webtransport"
description = "Balaur WebTransport plugin: a QUIC Transport for rollback sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The link type, its Transport impl and Accept are the same everywhere; only
# the QUIC stack below is native.
[dependencies]
balaur_core.workspace = true
anyhow.workspace = true
tracing.workspace = true

# The browser: WebTransport through a hand-written shim, because web-sys puts
# its binding behind the web_sys_unstable_apis rustflag. See src/browser.rs.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

# QUIC is native-only: a browser has no UDP socket and reaches WebTransport
# through its own API instead (src/browser.rs). rcgen, rustls and ring go with
# it — a browser is a client, and pins a hash rather than holding a key.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# `ring` rather than the default `aws-lc-rs`: it matches the rustls backend
# the websocket crate already picks, and needs no C toolchain.
web-transport-quinn = { version = "0.12", default-features = false, features = ["ring"] }
# The crate is async; one current-thread runtime per link bridges it to the
# engine's polled model. No multi-thread scheduler: a link is one socket.
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "macros", "time"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = "0.13"
# Certificate hashes, the way a client pins a self-signed server. Already in
# the tree under rustls; taken directly so the digest is not reimplemented.
ring = "0.17"
# `Client::connect` takes a parsed url, not a string.
url = "2"

[dev-dependencies]
balaur_core.workspace = true
# The lockstep test drives a real session, whose inputs are script values.
balaur_script.workspace = true

[lints]
workspace = true
