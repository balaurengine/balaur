[package]
name = "balaur_text"
description = "Balaur text: shaping, font discovery and glyph outlines for UI and world text"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
balaur_geometry.workspace = true
balaur_core.workspace = true
balaur_plugin.workspace = true
egui.workspace = true
anyhow.workspace = true
tracing.workspace = true
toml.workspace = true
# Bitmap font pages are PNGs.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# The wave in marked-up text is drawn with a sine that must not vary by OS.
libm.workspace = true
# `monospace_fallback` measures a monospace face's advance, which
# `monospace_width` resizes it to.
cosmic-text = { version = "0.19", default-features = false, features = ["std", "shape-run-cache", "swash", "monospace_fallback"] }
unicode-script = "0.5"
# Which characters want a face of their own, and which draw as emoji.
unicode-properties = { version = "0.1", default-features = false, features = ["emoji", "general-category"] }
# A caret moves and deletes by grapheme and by word (`edit.rs`).
unicode-segmentation = "1"
# A glyph's outline, for text that is geometry rather than an atlas quad.
# The version is cosmic-text's, so `Font::as_swash` hands back this crate's
# `FontRef` and not a second copy of it.
swash = "0.2.10"

# The operating system's faces, asked for once a text needs one: CoreText,
# DirectWrite, Android's list, and fontconfig opened at run time, so a machine
# without it draws no fallback rather than failing to start.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }
# The operating system's faces, mapped for the shaper and egui alike.
memmap2 = "0.9"

[lints]
workspace = true
