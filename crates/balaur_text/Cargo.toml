[package]
name = "balaur_text"
description = "Balaur text: shaping, font discovery and glyph outlines for UI and world text"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
balaur_core.workspace = true
balaur_plugin.workspace = true
egui.workspace = true
anyhow.workspace = true
tracing.workspace = true
# Bitmap font pages are PNGs.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# The wave in marked-up text is drawn with a sine that must not vary by OS.
libm.workspace = true
cosmic-text = { version = "0.19", default-features = false, features = ["std", "shape-run-cache", "swash"] }
unicode-script = "0.5"
# A glyph's outline, for text that is geometry rather than an atlas quad.
# The version is cosmic-text's, so `Font::as_swash` hands back this crate's
# `FontRef` and not a second copy of it.
swash = "0.2.10"

[lints]
workspace = true
