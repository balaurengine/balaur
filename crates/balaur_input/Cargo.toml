[package]
name = "balaur_input"
description = "Balaur input plugin: backend-agnostic input state and the `input` Lua module"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
balaur_core.workspace = true
anyhow.workspace = true
balaur_script.workspace = true
tracing.workspace = true

# Gamepads. gilrs only has desktop backends (evdev, XInput, IOKit) plus a
# wasm-bindgen one our emscripten web target cannot use, so wasm builds skip
# it and the gamepad snapshot just stays empty there — same neutral-answer
# rule as a headless keyboard.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gilrs = "0.11"

[lints]
workspace = true
