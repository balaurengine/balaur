[package]
name = "balaur_input"
description = "Balaur input plugin: backend-agnostic input state and the `input` Lua module"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
balaur_core.workspace = true
balaur_plugin.workspace = true
anyhow.workspace = true
balaur_script.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

# gilrs has no backend our emscripten target can use, so wasm builds skip it
# and the gamepad snapshot stays empty there — the headless neutral-answer rule.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gilrs = "0.11"

# Motion and the touchpad, which gilrs does not read: decoded from the pad's own
# HID reports. Without `macos-shared-device` hidapi takes the pad from gilrs.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
hidapi = { version = "2.6", features = ["macos-shared-device"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
