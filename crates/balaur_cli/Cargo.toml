[package]
name = "balaur_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "balaur"
path = "src/main.rs"

[features]
default = ["audio", "net"]
# Build with a real window (kiss3d/wgpu). Without it, runs are headless.
window = ["balaur/window"]
# Sound. Off, the build drops rodio, cpal and the platform audio stack.
audio = ["balaur/audio"]
# Load extensions from a project's extensions/ directory.
extensions = ["balaur/extensions"]
# `http.*` and `websocket.*` for scripts. Off, the build drops ureq,
# tungstenite and the TLS stack.
net = ["balaur/net"]

[dependencies]
balaur = { workspace = true, default-features = false }
anyhow.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
tracing.workspace = true

[lints]
workspace = true
