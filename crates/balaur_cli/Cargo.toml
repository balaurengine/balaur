[package]
name = "balaur_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "balaur"
path = "src/main.rs"

[features]
default = ["audio", "net", "gamend"]
# Build with a real window (kiss3d/wgpu). Without it, runs are headless.
window = ["balaur/window"]
# Sound. Off, the build drops rodio, cpal and the platform audio stack.
audio = ["balaur/audio"]
# Load extensions from a project's extensions/ directory.
extensions = ["balaur/extensions"]
# `http.*` and `websocket.*` for scripts. Off, the build drops ureq,
# tungstenite and the TLS stack.
net = ["balaur/net"]
# `gamend.*` for scripts: the Gamend backend (auth, REST, realtime, hooks).
gamend = ["balaur/gamend"]

[dependencies]
balaur = { workspace = true, default-features = false }
anyhow.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
tracing.workspace = true

# Template download and self-update; the web build has neither, so wasm
# skips the whole stack.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq.workspace = true
sha2 = "0.10"
dirs = "6"

[target.'cfg(all(not(target_family = "wasm"), not(windows)))'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
