[package]
name = "balaur_cli"
description = "The `balaur` command: run, edit, export, replay and check a project"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "balaur"
path = "src/main.rs"

[features]
default = ["audio", "http", "websocket", "webtransport", "gamend", "web"]
# Build with a real window (kiss3d/wgpu). Without it, runs are headless.
window = ["balaur/window"]
# Sound. Off, the build drops rodio, cpal and the platform audio stack.
audio = ["balaur/audio"]
# Load extensions from a project's extensions/ directory.
extensions = ["balaur/extensions"]
# `http.*` for scripts. Off, the build drops ureq and its TLS stack.
http = ["balaur/http"]
# `websocket.*` for scripts, and the websocket `Transport`.
websocket = ["balaur/websocket"]
# The WebTransport `Transport`, over QUIC.
webtransport = ["balaur/webtransport"]
# `gamend.*` for scripts: the Gamend backend (auth, REST, realtime, hooks).
gamend = ["balaur/gamend"]
# `web.*` for scripts: the page a browser build runs in. Native builds answer
# nil, so a script written for the web still runs on a desktop.
web = ["balaur/web"]
# `apple.*` for scripts, and Game Center and iCloud under `platform.*`. The
# Apple templates ship with it on, because a template is prebuilt and a game
# cannot add a framework to one it was handed.
apple = ["balaur/apple"]

[dependencies]
balaur = { workspace = true, default-features = false }
balaur_export.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
tracing.workspace = true

# Template download and self-update; the web build has neither, so wasm
# skips the whole stack.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq.workspace = true
sha2.workspace = true
dirs = "6"

[target.'cfg(all(not(target_family = "wasm"), not(windows)))'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }

# The browser entry point (src/web.rs): a fetch for the pack, the canvas to
# draw on, and panics reported on the console instead of as `unreachable`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response", "Storage"] }
# The user directory is mirrored into localStorage as text.
base64 = "0.22"
console_error_panic_hook = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
