# The browser backend's C shim needs these at link (crates/balaur_net/build.rs);
# cargo cannot propagate link args out of the library that owns them. Setting
# the RUSTFLAGS env var replaces this wholesale.
[target.wasm32-unknown-emscripten]
rustflags = ["-Clink-arg=-sFETCH", "-Clink-arg=-lwebsocket.js"]
