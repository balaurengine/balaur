# The browser backends' C shims need these at link, and cargo cannot propagate
# a link arg out of the library that owns them. Setting the RUSTFLAGS env var
# replaces this table wholesale, so no workflow may set it.
[target.wasm32-unknown-emscripten]
rustflags = [
    "-Clink-arg=-sFETCH",
    "-Clink-arg=-lwebsocket.js",
    # egui depends on web-sys for every wasm32 target, emscripten included,
    # where wasm-bindgen's intrinsics have no implementation and nothing calls
    # them. package_template.sh checks that only those stay undefined.
    "-Clink-arg=-sERROR_ON_UNDEFINED_SYMBOLS=0",
]

# The StoreKit shim needs Swift's concurrency runtime, which ships under
# /usr/lib/swift and sits on no default search path. Here rather than in the
# Apple crate's build.rs because a link arg does not propagate out of a lib.
[target.aarch64-apple-darwin]
rustflags = ["-Clink-arg=-Wl,-rpath,/usr/lib/swift"]

[target.x86_64-apple-darwin]
rustflags = ["-Clink-arg=-Wl,-rpath,/usr/lib/swift"]

[target.aarch64-apple-ios]
rustflags = ["-Clink-arg=-Wl,-rpath,/usr/lib/swift"]

[target.aarch64-apple-ios-sim]
rustflags = ["-Clink-arg=-Wl,-rpath,/usr/lib/swift"]
