# The editor's shell as a tree of boxes; `arrange.rn` turns it into the rects
# `layout.rn` publishes. Properties are the `widget` component's, and a size
# that moves with the window is stated by `layout.rn` rather than here.

[[nodes]]
id = "shell"
[nodes.widget]
kind = "column"
padding = 14
gap = 12

# The persona bar and the command field float over this row; it is here to
# hold the height they need and to push the body down.
[[nodes]]
id = "head"
parent = "shell"
[nodes.widget]
kind = "row"
height = 36

[[nodes]]
id = "body"
parent = "shell"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

[[nodes]]
id = "left"
parent = "body"
[nodes.widget]
kind = "panel"

[[nodes]]
id = "centre"
parent = "body"
[nodes.widget]
kind = "column"
grow = 1
gap = 12

[[nodes]]
id = "right"
parent = "body"
[nodes.widget]
kind = "panel"

# Everything above the bottom dock. The tool rail sits in its own column so
# the tabs and the scene start clear of it, while the dock below does not.
[[nodes]]
id = "upper"
parent = "centre"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

[[nodes]]
id = "bottom"
parent = "centre"
[nodes.widget]
kind = "panel"

[[nodes]]
id = "railslot"
parent = "upper"
[nodes.widget]
kind = "panel"

[[nodes]]
id = "work"
parent = "upper"
[nodes.widget]
kind = "column"
grow = 1
gap = 6

[[nodes]]
id = "tabs"
parent = "work"
[nodes.widget]
kind = "panel"
height = 36

[[nodes]]
id = "canvas"
parent = "work"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

# What is left of the canvas once the hooks list has taken its width. The
# code pane and the scene share it; `layout.rn` decides how.
[[nodes]]
id = "stage"
parent = "canvas"
[nodes.widget]
kind = "panel"
grow = 1

[[nodes]]
id = "hooks"
parent = "canvas"
[nodes.widget]
kind = "panel"
