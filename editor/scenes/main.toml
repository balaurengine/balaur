# One node with the script, and the shell as `widget` nodes the engine lays
# out for `layout.rn` to read back. They paint nothing and have their own
# surface, so the rect a game's HUD is confined to never reaches them.

[[nodes]]
id = "n_editor"
name = "Editor"
script = "scripts/editor.rn"

[[nodes]]
id = "shell"
name = "Shell"
parent = "n_editor"
[nodes.widget]
theme = "themes/dark.toml"
kind = "column"
layer = "shell"
anchor = "top_left"
x = 0
y = 0
padding = 14
gap = 12

# The one bar across the top: brand, personas, the open documents, and the
# transport. It floats over this row, which holds the height and pushes the
# body down.
[[nodes]]
id = "head"
name = "Head"
parent = "shell"
[nodes.widget]
kind = "panel"
text = ""
# The bar's own row is 30, and this sheet keeps 5 inside each edge: the one
# strip that is chrome from edge to edge takes less than a panel would.
height = 40
padding = 5
gap = 0

[[nodes]]
id = "head_body"
name = "HeadBody"
parent = "head"
[nodes.widget]
kind = "draw"
draw = "draw_top_bar"
grow = 1

[[nodes]]
id = "body"
name = "Body"
parent = "shell"
[nodes.widget]
kind = "row"
grow = 1
gap = 12
handle = 12

# The column a side dock owns, and the sheet inside it. Two boxes rather than
# one: folded, the sheet is a square at the top and the rest of the column is
# the scene's, which a painted panel of the full height could not be.
[[nodes]]
id = "left"
name = "Left"
parent = "body"
[nodes.widget]
kind = "column"
width = 236

[[nodes]]
id = "left_sheet"
name = "LeftSheet"
parent = "left"
[nodes.widget]
kind = "panel"
text = ""
grow = 1
# What a sheet keeps inside its edge. Stated rather than left to the widget
# theme because a folded dock writes a smaller one and needs this back.
padding = 8

[[nodes]]
id = "left_body"
name = "LeftBody"
parent = "left_sheet"
[nodes.widget]
kind = "draw"
draw = "draw_dock_left"

[[nodes]]
id = "left_tree"
name = "LeftTree"
parent = "left_sheet"
[nodes.widget]
kind = "tree"
grow = 1

[[nodes]]
id = "left_outline"
name = "LeftOutline"
parent = "left_sheet"
[nodes.widget]
kind = "list"
visible = false
grow = 1

# The tool rail down one side, and everything else beside it. The rail is a
# column of the whole height so the dock below starts clear of it too.
[[nodes]]
id = "centre"
name = "Centre"
parent = "body"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

[[nodes]]
id = "right"
name = "Right"
parent = "body"
[nodes.widget]
kind = "column"
width = 288

[[nodes]]
id = "right_sheet"
name = "RightSheet"
parent = "right"
[nodes.widget]
kind = "panel"
text = ""
grow = 1
padding = 8

# The right sheet in three: the header and the search the panel draws, the
# rows the pool makes, and the footer that must stay under a long form.
[[nodes]]
id = "right_body"
name = "RightBody"
parent = "right_sheet"
[nodes.widget]
kind = "draw"
draw = "draw_dock_right"
# Stated, not measured: a `draw` node with neither a size nor a `grow` takes
# whatever is left, which is the whole sheet. `layout.rn` writes the real one.
height = 118

[[nodes]]
id = "right_scroll"
name = "RightScroll"
parent = "right_sheet"
[nodes.widget]
kind = "scroll"
grow = 1

[[nodes]]
id = "right_foot"
name = "RightFoot"
parent = "right_sheet"
[nodes.widget]
kind = "draw"
draw = "draw_dock_right_foot"
height = 36

# The Inspector's and Import's rows: a form whose fields change with the
# selection, so `pool.rn` makes them and hides the spares.
[[nodes]]
id = "right_form"
name = "RightForm"
parent = "right_scroll"
[nodes.widget]
kind = "column"
visible = false
# No `grow`: inside a scroll there is no leftover to divide, so the column
# takes what its rows measure and the bar makes up the difference.
gap = 2

[[nodes]]
id = "railslot"
name = "RailSlot"
parent = "centre"
[nodes.widget]
kind = "column"
width = 44

# The rail is only as tall as its tools, so it takes the top of the slot
# rather than the whole of it; `layout.rn` states the height.
[[nodes]]
id = "rail"
name = "Rail"
parent = "railslot"
[nodes.widget]
kind = "row"
height = 42

# The scene and the dock, stacked beside the rail.
[[nodes]]
id = "stack"
name = "Stack"
parent = "centre"
[nodes.widget]
kind = "column"
grow = 1
gap = 12

[[nodes]]
id = "upper"
name = "Upper"
parent = "stack"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

[[nodes]]
id = "bottom"
name = "Bottom"
parent = "stack"
[nodes.widget]
kind = "panel"
text = ""
height = 174
gap = 0

# What a dock panel may scroll, and the status strip sharing the same sheet so
# a tall panel cannot push it off the bottom.
[[nodes]]
id = "dockbody"
name = "DockBody"
parent = "bottom"
[nodes.widget]
kind = "draw"
draw = "draw_dock_bottom"
grow = 1

# The log-shaped panels, as one node. `dock.rn` fills whichever is up and hides
# it for the rest; the hatch above draws the tab row, so this sits under it.
[[nodes]]
id = "bottom_log"
name = "BottomLog"
parent = "bottom"
[nodes.widget]
kind = "list"
visible = false
grow = 1
row_height = 18
font = "mono"

# The Debugger's call stack: frames, with each frame's locals a level in.
[[nodes]]
id = "bottom_tree"
name = "BottomTree"
parent = "bottom"
[nodes.widget]
kind = "tree"
visible = false
grow = 1
font = "mono"

# Assets, Library and Tiles: three card grids, one node. Only one of them is
# the bottom dock's active panel, so they take turns filling it.
[[nodes]]
id = "bottom_cards"
name = "BottomCards"
parent = "bottom"
[nodes.widget]
kind = "list"
visible = false
grow = 1
columns = 6

[[nodes]]
id = "status"
name = "Status"
parent = "bottom"
[nodes.widget]
kind = "draw"
draw = "draw_status"
height = 24

[[nodes]]
id = "work"
name = "Work"
parent = "upper"
[nodes.widget]
kind = "column"
grow = 1
gap = 6

[[nodes]]
id = "canvas"
name = "Canvas"
parent = "work"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

# What is left of the canvas once the hooks list has taken its width. The
# code pane and the scene share it; `layout.rn` decides how.
[[nodes]]
id = "stage"
name = "Stage"
parent = "canvas"
[nodes.widget]
kind = "row"
grow = 1

# The file's engine-facing surface, beside the code. `layout.rn` writes 0 here
# when it is closed; this is what it opens back to.
[[nodes]]
id = "hooks"
name = "Hooks"
parent = "canvas"
[nodes.widget]
kind = "row"
width = 172
