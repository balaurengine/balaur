# One node with the script, and the shell as `widget` nodes the engine lays
# out for `layout.rn` to read back. They paint nothing and have their own
# surface, so the rect a game's HUD is confined to never reaches them.

[[nodes]]
id = "n_editor"
name = "Editor"
script = { source = "scripts/editor.rn" }

[[nodes]]
id = "shell"
name = "Shell"
parent = "n_editor"
[nodes.widget]
kind = "column"
interactive = false
layer = "shell"
# What a notch or a home bar covers is not the shell's to draw in. Anchored
# `fill`, the engine sizes and places it, insets and all; nothing patches it.
safe_area = ["left", "top", "right", "bottom"]
anchor = "fill"
role = "layout_shell"

# The one bar across the top: brand, workspaces, the open documents, and the
# transport. It floats over this row, which holds the height and pushes the
# body down.
[[nodes]]
id = "head"
name = "Head"
parent = "shell"
script = { source = "scripts/panels/topbar.rn" }
[nodes.widget]
kind = "panel"
text = ""
# The bar's own row is 30, and this sheet keeps 5 inside each edge: the one
# strip that is chrome from edge to edge takes less than a panel would.
height = 40
padding = 5
gap = [0, 0]
# Its contents are 33 where a finger reaches them, and a sheet that kept 40
# would leave them 30 and show the difference as one-sided padding.
[nodes.widget.touch]
height = 43

# A panel stacks what is in it, so the bar's own direction is this row.
[[nodes]]
id = "head_row"
name = "HeadRow"
parent = "head"
[nodes.widget]
kind = "row"
grow = 1
gap = [8, 8]
align_items = "center"

# The brand, the shell's one menu, then a strip: how many workspaces and
# documents there are changes with what is open, so `chrome.rn` fills both.
[[nodes]]
id = "brand"
name = "Brand"
parent = "head_row"
[nodes.widget]
kind = "menu"
role = "action_brand"
tooltip = "Menu"
gap = [0, 0]

# Longer than a narrow window, and than any window once enough documents are
# open, so it clips and drags sideways rather than drawing past the bar. A
# scroll measures nothing on either axis, so it states the bar's own height.
[[nodes]]
id = "head_scroll"
name = "HeadScroll"
parent = "head_row"
[nodes.widget]
kind = "scroll"
role = "header_toolbar"
axis = "horizontal"
grow = 1
scroll_deadzone = 6

[[nodes]]
id = "head_strip"
name = "HeadStrip"
parent = "head_scroll"
[nodes.widget]
kind = "row"
gap = [4, 4]
align_items = "center"

[[nodes]]
id = "body"
name = "Body"
parent = "shell"
[nodes.widget]
kind = "row"
interactive = false
grow = 1
gap = [12, 12]
splitter_width = 12

# The column a side dock owns, and the sheet inside it. Two boxes rather than
# one: folded, the sheet is a square at the top and the rest of the column is
# the scene's, which a painted panel of the full height could not be.
[[nodes]]
id = "left"
name = "Left"
parent = "body"
[nodes.widget]
kind = "column"
width = 236

[[nodes]]
id = "left_sheet"
name = "LeftSheet"
parent = "left"
script = { source = "scripts/panels/dock.rn" }
[nodes.widget]
kind = "panel"
text = ""
grow = 1
# What a sheet keeps inside its edge. Stated rather than left to the widget
# theme because a folded dock writes a smaller one and needs this back.
padding = 8

# The dock's tab row: one control a tab, and the mark that closes it.
[[nodes]]
id = "left_head"
name = "LeftHead"
parent = "left_sheet"
[nodes.widget]
kind = "row"
role = "header_dock"

# The tabs clip and drag sideways; the fold and the panel's own tools sit
# outside the scroll, so they stay reachable however many tabs there are.
[[nodes]]
id = "left_tabs"
name = "LeftTabs"
parent = "left_head"
[nodes.widget]
kind = "scroll"
role = "header_dock"
axis = "horizontal"
grow = 1
scroll_deadzone = 6

[[nodes]]
