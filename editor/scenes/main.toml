# One node with the script, and the shell as `widget` nodes the engine lays
# out for `layout.rn` to read back. They paint nothing and have their own
# surface, so the rect a game's HUD is confined to never reaches them.

[[nodes]]
id = "n_editor"
name = "Editor"
script = { source = "scripts/editor.rn" }

[[nodes]]
id = "shell"
name = "Shell"
parent = "n_editor"
[nodes.widget]
theme = "themes/dark.toml"
kind = "column"
layer = "shell"
anchor = "top_left"
x = 0
y = 0
padding = 14
gap = 12

# The one bar across the top: brand, personas, the open documents, and the
# transport. It floats over this row, which holds the height and pushes the
# body down.
[[nodes]]
id = "head"
name = "Head"
parent = "shell"
[nodes.widget]
kind = "panel"
text = ""
# The bar's own row is 30, and this sheet keeps 5 inside each edge: the one
# strip that is chrome from edge to edge takes less than a panel would.
height = 40
padding = 5
gap = 0
# Its contents are 33 where a finger reaches them, and a sheet that kept 40
# would leave them 30 and show the difference as one-sided padding.
[nodes.widget.touch]
height = 43

# A panel stacks what is in it, so the bar's own direction is this row.
[[nodes]]
id = "head_row"
name = "HeadRow"
parent = "head"
[nodes.widget]
kind = "row"
grow = 1
gap = 8
align = "center"

# The brand, the shell's one menu, then a strip: how many personas and
# documents there are changes with what is open, so `chrome.rn` fills both.
[[nodes]]
id = "brand"
name = "Brand"
parent = "head_row"
[nodes.widget]
kind = "menu"
role = "brand"
tooltip = "Menu"
height = 26
gap = 0
[nodes.widget.touch]
height = 33

# Longer than a narrow window, and than any window once enough documents are
# open, so it clips and drags sideways rather than drawing past the bar. A
# scroll measures nothing on either axis, so it states the bar's own height.
[[nodes]]
id = "head_scroll"
name = "HeadScroll"
parent = "head_row"
[nodes.widget]
kind = "scroll"
axis = "horizontal"
grow = 1
height = 26
deadzone = 6
[nodes.widget.touch]
height = 33

[[nodes]]
id = "head_strip"
name = "HeadStrip"
parent = "head_scroll"
[nodes.widget]
kind = "row"
gap = 4
align = "center"

[[nodes]]
id = "body"
name = "Body"
parent = "shell"
[nodes.widget]
kind = "row"
grow = 1
gap = 12
handle = 12

# The column a side dock owns, and the sheet inside it. Two boxes rather than
# one: folded, the sheet is a square at the top and the rest of the column is
# the scene's, which a painted panel of the full height could not be.
[[nodes]]
id = "left"
name = "Left"
parent = "body"
[nodes.widget]
kind = "column"
width = 236

[[nodes]]
id = "left_sheet"
name = "LeftSheet"
parent = "left"
[nodes.widget]
kind = "panel"
text = ""
grow = 1
# What a sheet keeps inside its edge. Stated rather than left to the widget
# theme because a folded dock writes a smaller one and needs this back.
padding = 8

# The dock's tab row: one control a tab, and the mark that closes it.
[[nodes]]
id = "left_head"
name = "LeftHead"
parent = "left_sheet"
[nodes.widget]
kind = "row"
height = 24
gap = 3
[nodes.widget.touch]
height = 33

# The tabs clip and drag sideways; the fold and the panel's own tools sit
# outside the scroll, so they stay reachable however many tabs there are.
[[nodes]]
id = "left_tabs"
name = "LeftTabs"
parent = "left_head"
[nodes.widget]
kind = "scroll"
axis = "horizontal"
grow = 1
height = 24
deadzone = 6
[nodes.widget.touch]
height = 33

[[nodes]]
id = "left_tabs_row"
name = "LeftTabsRow"
parent = "left_tabs"
[nodes.widget]
kind = "row"
gap = 3
align = "center"

[[nodes]]
id = "left_tail"
name = "LeftTail"
parent = "left_head"
[nodes.widget]
kind = "row"
gap = 3
align = "center"

[[nodes]]
id = "left_body"
name = "LeftBody"
parent = "left_sheet"
[nodes.widget]
kind = "draw"
draw = "draw_dock_left"

[[nodes]]
id = "left_tree"
name = "LeftTree"
parent = "left_sheet"
[nodes.widget]
kind = "tree"
grow = 1

[nodes.widget.touch]
row_height = 33
[[nodes]]
id = "left_outline"
name = "LeftOutline"
parent = "left_sheet"
[nodes.widget]
kind = "list"
visible = false
grow = 1

# The tool rail down one side, and everything else beside it. The rail is a
# column of the whole height so the dock below starts clear of it too.
[nodes.widget.touch]
row_height = 33
[[nodes]]
id = "centre"
name = "Centre"
parent = "body"
[nodes.widget]
kind = "column"
grow = 1
gap = 12
handle = 12

# The rail and the scene share this row; the dock below is the centre's own
# child, so it runs the full width rather than starting clear of the rail.
[[nodes]]
id = "upper_row"
name = "UpperRow"
parent = "centre"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

[[nodes]]
id = "right"
name = "Right"
parent = "body"
[nodes.widget]
kind = "column"
width = 288

[[nodes]]
id = "right_sheet"
name = "RightSheet"
parent = "right"
[nodes.widget]
kind = "panel"
text = ""
grow = 1
padding = 8

# The right sheet in three: the header and the search the panel draws, the
# rows the pool makes, and the footer that must stay under a long form.
# The dock's tab row: one control a tab, and the mark that closes it.
[[nodes]]
id = "right_head"
name = "RightHead"
parent = "right_sheet"
[nodes.widget]
kind = "row"
height = 24
gap = 3
[nodes.widget.touch]
height = 33

# The tabs clip and drag sideways; the fold and the panel's own tools sit
# outside the scroll, so they stay reachable however many tabs there are.
[[nodes]]
id = "right_tabs"
name = "RightTabs"
parent = "right_head"
[nodes.widget]
kind = "scroll"
axis = "horizontal"
grow = 1
height = 24
deadzone = 6
[nodes.widget.touch]
height = 33

[[nodes]]
id = "right_tabs_row"
name = "RightTabsRow"
parent = "right_tabs"
[nodes.widget]
kind = "row"
gap = 3
align = "center"

[[nodes]]
id = "right_tail"
name = "RightTail"
parent = "right_head"
[nodes.widget]
kind = "row"
gap = 3
align = "center"

[[nodes]]
id = "right_body"
name = "RightBody"
parent = "right_sheet"
[nodes.widget]
kind = "draw"
draw = "draw_dock_right"
# Stated, not measured: a `draw` node with neither a size nor a `grow` takes
# whatever is left, which is the whole sheet. `layout.rn` writes the real one.
height = 96

[[nodes]]
id = "right_scroll"
name = "RightScroll"
parent = "right_sheet"
[nodes.widget]
kind = "scroll"
axis = "vertical"
grow = 1

[[nodes]]
id = "right_foot"
name = "RightFoot"
parent = "right_sheet"
# One button, so a pooled row rather than a hatch.
[nodes.widget]
kind = "row"
align = "center"
height = 36

# The Inspector's and Import's rows: a form whose fields change with the
# selection, so `pool.rn` makes them and hides the spares.
[[nodes]]
id = "right_form"
name = "RightForm"
parent = "right_scroll"
[nodes.widget]
kind = "column"
visible = false
# No `grow`: inside a scroll there is no leftover to divide, so the column
# takes what its rows measure and the bar makes up the difference.
gap = 2

[[nodes]]
id = "railslot"
name = "RailSlot"
parent = "upper_row"
[nodes.widget]
kind = "column"
width = 44
# The handle's row states its own air; an empty one would still hold the
# rail a gap below the stage's top.
gap = 0

# Where a folded left dock's handle goes, above the tools rather than beside
# them; `layout.rn` gives it a height only when there is one to draw.
[[nodes]]
id = "railtop"
name = "RailTop"
parent = "railslot"
[nodes.widget]
kind = "row"
height = 0

# The rail is only as tall as its tools, so it takes the top of the slot
# rather than the whole of it; `layout.rn` states the height.
[[nodes]]
id = "rail"
name = "Rail"
parent = "railslot"
[nodes.widget]
kind = "row"
height = 42

# The scene and the dock, stacked beside the rail.
[[nodes]]
id = "stack"
name = "Stack"
parent = "upper_row"
[nodes.widget]
kind = "column"
grow = 1
gap = 12

[[nodes]]
id = "upper"
name = "Upper"
parent = "stack"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

[[nodes]]
id = "bottom"
name = "Bottom"
parent = "centre"
[nodes.widget]
kind = "panel"
text = ""
height = 174
gap = 0

# What a dock panel may scroll, and the status strip sharing the same sheet so
# a tall panel cannot push it off the bottom.
[[nodes]]
id = "bottom_head"
name = "BottomHead"
parent = "bottom"
[nodes.widget]
kind = "row"
height = 24
gap = 3
[nodes.widget.touch]
height = 33

# The tabs clip and drag sideways; the fold and the panel's own tools sit
# outside the scroll, so they stay reachable however many tabs there are.
[[nodes]]
id = "bottom_tabs"
name = "BottomTabs"
parent = "bottom_head"
[nodes.widget]
kind = "scroll"
axis = "horizontal"
grow = 1
height = 24
deadzone = 6
[nodes.widget.touch]
height = 33

[[nodes]]
id = "bottom_tabs_row"
name = "BottomTabsRow"
parent = "bottom_tabs"
[nodes.widget]
kind = "row"
gap = 3
align = "center"

[[nodes]]
id = "bottom_tail"
name = "BottomTail"
parent = "bottom_head"
[nodes.widget]
kind = "row"
gap = 3
align = "center"

[[nodes]]
id = "dockbody"
name = "DockBody"
parent = "bottom"
[nodes.widget]
kind = "draw"
draw = "draw_dock_bottom"
grow = 1

# The log-shaped panels, as one node. `dock.rn` fills whichever is up and hides
# it for the rest; the hatch above draws the tab row, so this sits under it.
[[nodes]]
id = "bottom_log"
name = "BottomLog"
parent = "bottom"
[nodes.widget]
kind = "list"
visible = false
grow = 1
row_height = 18
font = "mono"

# The Debugger's call stack: frames, with each frame's locals a level in.
[nodes.widget.touch]
row_height = 33
[[nodes]]
id = "bottom_tree"
name = "BottomTree"
parent = "bottom"
[nodes.widget]
kind = "tree"
visible = false
grow = 1
font = "mono"

# Assets, Library and Tiles: three card grids, one node. Only one of them is
# the bottom dock's active panel, so they take turns filling it.
[nodes.widget.touch]
row_height = 33
[[nodes]]
id = "bottom_cards"
name = "BottomCards"
parent = "bottom"
[nodes.widget]
kind = "list"
visible = false
grow = 1
columns = 6

# The four views that genuinely paint: lanes with a transport, and two
# painting tools where the pointer is the input. A node each, so the scene
# names every view and a reader can see which of them draw.
[nodes.widget.touch]
row_height = 33
[[nodes]]
id = "bottom_timeline"
name = "BottomTimeline"
parent = "bottom"
[nodes.widget]
kind = "draw"
draw = "draw_view_timeline"
visible = false
grow = 1

[[nodes]]
id = "bottom_session"
name = "BottomSession"
parent = "bottom"
[nodes.widget]
kind = "draw"
draw = "draw_view_session"
visible = false
grow = 1

[[nodes]]
id = "bottom_weights"
name = "BottomWeights"
parent = "bottom"
[nodes.widget]
kind = "draw"
draw = "draw_view_weights"
visible = false
grow = 1

[[nodes]]
id = "bottom_bonemap"
name = "BottomBonemap"
parent = "bottom"
[nodes.widget]
kind = "draw"
draw = "draw_view_bonemap"
visible = false
grow = 1

[[nodes]]
id = "status"
name = "Status"
parent = "bottom"
# A pooled row, not a hatch: the strip is labels and a dot, so the theme can
# dress it and the layout can keep its boxes between passes.
[nodes.widget]
kind = "row"
align = "center"
gap = 8
height = 24

[[nodes]]
id = "work"
name = "Work"
parent = "upper"
[nodes.widget]
kind = "column"
grow = 1
gap = 6

[[nodes]]
id = "canvas"
name = "Canvas"
parent = "work"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

# What is left of the canvas once the hooks list has taken its width. The
# code pane and the scene share it; `layout.rn` decides how.
[[nodes]]
id = "stage"
name = "Stage"
parent = "canvas"
[nodes.widget]
kind = "row"
grow = 1

# The file's engine-facing surface, beside the code. `layout.rn` writes 0 here
# when it is closed; this is what it opens back to.
[[nodes]]
id = "hooks"
name = "Hooks"
parent = "canvas"
[nodes.widget]
kind = "row"
width = 172
