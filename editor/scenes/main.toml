# One node with the script, and the shell as `widget` nodes the engine lays
# out for `layout.rn` to read back. They paint nothing and have their own
# surface, so the rect a game's HUD is confined to never reaches them.

[[nodes]]
id = "n_editor"
name = "Editor"
script = "scripts/editor.rn"

[[nodes]]
id = "shell"
name = "Shell"
parent = "n_editor"
[nodes.widget]
kind = "column"
layer = "shell"
anchor = "top_left"
x = 0
y = 0
padding = 14
gap = 12

# The persona bar and the command field float over this row; it is here to
# hold the height they need and to push the body down.
[[nodes]]
id = "head"
name = "Head"
parent = "shell"
[nodes.widget]
kind = "row"
height = 36
gap = 0

# The persona bar is centred on the document column rather than the window, so
# it takes this band's height and states no width of its own.
[[nodes]]
id = "band"
name = "Band"
parent = "head"
[nodes.widget]
kind = "row"
grow = 1

[[nodes]]
id = "cmd"
name = "Cmd"
parent = "head"
[nodes.widget]
kind = "row"
width = 168
height = 30

[[nodes]]
id = "body"
name = "Body"
parent = "shell"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

[[nodes]]
id = "left"
name = "Left"
parent = "body"
[nodes.widget]
kind = "row"
width = 236

[[nodes]]
id = "centre"
name = "Centre"
parent = "body"
[nodes.widget]
kind = "column"
grow = 1
gap = 12

[[nodes]]
id = "right"
name = "Right"
parent = "body"
[nodes.widget]
kind = "row"
width = 288

# Everything above the bottom dock. The tool rail sits in its own column so
# the tabs and the scene start clear of it, while the dock below does not.
[[nodes]]
id = "upper"
name = "Upper"
parent = "centre"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

[[nodes]]
id = "bottom"
name = "Bottom"
parent = "centre"
[nodes.widget]
kind = "column"
height = 174
gap = 0

# What a dock panel may scroll, and the status strip sharing the same sheet so
# a tall panel cannot push it off the bottom.
[[nodes]]
id = "dockbody"
name = "DockBody"
parent = "bottom"
[nodes.widget]
kind = "column"
grow = 1

[[nodes]]
id = "status"
name = "Status"
parent = "bottom"
[nodes.widget]
kind = "row"
height = 24

[[nodes]]
id = "railslot"
name = "RailSlot"
parent = "upper"
[nodes.widget]
kind = "column"
width = 44

# The rail is only as tall as its tools, so it takes the top of the slot
# rather than the whole of it; `layout.rn` states the height.
[[nodes]]
id = "rail"
name = "Rail"
parent = "railslot"
[nodes.widget]
kind = "row"
height = 42

[[nodes]]
id = "work"
name = "Work"
parent = "upper"
[nodes.widget]
kind = "column"
grow = 1
gap = 6

[[nodes]]
id = "tabs"
name = "Tabs"
parent = "work"
[nodes.widget]
kind = "row"
height = 36

[[nodes]]
id = "canvas"
name = "Canvas"
parent = "work"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

# What is left of the canvas once the hooks list has taken its width. The
# code pane and the scene share it; `layout.rn` decides how.
[[nodes]]
id = "stage"
name = "Stage"
parent = "canvas"
[nodes.widget]
kind = "row"
grow = 1

# The file's engine-facing surface, beside the code. `layout.rn` writes 0 here
# when it is closed; this is what it opens back to.
[[nodes]]
id = "hooks"
name = "Hooks"
parent = "canvas"
[nodes.widget]
kind = "row"
width = 172
