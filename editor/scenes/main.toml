# One node with the script, and the shell as `widget` nodes the engine lays
# out for `layout.rn` to read back. They paint nothing and have their own
# surface, so the rect a game's HUD is confined to never reaches them.

[[nodes]]
id = "n_editor"
name = "Editor"
script = { source = "scripts/editor.rn" }

[[nodes]]
id = "shell"
name = "Shell"
parent = "n_editor"
[nodes.widget]
kind = "column"
interactive = false
layer = "shell"
# What a notch or a home bar covers is not the shell's to draw in. Anchored
# `fill`, the engine sizes and places it, insets and all; nothing patches it.
safe_area = ["left", "top", "right", "bottom"]
anchor = "fill"
role = "layout_shell"

# The one bar across the top: brand, workspaces, the open documents, and the
# transport. It floats over this row, which holds the height and pushes the
# body down.
[[nodes]]
id = "head"
name = "Head"
parent = "shell"
[nodes.widget]
kind = "panel"
text = ""
# The bar's own row is 30, and this sheet keeps 5 inside each edge: the one
# strip that is chrome from edge to edge takes less than a panel would.
height = 40
padding = 5
gap = [0, 0]
# Its contents are 33 where a finger reaches them, and a sheet that kept 40
# would leave them 30 and show the difference as one-sided padding.
[nodes.widget.touch]
height = 43

# A panel stacks what is in it, so the bar's own direction is this row.
[[nodes]]
id = "head_row"
name = "HeadRow"
parent = "head"
[nodes.widget]
kind = "row"
grow = 1
gap = [8, 8]
align_items = "center"

# The brand, the shell's one menu, then a strip: how many workspaces and
# documents there are changes with what is open, so `chrome.rn` fills both.
[[nodes]]
id = "brand"
name = "Brand"
parent = "head_row"
[nodes.widget]
kind = "menu"
role = "action_brand"
tooltip = "Menu"
gap = [0, 0]

# Longer than a narrow window, and than any window once enough documents are
# open, so it clips and drags sideways rather than drawing past the bar. A
# scroll measures nothing on either axis, so it states the bar's own height.
[[nodes]]
id = "head_scroll"
name = "HeadScroll"
parent = "head_row"
[nodes.widget]
kind = "scroll"
role = "header_toolbar"
axis = "horizontal"
grow = 1
scroll_deadzone = 6

[[nodes]]
id = "head_strip"
name = "HeadStrip"
parent = "head_scroll"
[nodes.widget]
kind = "row"
gap = [4, 4]
align_items = "center"

[[nodes]]
id = "body"
name = "Body"
parent = "shell"
[nodes.widget]
kind = "row"
interactive = false
grow = 1
gap = [12, 12]
splitter_width = 12

# The column a side dock owns, and the sheet inside it. Two boxes rather than
# one: folded, the sheet is a square at the top and the rest of the column is
# the scene's, which a painted panel of the full height could not be.
[[nodes]]
id = "left"
name = "Left"
parent = "body"
[nodes.widget]
kind = "column"
width = 236

[[nodes]]
id = "left_sheet"
name = "LeftSheet"
parent = "left"
script = { source = "scripts/panels/dock.rn" }
[nodes.widget]
kind = "panel"
text = ""
grow = 1
# What a sheet keeps inside its edge. Stated rather than left to the widget
# theme because a folded dock writes a smaller one and needs this back.
padding = 8

# The dock's tab row: one control a tab, and the mark that closes it.
[[nodes]]
id = "left_head"
name = "LeftHead"
parent = "left_sheet"
[nodes.widget]
kind = "row"
role = "header_dock"

# The tabs clip and drag sideways; the fold and the panel's own tools sit
# outside the scroll, so they stay reachable however many tabs there are.
[[nodes]]
id = "left_tabs"
name = "LeftTabs"
parent = "left_head"
[nodes.widget]
kind = "scroll"
role = "header_dock"
axis = "horizontal"
grow = 1
scroll_deadzone = 6

[[nodes]]
id = "left_tabs_row"
name = "LeftTabsRow"
parent = "left_tabs"
[nodes.widget]
kind = "row"
role = "layout_dock"
align_items = "center"

[[nodes]]
id = "left_tail"
name = "LeftTail"
parent = "left_head"
[nodes.widget]
kind = "row"
role = "layout_dock"
align_items = "center"

# The Scene tab, its own scene and script: see scenes/panels/scene_tree.toml.
[[nodes]]
id = "scene_tree"
name = "SceneTree"
parent = "left_sheet"
instance = "scenes/panels/scene_tree.toml"

# The Outline tab, its own scene and script: see scenes/panels/outline.toml.
[[nodes]]
id = "outline"
name = "Outline"
parent = "left_sheet"
instance = "scenes/panels/outline.toml"

# Where a plugin dock's own subtree goes on this side.
[[nodes]]
id = "left_plugins"
name = "LeftPlugins"
parent = "left_sheet"
[nodes.widget]
kind = "column"
visible = false
grow = 1

[[nodes]]
id = "centre"
name = "Centre"
parent = "body"
[nodes.widget]
kind = "column"
interactive = false
grow = 1
gap = [12, 12]
splitter_width = 12

# The rail and the scene share this row; the dock below is the centre's own
# child, so it runs the full width rather than starting clear of the rail.
[[nodes]]
id = "upper_row"
name = "UpperRow"
parent = "centre"
[nodes.widget]
kind = "row"
interactive = false
grow = 1
gap = [12, 12]

[[nodes]]
id = "right"
name = "Right"
parent = "body"
[nodes.widget]
kind = "column"
width = 288

[[nodes]]
id = "right_sheet"
name = "RightSheet"
parent = "right"
script = { source = "scripts/panels/dock.rn" }
[nodes.widget]
kind = "panel"
text = ""
grow = 1
padding = 8

# The right sheet in three: the header and the search the panel draws, the
# rows the pool makes, and the footer that must stay under a long form.
# The dock's tab row: one control a tab, and the mark that closes it.
[[nodes]]
id = "right_head"
name = "RightHead"
parent = "right_sheet"
[nodes.widget]
kind = "row"
role = "header_dock"

# The tabs clip and drag sideways; the fold and the panel's own tools sit
# outside the scroll, so they stay reachable however many tabs there are.
[[nodes]]
id = "right_tabs"
name = "RightTabs"
parent = "right_head"
[nodes.widget]
kind = "scroll"
role = "header_dock"
axis = "horizontal"
grow = 1
scroll_deadzone = 6

[[nodes]]
id = "right_tabs_row"
name = "RightTabsRow"
parent = "right_tabs"
[nodes.widget]
kind = "row"
role = "layout_dock"
align_items = "center"

[[nodes]]
id = "right_tail"
name = "RightTail"
parent = "right_head"
[nodes.widget]
kind = "row"
role = "layout_dock"
align_items = "center"

[[nodes]]
id = "right_body"
name = "RightBody"
parent = "right_sheet"
[nodes.widget]
kind = "draw"
draw = "draw_dock_right"
# Stated, not measured: a `draw` node with neither a size nor a `grow` takes
# whatever is left, which is the whole sheet. `layout.rn` writes the real one.
height = 96

# The Inspector, its own scene and script: see scenes/panels/inspector.toml.
[[nodes]]
id = "inspector"
name = "Inspector"
parent = "right_sheet"
instance = "scenes/panels/inspector.toml"

[[nodes]]
id = "right_scroll"
name = "RightScroll"
parent = "right_sheet"
[nodes.widget]
kind = "scroll"
axis = "vertical"
grow = 1

# Where a plugin dock's own subtree goes on this side.
[[nodes]]
id = "right_plugins"
name = "RightPlugins"
parent = "right_sheet"
[nodes.widget]
kind = "column"
visible = false
grow = 1

# Import's rows: a form whose fields change with the file, so `pool.rn`
# makes them and hides the spares.
[[nodes]]
id = "right_form"
name = "RightForm"
parent = "right_scroll"
[nodes.widget]
kind = "column"
visible = false
# No `grow`: inside a scroll there is no leftover to divide, so the column
# takes what its rows measure and the bar makes up the difference.
gap = [2, 2]

[[nodes]]
id = "railslot"
name = "RailSlot"
parent = "upper_row"
[nodes.widget]
kind = "column"
width = 44
# The handle's row states its own air; an empty one would still hold the
# rail a gap below the stage's top.
gap = [0, 0]

# Where a folded left dock's handle goes, above the tools rather than beside
# them; `layout.rn` gives it a height only when there is one to draw.
[[nodes]]
id = "railtop"
name = "RailTop"
parent = "railslot"
[nodes.widget]
kind = "row"
height = 0

# The rail is only as tall as its tools, so it takes the top of the slot
# rather than the whole of it; `layout.rn` states the height.
[[nodes]]
id = "rail"
name = "Rail"
parent = "railslot"
[nodes.widget]
kind = "row"
height = 42

# The scene and the dock, stacked beside the rail.
[[nodes]]
id = "stack"
name = "Stack"
parent = "upper_row"
[nodes.widget]
kind = "column"
interactive = false
grow = 1
gap = [12, 12]

[[nodes]]
id = "upper"
name = "Upper"
parent = "stack"
[nodes.widget]
kind = "row"
interactive = false
grow = 1
gap = [12, 12]

[[nodes]]
id = "bottom"
name = "Bottom"
parent = "centre"
script = { source = "scripts/panels/dock.rn" }
[nodes.widget]
kind = "panel"
text = ""
height = 174
gap = [0, 0]

# What a dock panel may scroll, and the status strip sharing the same sheet so
