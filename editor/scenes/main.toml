# One node with the script, and the shell as `widget` nodes the engine lays
# out for `layout.bs` to read back. The edited scene's widgets sit in the
# `Edited` viewport, kept to the stage.

[[nodes]]
id = "n_editor"
name = "Editor"
script = { source = "scripts/editor.bs" }

# The viewport's lines: drawn on the words that what they show moved, and
# kept until then. See scripts/panels/overlays.bs.
[[nodes]]
id = "viewport_lines"
name = "ViewportLines"
parent = "n_editor"
script = { source = "scripts/panels/overlays.bs" }

[[nodes]]
id = "shell"
name = "Shell"
parent = "n_editor"
[nodes.widget]
kind = "column"
interactive = false
# Anchored `fill`, the engine sizes and places it, insets and all; nothing
# patches it.
anchor = "fill"
role = "layout_shell"

# The one bar across the top: brand, workspaces, the open documents, and the
# transport. As tall as its row, which the theme states, and its inset.
[[nodes]]
id = "head"
name = "Head"
parent = "shell"
script = { source = "scripts/panels/topbar.bs" }
[nodes.widget]
kind = "panel"
role = "header_shell"

# A panel stacks what is in it, so the bar's own direction is this row.
[[nodes]]
id = "head_row"
name = "HeadRow"
parent = "head"
[nodes.widget]
kind = "row"
role = "layout_bar"
grow = 1
[nodes.widget_layout]
align_items = "center"

# The brand, the shell's one menu, then the strip of the bar's buttons.
[[nodes]]
id = "brand"
name = "Brand"
parent = "head_row"
[nodes.widget]
kind = "menu"
role = "action_brand"
tooltip = "Menu"
[nodes.widget_button]
face_gap = 4

# The menu's rows, each named for the command it runs; `menu.bs` writes their
# labels and chords from the command table.
[[nodes]]
id = "brand_palette"
name = "palette"
parent = "brand"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "item_menu"

[[nodes]]
id = "brand_settings"
name = "settings"
parent = "brand"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "item_menu"

[[nodes]]
id = "brand_theme"
name = "theme"
parent = "brand"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "item_menu"

[[nodes]]
id = "brand_export"
name = "export"
parent = "brand"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "item_menu"

[[nodes]]
id = "brand_about"
name = "about"
parent = "brand"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "item_menu"

[[nodes]]
id = "brand_rule"
name = "Rule"
parent = "brand"
[nodes.widget]
kind = "separator"

[[nodes]]
id = "brand_heading"
name = "Heading"
parent = "brand"
[nodes.widget]
kind = "label"
role = "text_heading"
text = "Panels"

# Every panel, two to a line: seventeen down one column outgrow the window.
[[nodes]]
id = "brand_panels"
name = "Panels"
parent = "brand"
[nodes.widget]
kind = "grid"
[nodes.widget_grid]
grid_columns = "1fr 1fr"

[[nodes]]
id = "brand_rule_end"
name = "RuleEnd"
parent = "brand"
[nodes.widget]
kind = "separator"

[[nodes]]
