# One node with the script, and the shell as `widget` nodes the engine lays
# out for `layout.rn` to read back. They paint nothing and have their own
# surface, so the rect a game's HUD is confined to never reaches them.

[[nodes]]
id = "n_editor"
name = "Editor"
script = "scripts/editor.rn"

[[nodes]]
id = "shell"
name = "Shell"
parent = "n_editor"
[nodes.widget]
theme = "themes/shell-dark.toml"
kind = "column"
layer = "shell"
anchor = "top_left"
x = 0
y = 0
padding = 14
gap = 12

# The one bar across the top: brand, personas, the open documents, and the
# transport. It floats over this row, which holds the height and pushes the
# body down.
[[nodes]]
id = "head"
name = "Head"
parent = "shell"
[nodes.widget]
kind = "panel"
text = ""
# The bar's own row is 30, and this sheet keeps 5 inside each edge: the one
# strip that is chrome from edge to edge takes less than a panel would.
height = 40
padding = 5
gap = 0

[[nodes]]
id = "head_body"
name = "HeadBody"
parent = "head"
[nodes.widget]
kind = "draw"
draw = "draw_top_bar"
grow = 1

[[nodes]]
id = "body"
name = "Body"
parent = "shell"
[nodes.widget]
kind = "row"
grow = 1
gap = 12
handle = 12

# The column a side dock owns, and the sheet inside it. Two boxes rather than
# one: folded, the sheet is a square at the top and the rest of the column is
# the scene's, which a painted panel of the full height could not be.
[[nodes]]
id = "left"
name = "Left"
parent = "body"
[nodes.widget]
kind = "column"
width = 236

[[nodes]]
id = "left_sheet"
name = "LeftSheet"
parent = "left"
[nodes.widget]
kind = "panel"
text = ""
grow = 1
# What a sheet keeps inside its edge. Stated rather than left to the widget
# theme because a folded dock writes a smaller one and needs this back.
padding = 8

[[nodes]]
id = "left_body"
name = "LeftBody"
parent = "left_sheet"
[nodes.widget]
kind = "draw"
draw = "draw_dock_left"
grow = 1

# The tool rail down one side, and everything else beside it. The rail is a
# column of the whole height so the dock below starts clear of it too.
[[nodes]]
id = "centre"
name = "Centre"
parent = "body"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

[[nodes]]
id = "right"
name = "Right"
parent = "body"
[nodes.widget]
kind = "column"
width = 288

[[nodes]]
id = "right_sheet"
name = "RightSheet"
parent = "right"
[nodes.widget]
kind = "panel"
text = ""
grow = 1
padding = 8

[[nodes]]
id = "right_body"
name = "RightBody"
parent = "right_sheet"
[nodes.widget]
kind = "draw"
draw = "draw_dock_right"
grow = 1

[[nodes]]
id = "railslot"
name = "RailSlot"
parent = "centre"
[nodes.widget]
kind = "column"
width = 44

# The rail is only as tall as its tools, so it takes the top of the slot
# rather than the whole of it; `layout.rn` states the height.
[[nodes]]
id = "rail"
name = "Rail"
parent = "railslot"
[nodes.widget]
kind = "row"
height = 42

# The scene and the dock, stacked beside the rail.
[[nodes]]
id = "stack"
name = "Stack"
parent = "centre"
[nodes.widget]
kind = "column"
grow = 1
gap = 12

[[nodes]]
id = "upper"
name = "Upper"
parent = "stack"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

[[nodes]]
id = "bottom"
name = "Bottom"
parent = "stack"
[nodes.widget]
kind = "panel"
text = ""
height = 174
gap = 0

# What a dock panel may scroll, and the status strip sharing the same sheet so
# a tall panel cannot push it off the bottom.
[[nodes]]
id = "dockbody"
name = "DockBody"
parent = "bottom"
[nodes.widget]
kind = "draw"
draw = "draw_dock_bottom"
grow = 1

[[nodes]]
id = "status"
name = "Status"
parent = "bottom"
[nodes.widget]
kind = "draw"
draw = "draw_status"
height = 24

[[nodes]]
id = "work"
name = "Work"
parent = "upper"
[nodes.widget]
kind = "column"
grow = 1
gap = 6

[[nodes]]
id = "canvas"
name = "Canvas"
parent = "work"
[nodes.widget]
kind = "row"
grow = 1
gap = 12

# What is left of the canvas once the hooks list has taken its width. The
# code pane and the scene share it; `layout.rn` decides how.
[[nodes]]
id = "stage"
name = "Stage"
parent = "canvas"
[nodes.widget]
kind = "row"
grow = 1

# The file's engine-facing surface, beside the code. `layout.rn` writes 0 here
# when it is closed; this is what it opens back to.
[[nodes]]
id = "hooks"
name = "Hooks"
parent = "canvas"
[nodes.widget]
kind = "row"
width = 172
