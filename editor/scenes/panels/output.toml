# The Output tab: the log, with its clear, its level and its search. One
# script answers them; the log itself is the engine's, heard as `logged`.

[[nodes]]
id = "panel"
name = "Output"
script = { source = "scripts/panels/output.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

[[nodes]]
id = "tools"
name = "Tools"
parent = "panel"
[nodes.widget]
kind = "row"
role = "toolbar_dock"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "clear"
name = "Clear"
parent = "tools"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "clear" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "clear"
tooltip = "Empty the log buffer"

# The level to show and above, each a button the script lights.
[[nodes]]
id = "error"
name = "error"
parent = "tools"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "level_picked" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "error"
tooltip = "Show error and above"

[[nodes]]
id = "warn"
name = "warn"
parent = "tools"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "level_picked" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "warn"
tooltip = "Show warn and above"

[[nodes]]
id = "all"
name = "all"
parent = "tools"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "level_picked" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "all"
tooltip = "Show all and above"

[[nodes]]
id = "search"
name = "Search"
parent = "tools"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", value = "search_typed" }] }
[nodes.widget]
kind = "text_field"
role = "input_dock"
grow = 1
[nodes.widget_field]
icon = "magnifying-glass"
placeholder = "Search"

[[nodes]]
id = "log"
name = "Log"
parent = "panel"
[nodes.widget]
kind = "list"
role = "list_log"
grow = 1

[[nodes]]
id = "nothing"
name = "Nothing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"
