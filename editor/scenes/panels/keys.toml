# The shell's keys: a button a command, each clicked by its chord, laid out
# off the screen. One script answers them all. A shifted chord comes before
# its plain one, which egui would match it against too.

[[nodes]]
id = "keys"
name = "Keys"
script = { source = "scripts/panels/keys.bs" }
[nodes.widget]
kind = "row"
x = -10000.0
y = -10000.0
interactive = false
whole_window = true

[[nodes]]
id = "palette"
name = "palette"
parent = "keys"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "pressed" }] }
[nodes.widget]
kind = "button"
focusable = false
[nodes.widget_shortcut]
shortcut = "cmd+k"

