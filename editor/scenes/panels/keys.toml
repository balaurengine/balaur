# The shell's keys: a row a command, by the name commands.bs runs it by. A
# shifted chord comes before its plain one, which egui would match it against.

[[nodes]]
id = "keys"
name = "Keys"
script = { source = "scripts/panels/keys.bs" }
shortcuts = { rows = [
    { chord = "cmd+KeyK", name = "palette" },
    { chord = "cmd+KeyS", name = "save" },
    { chord = "alt+shift+KeyF", name = "format" },
    { chord = "cmd+KeyB", name = "definition" },
    { chord = "cmd+shift+KeyR", name = "rename_symbol" },
    { chord = "cmd+shift+KeyF", name = "replace" },
    { chord = "cmd+shift+Backslash", name = "focus" },
    { chord = "cmd+Backslash", name = "split" },
    { chord = "cmd+Equal", name = "scale_up" },
    { chord = "cmd+Minus", name = "scale_down" },
    { chord = "cmd+Comma", name = "settings" },
    { chord = "cmd+KeyE", name = "export" },
    { chord = "shift+F11", name = "step_out" },
    { chord = "F5", name = "continue" },
    { chord = "F10", name = "step_over" },
    { chord = "F11", name = "step_into" },
    { chord = "F5", name = "play", while_typing = false },
    { chord = "F6", name = "break", while_typing = false },
    { chord = "alt+Digit1", name = "workspace_1", while_typing = false },
    { chord = "alt+Digit2", name = "workspace_2", while_typing = false },
    { chord = "alt+Digit3", name = "workspace_3", while_typing = false },
    { chord = "alt+Digit4", name = "workspace_4", while_typing = false },
    { chord = "alt+Digit5", name = "workspace_5", while_typing = false },
    { chord = "shift+KeyA", name = "add_child", while_typing = false },
    { chord = "alt+KeyS", name = "attach_script", while_typing = false },
    { chord = "shift+KeyR", name = "reload_scripts", while_typing = false },
    { chord = "cmd+KeyC", name = "copy", while_typing = false },
    { chord = "shift+cmd+KeyZ", name = "redo", while_typing = false },
    { chord = "cmd+KeyY", name = "redo", while_typing = false },
    { chord = "cmd+KeyZ", name = "undo", while_typing = false },
    { chord = "alt+KeyL", name = "dark_chrome", while_typing = false },
    { chord = "cmd+KeyA", name = "select_all", while_typing = false },
    { chord = "shift+cmd+KeyG", name = "ungroup", while_typing = false },
    { chord = "cmd+KeyG", name = "group", while_typing = false },
    { chord = "shift+cmd+KeyL", name = "unlock_all", while_typing = false },
    { chord = "cmd+KeyL", name = "lock", while_typing = false },
    { chord = "shift+KeyH", name = "show_all", while_typing = false },
    { chord = "KeyH", name = "hide", while_typing = false },
    { chord = "Slash", name = "isolate", while_typing = false },
    { chord = "KeyK", name = "key", while_typing = false },
    { chord = "Escape", name = "cancel", while_typing = false },
] }
