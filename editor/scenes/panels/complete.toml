# The completion list under the caret: what may be typed there, with the
# doc line of the one picked. Its shortcuts take the arrows, Enter, Tab and
# Escape ahead of the code being typed into, and only while the list is up.

[[nodes]]
id = "complete"
name = "Complete"
script = { source = "scripts/panels/complete.bs" }
visible = false
shortcuts = { rows = [
    { chord = "ArrowUp", name = "Up", takes_typing = true },
    { chord = "ArrowDown", name = "Down", takes_typing = true },
    { chord = "Enter", name = "Accept", takes_typing = true },
    { chord = "Tab", name = "Tab", takes_typing = true },
    { chord = "Escape", name = "Close", takes_typing = true },
] }
[nodes.widget]
kind = "panel"
role = "sheet_complete"
anchor = "top_left"

[[nodes]]
id = "list"
name = "List"
parent = "complete"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "..", value = "list_clicked" }] }
[nodes.widget]
kind = "list"
role = "list_log"

[[nodes]]
id = "doc"
name = "Doc"
parent = "complete"
visible = false
[nodes.widget]
kind = "label"
role = "text_code_caption"
[nodes.widget_text]
truncate = true
