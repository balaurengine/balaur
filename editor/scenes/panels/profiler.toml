# The Profiler tab: what the engine measured, as a table under its headline.
# One script answers it, sampling while the tab shows: see scripts/panels/meter.bs.

[[nodes]]
id = "panel"
name = "Profiler"
script = { source = "scripts/panels/meter.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

[[nodes]]
id = "tools"
name = "Tools"
parent = "panel"
[nodes.widget]
kind = "row"
role = "toolbar_dock"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "scripts"
name = "Scripts"
parent = "tools"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../..", value = "scripts" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "scripts"
tooltip = "Count what each script costs, in VM instructions"

[[nodes]]
id = "headline"
name = "Headline"
parent = "tools"
[nodes.widget]
kind = "label"
role = "text_note"
grow = 1

[[nodes]]
id = "table"
name = "Table"
parent = "panel"
[nodes.widget]
kind = "table"
role = "list_log"
grow = 1
[nodes.widget_table]
sortable = true

[[nodes]]
id = "nothing"
name = "Nothing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"
