# The Problems tab: every error and warning the last check found, the
# errors first. A pick opens the script it names.

[[nodes]]
id = "panel"
name = "Problems"
script = { source = "scripts/panels/problems.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

[[nodes]]
id = "list"
name = "List"
parent = "panel"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", value = "list_picked" }] }
[nodes.widget]
kind = "list"
grow = 1
font = "fonts/JetBrainsMono-Regular.ttf"

[nodes.widget.touch]
row_height = 33
[nodes.widget_rows]
row_height = 18

[[nodes]]
id = "nothing"
name = "Nothing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"
