# The Problems tab: every error and warning the last check found, the
# errors first. A pick opens the script it names.

[[nodes]]
id = "panel"
name = "Problems"
script = { source = "scripts/panels/problems.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

[[nodes]]
id = "list"
name = "List"
parent = "panel"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "..", value = "list_picked" }] }
[nodes.widget]
kind = "list"
role = "list_log"
grow = 1

[[nodes]]
id = "nothing"
name = "Nothing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"
