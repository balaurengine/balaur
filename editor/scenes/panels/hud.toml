# The strip along the foot of the rail and the scene: which way the axes run,
# the bottom dock's handle when it is folded, and the zoom. The strip is
# chrome end to end, so a press anywhere on it is not the scene's.

[[nodes]]
id = "hud"
name = "Hud"
script = { source = "scripts/panels/hud.bs" }
visible = false
[nodes.widget]
kind = "row"
role = "header_stage"
absolute = true
inset = [0.0, -1.0, 0.0, 0.0]
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "axes"
name = "Axes"
parent = "hud"
[nodes.widget]
kind = "row"
role = "sheet_hud"
interactive = false
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "x"
name = "X"
parent = "axes"
[nodes.widget]
kind = "label"
role = "text_code_caption"
text = "x →"

[[nodes]]
id = "y"
name = "Y"
parent = "axes"
[nodes.widget]
kind = "label"
role = "text_code_caption"
text = "y ↑"

[[nodes]]
id = "z"
name = "Z"
parent = "axes"
[nodes.widget]
kind = "label"
role = "text_code_caption"
text = "z ↓"

[[nodes]]
id = "gap"
name = "Gap"
parent = "hud"
[nodes.widget]
kind = "row"
grow = 1
interactive = false

[[nodes]]
id = "zoom"
name = "Zoom"
parent = "hud"
[nodes.widget]
kind = "row"
role = "sheet_hud"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "out"
name = "Out"
parent = "zoom"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../..", value = "zoom_out" }] }
[nodes.widget]
kind = "button"
role = "icon_action_form_quiet"

[[nodes]]
id = "reading"
name = "Reading"
parent = "zoom"
[nodes.widget]
kind = "label"
role = "text_code"
text = "100 %"

[[nodes]]
id = "in"
name = "In"
parent = "zoom"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../..", value = "zoom_in" }] }
[nodes.widget]
kind = "button"
role = "icon_action_form_quiet"

# The folded bottom dock's way back, just after the zoom reading.
[[nodes]]
id = "bottom"
name = "Bottom"
parent = "hud"
visible = false
[nodes.widget]
kind = "row"
role = "sheet_hud"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "bottom_open"
name = "Open"
parent = "bottom"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../..", value = "open_bottom" }] }
[nodes.widget]
kind = "button"
role = "icon_action_form_quiet"
tooltip = "Open the dock"
