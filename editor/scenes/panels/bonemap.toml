# The Bone map tab: the canonical skeleton against this rig's bones, a row a
# canonical bone with the rig's bone it means, and the verbs that fill, empty
# and write the map. One script fills it from the Editor and answers it.

[[nodes]]
id = "panel"
name = "Bonemap"
script = { source = "scripts/panels/bonemap.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

# What the map needs before there is anything to map.
[[nodes]]
id = "missing"
name = "Missing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"
text = "select a rig — a node with bones under it — to map its bones"

[[nodes]]
id = "body"
name = "Body"
parent = "panel"
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

[[nodes]]
id = "verbs"
name = "Verbs"
parent = "body"
[nodes.widget]
kind = "row"
role = "toolbar_dock"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "count"
name = "Count"
parent = "verbs"
[nodes.widget]
kind = "label"
role = "text_code_caption"

[[nodes]]
id = "guess"
name = "guess"
parent = "verbs"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "verb" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = "guess by name"
tooltip = "Fill every row whose canonical name matches a bone, ignoring case and separators"

[[nodes]]
id = "clear"
name = "clear"
parent = "verbs"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "verb" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = "clear"
tooltip = "Empty every row"

[[nodes]]
id = "save"
name = "save"
parent = "verbs"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "verb" }] }
[nodes.widget]
kind = "button"
role = "action_form_primary"
text = "save"
tooltip = "Write the map as a `bone_map` asset, for animation.play's `retarget`"

[[nodes]]
id = "scroll"
name = "Scroll"
parent = "body"
[nodes.widget]
kind = "scroll"
grow = 1
[nodes.widget_scroll]
axis = "vertical"

[[nodes]]
id = "rows"
name = "Rows"
parent = "scroll"
[nodes.widget]
kind = "column"
role = "list_dock"
