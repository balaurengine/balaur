# What the viewport carries over itself: the Interface workspace's guides, the
# chip strip along its top, and the handles of the docks folded towards it.
# Laid over the stage, taking no pointer but where a control is.

[[nodes]]
id = "chrome"
name = "Chrome"
script = { source = "scripts/panels/stage.bs" }
[nodes.widget]
kind = "column"
absolute = true
inset = [0.0, 0.0, 0.0, 0.0]
interactive = false

# The safe-area inset and the 16:9 frame, dashed over the picture.
[[nodes]]
id = "safe"
name = "Safe"
parent = "chrome"
visible = false
[nodes.widget]
kind = "panel"
role = "mark_safe"
absolute = true
inset = [34.0, 34.0, 34.0, 34.0]
interactive = false

[[nodes]]
id = "resolution"
name = "Resolution"
parent = "chrome"
visible = false
[nodes.widget]
kind = "panel"
role = "mark_resolution"
absolute = true
interactive = false

# Drags sideways rather than painting its last chip over whatever sits beside
# the scene. Its own script, which hears the pointer come for it.
[[nodes]]
id = "chips"
name = "Chips"
parent = "chrome"
script = { source = "scripts/panels/chips.bs" }
visible = false
[nodes.widget]
kind = "scroll"
role = "header_stage"
absolute = true
inset = [0.0, 0.0, 0.0, -1.0]
[nodes.widget_scroll]
axis = "horizontal"

[[nodes]]
id = "chips_row"
name = "Row"
parent = "chips"
[nodes.widget]
kind = "row"
role = "header_stage"
[nodes.widget_layout]
align_items = "center"

# The workspace's toggles, one `scenes/items/chip.toml` a chip.
[[nodes]]
id = "chips_toggles"
name = "Toggles"
parent = "chips_row"
[nodes.widget]
kind = "row"
role = "layout_chips"
[nodes.widget_layout]
align_items = "center"

# The Polygon tool's modes, and the mode's own settings after them.
[[nodes]]
id = "chips_modes"
name = "Modes"
parent = "chips_row"
[nodes.widget]
kind = "row"
role = "layout_chips"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "chips_options"
name = "Options"
parent = "chips_row"
[nodes.widget]
kind = "row"
role = "layout_chips"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "chips_bone"
name = "Bone"
parent = "chips_options"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "../../..", value = "option_changed" }] }
[nodes.widget]
kind = "dropdown"
role = "choice"
tooltip = "The bone the brush paints"

[[nodes]]
id = "chips_radius"
name = "Radius"
parent = "chips_options"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "../../..", value = "option_changed" }] }
[nodes.widget]
kind = "number_field"
role = "input_number"
tooltip = "How far the brush reaches"
[nodes.widget_range]
drag_speed = 0.5
min = 2.0
max = 400.0
prefix = "px"

[[nodes]]
id = "chips_strength"
name = "Strength"
parent = "chips_options"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "../../..", value = "option_changed" }] }
[nodes.widget]
kind = "number_field"
role = "input_number"
tooltip = "How much a stroke adds"
[nodes.widget_range]
drag_speed = 0.01
min = 0.01
max = 2.0
prefix = "×"

[[nodes]]
id = "chips_tolerance"
name = "Tolerance"
parent = "chips_options"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "../../..", value = "option_changed" }] }
[nodes.widget]
kind = "number_field"
role = "input_number"
tooltip = "How closely a trace follows the texture's alpha"
[nodes.widget_range]
drag_speed = 0.1
min = 0.0
max = 64.0
prefix = "px"

# Shaded, or one channel the engine draws instead.
[[nodes]]
id = "chips_view"
name = "View"
parent = "chips_row"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "../..", value = "view_picked" }] }
[nodes.widget]
kind = "menu"
role = "chip"

# Four camera slots: click to go, hold ⇧ to store where the camera is.
[[nodes]]
id = "chips_views"
name = "Views"
parent = "chips_row"
[nodes.widget]
kind = "row"
role = "layout_chips"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "chips_view_1"
name = "1"
parent = "chips_views"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "1"

[[nodes]]
id = "chips_view_2"
name = "2"
parent = "chips_views"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "2"

[[nodes]]
id = "chips_view_3"
name = "3"
parent = "chips_views"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "3"

[[nodes]]
id = "chips_view_4"
name = "4"
parent = "chips_views"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "4"

# A folded side dock's way back, at the edge it folded towards.
[[nodes]]
id = "left"
name = "Left"
parent = "chrome"
visible = false
[nodes.widget]
kind = "panel"
role = "sheet_rail"
absolute = true
inset = [0.0, 0.0, -1.0, -1.0]

[[nodes]]
id = "left_open"
name = "Open"
parent = "left"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../..", value = "open" }] }
[nodes.widget]
kind = "button"
role = "icon_action_caret"

[[nodes]]
id = "right"
name = "Right"
parent = "chrome"
visible = false
[nodes.widget]
kind = "panel"
role = "sheet_rail"
absolute = true
inset = [-1.0, 0.0, 0.0, -1.0]

[[nodes]]
id = "right_open"
name = "Open"
parent = "right"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../..", value = "open" }] }
[nodes.widget]
kind = "button"
role = "icon_action_caret"
