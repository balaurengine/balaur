# The Docs tab: the script reference from the live engine, a module at a
# time, with a filter over its functions.

[[nodes]]
id = "panel"
name = "Docs"
script = { source = "scripts/panels/docs.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

[[nodes]]
id = "tools"
name = "Tools"
parent = "panel"
[nodes.widget]
kind = "row"
role = "toolbar_dock"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "module"
name = "Module"
parent = "tools"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", value = "module_picked" }] }
[nodes.widget]
kind = "dropdown"
role = "choice"
grow = 1
[nodes.widget_dropdown]
options = []

[[nodes]]
id = "search"
name = "Search"
parent = "tools"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", value = "search_typed" }] }
[nodes.widget]
kind = "text_field"
role = "input_dock"
grow = 1
[nodes.widget_field]
icon = "magnifying-glass"
placeholder = "Search"

[[nodes]]
id = "list"
name = "List"
parent = "panel"
[nodes.widget]
kind = "list"
role = "list_log"
grow = 1

[[nodes]]
id = "nothing"
name = "Nothing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"
