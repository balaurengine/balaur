# The Docs tab: the script reference from the live engine, a module at a
# time, with a filter over its functions.

[[nodes]]
id = "panel"
name = "Docs"
script = { source = "scripts/panels/docs.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1
[nodes.widget_layout]
gap = [0, 4]

[[nodes]]
id = "tools"
name = "Tools"
parent = "panel"
[nodes.widget]
kind = "row"
height = 26
[nodes.widget_layout]
align_items = "center"
gap = [6, 0]

[[nodes]]
id = "module"
name = "Module"
parent = "tools"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", value = "module_picked" }] }
[nodes.widget]
kind = "dropdown"
role = "choice"
width = 150
[nodes.widget_dropdown]
options = []

[[nodes]]
id = "search"
name = "Search"
parent = "tools"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", value = "search_typed" }] }
[nodes.widget]
kind = "text_field"
role = "input_dock"
width = 150
[nodes.widget_field]
placeholder = "Search"

[[nodes]]
id = "list"
name = "List"
parent = "panel"
[nodes.widget]
kind = "list"
grow = 1
font = "fonts/JetBrainsMono-Regular.ttf"
[nodes.widget_rows]
row_height = 18

[[nodes]]
id = "nothing"
name = "Nothing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"
