# The Docs tab: the script reference from the live engine, a module at a
# time, with a filter over its functions.

[[nodes]]
id = "panel"
name = "Docs"
script = { source = "scripts/panels/docs.bs" }
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1
gap = [0, 4]
visible = false

[[nodes]]
id = "tools"
name = "Tools"
parent = "panel"
[nodes.widget]
kind = "row"
align_items = "center"
gap = [6, 0]
height = 26

[[nodes]]
id = "module"
name = "Module"
parent = "tools"
[nodes.widget]
kind = "dropdown"
role = "choice"
text = ""
options = []
width = 150

[[nodes]]
id = "search"
name = "Search"
parent = "tools"
[nodes.widget]
kind = "text_field"
role = "input_dock"
text = ""
placeholder = "Search"
width = 150

[[nodes]]
id = "list"
name = "List"
parent = "panel"
[nodes.widget]
kind = "list"
grow = 1
text = ""
row_height = 18
font = "fonts/JetBrainsMono-Regular.ttf"

[[nodes]]
id = "nothing"
name = "Nothing"
parent = "panel"
[nodes.widget]
kind = "label"
role = "text_note"
text = ""
visible = false
