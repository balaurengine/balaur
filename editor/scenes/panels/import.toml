# The Import tab, for whatever the Assets tab has selected: its name, what it
# reads, and the settings it is imported with. One script answers them.

[[nodes]]
id = "panel"
name = "Import"
script = { source = "scripts/panels/import.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

[[nodes]]
id = "name"
name = "Name"
parent = "panel"
[nodes.widget]
kind = "label"
role = "text_title"

[[nodes]]
id = "from"
name = "From"
parent = "panel"
[nodes.widget]
kind = "label"
role = "text_code_caption"

[[nodes]]
id = "nothing"
name = "Nothing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"

[[nodes]]
id = "scroll"
name = "Scroll"
parent = "panel"
[nodes.widget]
kind = "scroll"
grow = 1
[nodes.widget_scroll]
axis = "vertical"

# A form whose fields change with the file, so the pool makes them.
[[nodes]]
id = "form"
name = "Form"
parent = "scroll"
[nodes.widget]
kind = "column"
role = "layout_dock"
