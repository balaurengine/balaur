# The Scene tab: the document's nodes as a tree, with a search and a filter
# above it. One script answers every control here; the Editor node owns the
# document it shows and is told what was picked.

[[nodes]]
id = "panel"
name = "SceneTree"
script = { source = "scripts/panels/scene_tree.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1
[nodes.widget_layout]
gap = [0, 4]

# The search, and the "+" that adds a child to the selection beside it.
[[nodes]]
id = "find"
name = "Find"
parent = "panel"
[nodes.widget]
kind = "row"
[nodes.widget_layout]
align_items = "center"
gap = [4, 0]

[[nodes]]
id = "search"
name = "Search"
parent = "find"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", value = "search_typed" }] }
[nodes.widget]
kind = "text_field"
role = "input_dock"
grow = 1
[nodes.widget_field]
placeholder = "Search"

[[nodes]]
id = "add"
name = "Add"
parent = "find"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "add" }] }
[nodes.widget]
kind = "button"
role = "icon_action_primary"
tooltip = "Add child node"
width = 24

# Each option but the first is a component tag the engine already carries,
# so a plugin's component is found by the tags it declared.
[[nodes]]
id = "facet"
name = "Facet"
parent = "panel"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", value = "facet_picked" }] }
[nodes.widget]
kind = "dropdown"
role = "choice"
text = "All nodes"
[nodes.widget_dropdown]
options = ["All nodes", "3D", "2D", "Physics", "Rendering", "UI", "Script"]

# What a filter that left nothing says instead of an empty tree.
[[nodes]]
id = "nothing"
name = "Nothing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"

[[nodes]]
id = "tree"
name = "Tree"
parent = "panel"
bindings = { rows = [
    { event = "emitted:value_changed", action = "call", value = "tree_picked" },
    { event = "emitted:marked", action = "call", value = "tree_mark" },
] }
[nodes.widget]
kind = "tree"
grow = 1
# A right click or a long press picks the row it lands on and opens these.
context = "tree_menu"
[nodes.widget_rows]
# The row a click landed on, which the script reads once and clears.
multi_select = true
row_height = 23

# The eye and the lock a row draws at its right; the Editor answers them.
[nodes.widget.touch]
row_height = 33

# The node actions, on a menu that draws no button of its own. Each row calls
# a method on the Editor node's script, which acts on the selection the click
# just made.
[[nodes]]
id = "tree_menu"
name = "tree_menu"
parent = "panel"
[nodes.widget]
kind = "menu"

[[nodes]]
id = "tree_add"
name = "TreeAdd"
parent = "tree_menu"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "tree_add_child" }] }
[nodes.widget]
kind = "button"
role = "action_tree"
text = "Add child"

