role = "action_tree"
text = "Move up"

[[nodes]]
id = "tree_down"
name = "TreeDown"
parent = "tree_menu"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "tree_move_down" }] }
[nodes.widget]
kind = "button"
role = "action_tree"
text = "Move down"

[[nodes]]
id = "tree_rename"
name = "TreeRename"
