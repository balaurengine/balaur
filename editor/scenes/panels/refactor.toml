# The refactor sheet: the name and what it becomes, then every place it is
# and the commands. One script hands each edit to the Editor.

[[nodes]]
id = "panel"
name = "Refactor"
script = { source = "scripts/panels/refactor.bs" }
visible = false
[nodes.widget]
kind = "panel"
role = "sheet_refactor"
absolute = true
inset = [-1.0, 16.0, 20.0, -1.0]

[[nodes]]
id = "title"
name = "Title"
parent = "panel"
[nodes.widget]
kind = "label"
role = "text_heading"
text = "Rename"

[[nodes]]
id = "from"
name = "From"
parent = "panel"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "..", value = "field_typed" }] }
[nodes.widget]
kind = "text_field"
role = "input_form"
[nodes.widget_field]
placeholder = "name"

[[nodes]]
id = "to"
name = "To"
parent = "panel"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "..", value = "field_typed" }] }
[nodes.widget]
kind = "text_field"
role = "input_form"
[nodes.widget_field]
placeholder = "new name"

[[nodes]]
id = "count"
name = "Count"
parent = "panel"
[nodes.widget]
kind = "label"
role = "text_code_caption"

[[nodes]]
id = "hits"
name = "Hits"
parent = "panel"
[nodes.widget]
kind = "list"
role = "list_refactor"

[[nodes]]
id = "buttons"
name = "Buttons"
parent = "panel"
[nodes.widget]
kind = "row"
role = "layout_actions"

[[nodes]]
id = "apply"
name = "Apply"
parent = "buttons"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../..", value = "apply" }] }
[nodes.widget]
kind = "button"
role = "action_form_primary"
text = "Apply"

[[nodes]]
id = "cancel"
name = "Cancel"
parent = "buttons"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../..", value = "cancel" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = "Cancel"
