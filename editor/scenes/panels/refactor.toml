# The refactor sheet: the name and what it becomes, then every place it is
# and the verbs. One script hands each edit to the Editor.

[[nodes]]
id = "panel"
name = "Refactor"
script = { source = "scripts/panels/refactor.bs" }
visible = false
[nodes.widget]
kind = "panel"
role = "sheet"
absolute = true
inset = [-1.0, 16.0, 20.0, -1.0]
width = 420
padding = [14, 12, 14, 12]
[nodes.widget_layout]
gap = [0, 6]

[[nodes]]
id = "title"
name = "Title"
parent = "panel"
[nodes.widget]
kind = "label"
role = "text_heading"
text = "RENAME"

[[nodes]]
id = "from"
name = "From"
parent = "panel"
[nodes.widget]
on_change = "field_typed"
kind = "text_field"
role = "input_form"
[nodes.widget_field]
placeholder = "name"

[[nodes]]
id = "to"
name = "To"
parent = "panel"
[nodes.widget]
on_change = "field_typed"
kind = "text_field"
role = "input_form"
[nodes.widget_field]
placeholder = "new name"

[[nodes]]
id = "count"
name = "Count"
parent = "panel"
[nodes.widget]
kind = "label"
role = "text_code_quiet"
font_size = 11

[[nodes]]
id = "hits"
name = "Hits"
parent = "panel"
[nodes.widget]
kind = "list"
height = 120
row_height = 20
font = "fonts/JetBrainsMono-Regular.ttf"

[[nodes]]
id = "verbs"
name = "Verbs"
parent = "panel"
[nodes.widget]
kind = "row"
[nodes.widget_layout]
gap = [6, 6]

[[nodes]]
id = "apply"
name = "Apply"
parent = "verbs"
[nodes.widget]
on_click = "apply"
kind = "button"
role = "action_form_primary"
text = "Apply"
min_width = 70

[[nodes]]
id = "cancel"
name = "Cancel"
parent = "verbs"
[nodes.widget]
on_click = "cancel"
kind = "button"
role = "action_form"
text = "Cancel"
min_width = 70
