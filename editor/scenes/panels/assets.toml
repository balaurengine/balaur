# The Assets tab: the project's files as cards, where the browser is, its
# verbs and a search. One script answers them; the files are the Editor's.

[[nodes]]
id = "panel"
name = "Assets"
script = { source = "scripts/panels/assets.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1
[nodes.widget_layout]
gap = [0, 4]

[[nodes]]
id = "tools"
name = "Tools"
parent = "panel"
[nodes.widget]
kind = "row"
role = "toolbar_dock"
[nodes.widget_layout]
align_items = "center"
gap = [6, 6]

[[nodes]]
id = "up"
name = "Up"
parent = "tools"
visible = false
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_dock"
text = "↑"
tooltip = "Up one folder"

[[nodes]]
id = "where"
name = "Where"
parent = "tools"
[nodes.widget]
kind = "label"
role = "text_caption"
text = "res://"

# The breadcrumb's place while a card is being renamed.
[[nodes]]
id = "name"
name = "Name"
parent = "tools"
visible = false
[nodes.widget]
kind = "text_field"
role = "input_dock"
width = 180
[nodes.widget_field]
placeholder = "new name"
on_submit = "name_submitted"

[[nodes]]
id = "gap"
name = "Gap"
parent = "tools"
[nodes.widget]
kind = "row"
interactive = false
grow = 1

[[nodes]]
id = "count"
name = "Count"
parent = "tools"
[nodes.widget]
kind = "label"
role = "text_caption"

# One button, two jobs: an import to start, or the one running to stop.
[[nodes]]
id = "import"
name = "Import"
parent = "tools"
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_dock"
text = "import"
tooltip = "Bring in a model, a sprite or a level"

[[nodes]]
id = "folder"
name = "Folder"
parent = "tools"
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_dock"
text = "folder"
tooltip = "Make a folder here"

# A dependency's file into the game's own tree, with no link back.
[[nodes]]
id = "local"
name = "Local"
parent = "tools"
visible = false
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_dock"
text = "make local"
tooltip = "Copy into the game and point the game at the copy"

# The game's file into a `path` dependency kept for later.
[[nodes]]
id = "move"
name = "Move"
parent = "tools"
visible = false
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_dock"
text = "move to project"

# The dependency's own project: its folder in a second editor, or its page
# on Forge.
[[nodes]]
id = "source"
name = "Source"
parent = "tools"
visible = false
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_dock"
text = "edit dependency"

# A Forge dependency to the newest commit of its branch or tag.
[[nodes]]
id = "update"
name = "Update"
parent = "tools"
visible = false
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_dock"
text = "update"
tooltip = "Fetch the newest commit of each dependency's branch or tag"

[[nodes]]
id = "rename"
name = "Rename"
parent = "tools"
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_dock_quiet"
text = "rename"
tooltip = "Select an item first"

[[nodes]]
id = "delete"
name = "Delete"
parent = "tools"
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_dock_quiet"
text = "delete"
tooltip = "Select an item first"

[[nodes]]
id = "search"
name = "Search"
parent = "tools"
[nodes.widget]
on_change = "search_typed"
kind = "text_field"
role = "input_dock"
width = 140
[nodes.widget_field]
placeholder = "Search"

# The cards: a dragged one let go over the viewport places its file there.
[[nodes]]
id = "cards"
name = "Cards"
parent = "panel"
[nodes.widget]
on_click = "card_clicked"
kind = "list"
grow = 1
[nodes.widget_list]
on_drop = "card_dropped"
draggable = true
grid_columns = "repeat(6, 1fr)"

[nodes.widget.touch]
row_height = 33
