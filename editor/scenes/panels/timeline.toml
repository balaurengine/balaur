# The Timeline tab: the clip's keys over time, a lane a track, with the ruler
# they are read against, the playhead and the scrubber under them. One script
# fills it from the Editor, which owns the clip, and answers its verbs.

[[nodes]]
id = "panel"
name = "Timeline"
script = { source = "scripts/panels/timeline.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

# What the player is missing, and the verb that gives it a clip.
[[nodes]]
id = "missing"
name = "Missing"
parent = "panel"
visible = false
[nodes.widget]
kind = "row"
role = "layout_actions"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "missing_says"
name = "Says"
parent = "missing"
[nodes.widget]
kind = "label"
role = "text_note"

[[nodes]]
id = "create"
name = "Create"
parent = "missing"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../..", value = "verb" }] }
[nodes.widget]
kind = "button"
role = "action_form_primary"
text = "Create clip"

[[nodes]]
id = "body"
name = "Body"
parent = "panel"
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

[[nodes]]
id = "head"
name = "Head"
parent = "body"
[nodes.widget]
kind = "row"
role = "toolbar_dock"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "add"
name = "AddKey"
parent = "head"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "verb" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "Key"
tooltip = "Insert keyframe at playhead (or press K)"

[[nodes]]
id = "delete"
name = "DeleteKey"
parent = "head"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "verb" }] }
[nodes.widget]
kind = "button"
role = "chip"
text = "Key"
tooltip = "Delete keyframe at playhead"
[nodes.widget_button]
icon = "minus"

# The clip's own settings: how long it runs and what it does at its end.
[[nodes]]
id = "length"
name = "Length"
parent = "head"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "../../..", value = "clip_changed" }] }
[nodes.widget]
kind = "number_field"
role = "input_number"
tooltip = "How long the clip runs"
[nodes.widget_range]
drag_speed = 0.01
suffix = " s"

[[nodes]]
id = "loop"
name = "Loop"
parent = "head"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "../../..", value = "clip_changed" }] }
[nodes.widget]
kind = "dropdown"
role = "choice"
tooltip = "What the clip does at its end"

[[nodes]]
id = "gap"
name = "Gap"
parent = "head"
[nodes.widget]
kind = "row"
grow = 1
interactive = false

[[nodes]]
id = "clip"
name = "Clip"
parent = "head"
[nodes.widget]
kind = "label"
role = "text_code_caption"

[[nodes]]
id = "time"
name = "Time"
parent = "head"
[nodes.widget]
kind = "label"
role = "text_code_caption"

# The ticks along the top, placed by time, a lane high.
[[nodes]]
id = "ruler"
name = "Ruler"
parent = "body"
[nodes.widget]
kind = "row"
role = "layout_lane"
interactive = false

# The lanes, with a rule per tick and the playhead straight down through them.
[[nodes]]
id = "lanes"
name = "Lanes"
parent = "body"
[nodes.widget]
kind = "column"
grow = 1

[[nodes]]
id = "rules"
name = "Rules"
parent = "lanes"
[nodes.widget]
kind = "row"
absolute = true
inset = [0.0, 0.0, 0.0, 0.0]
interactive = false

[[nodes]]
id = "playhead"
name = "Playhead"
parent = "lanes"
[nodes.widget]
kind = "row"
absolute = true
width = 2
fill = "primary_text"
interactive = false

[[nodes]]
id = "tracks_scroll"
name = "Scroll"
parent = "lanes"
[nodes.widget]
kind = "scroll"
grow = 1
[nodes.widget_scroll]
axis = "vertical"

[[nodes]]
id = "tracks"
name = "Tracks"
parent = "tracks_scroll"
[nodes.widget]
kind = "column"
role = "layout_dock"

# The scrubber, spanning exactly the lane column.
[[nodes]]
id = "scrub_row"
name = "ScrubRow"
parent = "body"
[nodes.widget]
kind = "row"
role = "layout_lane"

[[nodes]]
id = "scrub"
name = "Scrub"
parent = "scrub_row"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", target = "../../..", value = "seek" }] }
[nodes.widget]
kind = "slider"
[nodes.widget_range]
value = 0.0
min = 0.0
max = 1.0
