# The Weights tab: the picked vertices as a table, a column a bone, every
# weight a number field, under the five commands a rigger reaches for. One script
# fills it from the Editor, which owns the polygon, and answers its commands.

[[nodes]]
id = "panel"
name = "Weights"
script = { source = "scripts/panels/weights.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

# What a polygon needs before it has weights to show.
[[nodes]]
id = "missing"
name = "Missing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"
text = "select a polygon with bones — the inspector's Sync Bones to Polygon lists them"

[[nodes]]
id = "body"
name = "Body"
parent = "panel"
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

[[nodes]]
id = "buttons"
name = "Buttons"
parent = "body"
[nodes.widget]
kind = "row"
role = "toolbar_dock"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "scope"
name = "Scope"
parent = "buttons"
[nodes.widget]
kind = "label"
role = "text_code_caption"

[[nodes]]
id = "bind"
name = "bind"
parent = "buttons"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = "bind"
tooltip = "Give every listed vertex all of its weight to the bone picked in the inspector"

[[nodes]]
id = "unbind"
name = "unbind"
parent = "buttons"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = "unbind"
tooltip = "Take the listed vertices off every bone"

[[nodes]]
id = "normalize"
name = "normalize"
parent = "buttons"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = "normalize"
tooltip = "Scale each listed vertex's weights so they sum to one"

[[nodes]]
id = "auto"
name = "auto"
parent = "buttons"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = "auto"
tooltip = "Weight by distance to each bone's segment"

[[nodes]]
id = "smooth"
name = "smooth"
parent = "buttons"
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = "smooth"
tooltip = "Average each listed vertex with the ones sharing an edge"

[[nodes]]
id = "all"
name = "all"
parent = "buttons"
visible = false
bindings = { rows = [{ event = "pointer_click", action = "call", target = "../../..", value = "pressed" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = "all"
tooltip = "List every vertex again"

# The bone columns' heads, a form: which bones there are is the polygon's.
# A form row as the rows under it are, so the columns line up.
[[nodes]]
id = "header"
name = "Header"
parent = "body"
[nodes.widget]
kind = "column"
role = "list_dock"

[[nodes]]
id = "scroll"
name = "Scroll"
parent = "body"
[nodes.widget]
kind = "scroll"
grow = 1
[nodes.widget_scroll]
axis = "vertical"

[[nodes]]
id = "rows"
name = "Rows"
parent = "scroll"
[nodes.widget]
kind = "column"
role = "list_dock"
