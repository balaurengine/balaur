# The Recordings tab while one is open: its transport and scrubber, where the
# replay parted from the recording, a lane a kind of event with a mark a tick,
# and everything recorded at the playhead. One script fills and answers it.

[[nodes]]
id = "panel"
name = "Lanes"
script = { source = "scripts/panels/lanes.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1
[nodes.widget_layout]
gap = [0, 4]

[[nodes]]
id = "head"
name = "Head"
parent = "panel"
[nodes.widget]
kind = "row"
height = 24
padding = [8, 0, 8, 0]
[nodes.widget_layout]
gap = [4, 4]
align_items = "center"

[[nodes]]
id = "play"
name = "Play"
parent = "head"
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_form_primary"
text = "▶ Play"

[[nodes]]
id = "step"
name = "Step"
parent = "head"
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_form"
text = "⇥"
tooltip = "One recorded tick forward"

[[nodes]]
id = "stop"
name = "Stop"
parent = "head"
[nodes.widget]
on_click = "verb"
kind = "button"
role = "action_form"
text = "■"
tooltip = "Back to the edited scene"

[[nodes]]
id = "scrub"
name = "Scrub"
parent = "head"
[nodes.widget]
on_change = "seek"
kind = "slider"
grow = 1
[nodes.widget_range]
value = 0.0
min = 0.0
max = 1.0

[[nodes]]
id = "at"
name = "At"
parent = "head"
[nodes.widget]
kind = "label"
role = "text_code_quiet"
font_size = 11

[[nodes]]
id = "parted"
name = "Parted"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_caption_primary"
padding = [8, 0, 8, 0]

[[nodes]]
id = "scroll"
name = "Scroll"
parent = "panel"
[nodes.widget]
kind = "scroll"
grow = 1
[nodes.widget_scroll]
axis = "vertical"

[[nodes]]
id = "rows"
name = "Rows"
parent = "scroll"
[nodes.widget]
kind = "column"
[nodes.widget_layout]
gap = [0, 2]
