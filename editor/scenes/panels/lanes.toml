# The Recordings tab while one is open: its transport and scrubber, where the
# replay parted from the recording, a lane a kind of event with a mark a tick,
# and everything recorded at the playhead. One script fills and answers it.

[[nodes]]
id = "panel"
name = "Lanes"
script = { source = "scripts/panels/lanes.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1

[[nodes]]
id = "head"
name = "Head"
parent = "panel"
[nodes.widget]
kind = "row"
role = "toolbar_dock"
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "play"
name = "Play"
parent = "head"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "verb" }] }
[nodes.widget]
kind = "button"
role = "action_form_primary"
text = "Play"
[nodes.widget_button]
icon = "play"

[[nodes]]
id = "step"
name = "Step"
parent = "head"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "verb" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = ""
tooltip = "One recorded tick forward"
[nodes.widget_button]
icon = "arrow-line-right"

[[nodes]]
id = "stop"
name = "Stop"
parent = "head"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "verb" }] }
[nodes.widget]
kind = "button"
role = "action_form"
text = ""
tooltip = "Back to the edited scene"
[nodes.widget_button]
icon = "stop"

[[nodes]]
id = "scrub"
name = "Scrub"
parent = "head"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", value = "seek" }] }
[nodes.widget]
kind = "slider"
grow = 1
[nodes.widget_range]
value = 0.0
min = 0.0
max = 1.0

[[nodes]]
id = "at"
name = "At"
parent = "head"
[nodes.widget]
kind = "label"
role = "text_code_caption"

[[nodes]]
id = "parted"
name = "Parted"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_caption_primary"

[[nodes]]
id = "scroll"
name = "Scroll"
parent = "panel"
[nodes.widget]
kind = "scroll"
grow = 1
[nodes.widget_scroll]
axis = "vertical"

[[nodes]]
id = "rows"
name = "Rows"
parent = "scroll"
[nodes.widget]
kind = "column"
role = "layout_dock"
