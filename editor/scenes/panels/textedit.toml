# Editing a text node where it is drawn: one field over a text double-clicked
# or added. Enter or a click away keeps what was typed; Escape drops it.

[[nodes]]
id = "textedit"
name = "TextEdit"
script = { source = "scripts/panels/textedit.bs" }
visible = false
[nodes.widget]
kind = "panel"
role = "sheet"
anchor = "top_left"
padding = [8, 4, 8, 4]
whole_window = true

[[nodes]]
id = "field"
name = "Field"
parent = "textedit"
bindings = { rows = [
    { event = "emitted:focus_exited", action = "call", value = "blurred" },
    { event = "emitted:value_changed", action = "call", value = "typed" },
    { event = "emitted:submitted", action = "call", value = "submitted" },
] }
[nodes.widget]
kind = "text_field"
role = "input_form"
