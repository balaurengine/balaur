# Editing a text node where it is drawn: one field over a text double-clicked
# or added. Enter or a click away keeps what was typed; Escape drops it.

[[nodes]]
id = "textedit"
name = "TextEdit"
script = { source = "scripts/panels/textedit.bs" }
[nodes.widget]
kind = "panel"
role = "sheet"
anchor = "top_left"
padding = [8, 4, 8, 4]
layer = "shell"
visible = false

[[nodes]]
id = "field"
name = "Field"
parent = "textedit"
[nodes.widget]
on_blur = "blurred"
on_submit = "submitted"
on_change = "typed"
kind = "text_field"
role = "input_form"
