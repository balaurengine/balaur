# The input overlay a capture is taken with: the keys, buttons and actions
# held, a ripple where a button went down, and a drawn pointer. Over
# everything, taking no pointer; one script places it from what input says.

[[nodes]]
id = "view"
name = "InputView"
script = { source = "scripts/panels/inputview.bs" }
[nodes.widget]
kind = "column"
anchor = "fill"
inset = [0.0, 0.0, 0.0, 0.0]
interactive = false
layer = "shell"
visible = false

# What is held, and what went up a moment ago: a chip each.
[[nodes]]
id = "chips"
name = "Chips"
parent = "view"
[nodes.widget]
kind = "row"
absolute = true
gap = [4, 4]
height = 30
interactive = false

[[nodes]]
id = "wash0"
name = "Wash0"
parent = "view"
[nodes.widget]
kind = "panel"
text = ""
absolute = true
fill = "primary_bg"
corner_radius = 9
interactive = false
visible = false

[[nodes]]
id = "ring0"
name = "Ring0"
parent = "view"
[nodes.widget]
kind = "panel"
text = ""
absolute = true
fill = "none"
stroke = "input_ripple"
corner_radius = 9
interactive = false
visible = false

