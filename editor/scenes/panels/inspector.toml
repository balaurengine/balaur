# The Inspector: the selected node's header, a search, its form and the one
# verb under it. One script answers the controls here; the Editor owns the
# document and puts the form's rows on the pool when asked.

[[nodes]]
id = "panel"
name = "Inspector"
script = { source = "scripts/panels/inspector.bs" }
visible = false
[nodes.widget]
kind = "column"
role = "layout_dock"
grow = 1
[nodes.widget_layout]
gap = [0, 3]

# The node's mark and name, then its type beside them on one line.
[[nodes]]
id = "head"
name = "Head"
parent = "panel"
[nodes.widget]
kind = "row"
height = 26
[nodes.widget_layout]
align_items = "center"
gap = [6, 0]

# A button only for the mark it draws before its text; it takes no pointer.
[[nodes]]
id = "name"
name = "Name"
parent = "head"
[nodes.widget]
kind = "button"
role = "text_title"
interactive = false

[[nodes]]
id = "type"
name = "Type"
parent = "head"
[nodes.widget]
kind = "label"
role = "text_code_quiet"
[nodes.widget_text]
truncate = true

[[nodes]]
id = "search"
name = "Search"
parent = "panel"
bindings = { rows = [{ event = "emitted:value_changed", action = "call", value = "search_typed" }] }
[nodes.widget]
kind = "text_field"
role = "input_dock"
[nodes.widget_field]
placeholder = "Search"

[[nodes]]
id = "nothing"
name = "Nothing"
parent = "panel"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"
text = "nothing selected"

[[nodes]]
id = "scroll"
name = "Scroll"
parent = "panel"
bindings = { rows = [{ event = "emitted:scrolled", action = "call", value = "scrolled" }] }
[nodes.widget]
kind = "scroll"
grow = 1
[nodes.widget_scroll]
axis = "vertical"

# The rows on screen, each placed at its height in a column as tall as the whole
# form, so a node of hundreds of rows builds the few it shows: the pool makes
# them, and a row scrolled off is the one the next row takes.
[[nodes]]
id = "form"
name = "Form"
parent = "scroll"
[nodes.widget]
kind = "column"

[[nodes]]
id = "foot"
name = "Foot"
parent = "panel"
[nodes.widget]
kind = "row"
height = 36
[nodes.widget_layout]
align_items = "center"

[[nodes]]
id = "add"
name = "Add"
parent = "foot"
bindings = { rows = [{ event = "pointer_click", action = "call", value = "add" }] }
[nodes.widget]
kind = "button"
role = "action"
text = "Add component"
grow = 1
height = 30
