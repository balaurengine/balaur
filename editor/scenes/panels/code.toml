# The file being edited, over the stage or beside it in a split: the selected
# node's script, or a shader a material opened. One script fills it, hears
# the typing, the caret and the gutter, and holds the refactor sheet.

[[nodes]]
id = "code"
name = "Code"
script = { source = "scripts/panels/code.bs" }
visible = false
[nodes.widget]
kind = "panel"
absolute = true
inset = [0.0, 0.0, 0.0, 0.0]
fill = "bg_control"
stroke = "border_default"
corner_radius = 11
padding = [0, 12, 0, 12]

[[nodes]]
id = "note"
name = "Note"
parent = "code"
visible = false
[nodes.widget]
kind = "label"
role = "text_note"

[[nodes]]
id = "scroll"
name = "Scroll"
parent = "code"
[nodes.widget]
kind = "scroll"
grow = 1
[nodes.widget_scroll]
axis = "vertical"

[[nodes]]
id = "editor"
name = "Editor"
parent = "scroll"
[nodes.widget]
on_change = "typed"
kind = "code"
font_size = 13
[nodes.widget_field]
on_caret = "caret"
[nodes.widget_code]
on_gutter = "gutter"
gutter_width = 34

# Rename a name across the scripts, or find and replace: over the code's top
# right, with the list of what would change before anything is written.
[[nodes]]
id = "refactor"
name = "Refactor"
parent = "code"
instance = "scenes/panels/refactor.toml"
