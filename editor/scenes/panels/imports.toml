# The imports of the batch, top right under the bar: a line each and one bar
# for the lot of them, up while one runs and a moment after the last ends.

[[nodes]]
id = "imports"
name = "Imports"
script = { source = "scripts/panels/imports.bs" }
visible = false
[nodes.widget]
kind = "panel"
role = "sheet_imports"
anchor = "top_right"
x = 20.0
y = 52.0
interactive = false

[[nodes]]
id = "lines"
name = "Lines"
parent = "imports"
[nodes.widget]
kind = "column"
role = "layout_cells"
interactive = false

[[nodes]]
id = "bar"
name = "Bar"
parent = "imports"
visible = false
[nodes.widget]
kind = "progress_bar"
role = "bar_progress"
interactive = false
