# The imports of the batch, top right under the bar: a line each and one bar
# for the lot of them, up while one runs and a moment after the last ends.

[[nodes]]
id = "imports"
name = "Imports"
script = { source = "scripts/panels/imports.bs" }
visible = false
[nodes.widget]
kind = "panel"
role = "sheet"
anchor = "top_right"
x = 20.0
y = 52.0
padding = [12, 8, 12, 8]
interactive = false
whole_window = true
[nodes.widget_layout]
gap = [2, 2]

[[nodes]]
id = "lines"
name = "Lines"
parent = "imports"
[nodes.widget]
kind = "column"
interactive = false
[nodes.widget_layout]
gap = [0, 0]

[[nodes]]
id = "bar"
name = "Bar"
parent = "imports"
visible = false
[nodes.widget]
kind = "progress_bar"
width = 180
height = 4
interactive = false
