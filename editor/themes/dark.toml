# The editor's whole look, for both readers: the `ui::*` calls a script makes
# name a role, and the nodes in `scenes/main.toml` take the same roles and the
# kind tables below.
type = "widget_theme"
dark = true

# Four sheets on the site's dark ramp, one seam, three text levels, an accent,
# sage, warn and danger. Every ink reads at 4.5:1; `editor_theme.rs` holds it.
[colors]
bg = "#151f2a"
panel = "#1e2b3a"
sunken = "#10181f"
raised = "#2a3b4d"
line = "#2c3d50"
text = "#e6e9ee"
dim = "#9ba6b1"
faint = "#8a97a4"
accent = "#6fa4d8"
accent_fill = "#4287cc"
accent_soft = "#22364d"
sage = "#8fb8b0"
sage_soft = "#26403d"
warn = "#e0b04a"
danger = "#e37b7b"
grid = "#1c2835"
grid_major = "#2c3d50"
# Ink on the blue, as the site draws its dark buttons: white on it reads at
# 3.5:1, ink at 5.1:1.
on_accent = "#0b0e12"
k_key = "#6fa4d8"
k_str = "#8fb8b0"
k_num = "#9fc2e5"
k_com = "#8a97a4"
k_fn = "#e6e9ee"
k_type = "#b7d3cc"
k_punc = "#9ba6b1"
node_plain = "#8b96a2"
node_2d = "#c9a86a"
node_3d = "#6fa4d8"
node_ui = "#a98fd0"
node_phys = "#8fb8b0"
# A rig modifier's reach, drawn over the bones it solves: a colour no bone
# and no texture in the viewport is already using.
modifier = "#c98fd8"
# The disc the engine's dark mark sits on, in both themes, and the rings a
# touch leaves over the game view.
plate = "#e9edf2"
ripple = "#ffffff"
node_bone = "#d08a5f"

# Text. A call site names one of these and says nothing else about type.
[roles.title]
font = "heading"
size = 17
strong = true
color = "text"

[roles.heading]
font = "heading"
size = 11
strong = true
color = "dim"

[roles.body]
font = "ui"
size = 12
color = "text"

[roles.label]
font = "ui"
size = 12
color = "dim"

[roles.mono]
font = "mono"
size = 12
color = "text"

[roles.value]
font = "mono"
size = 12
color = "text"

[roles.meta]
font = "mono"
size = 11
color = "faint"

[roles.code]
font = "mono"
size = 12
color = "text"

# Shapes. Radii are tiles; `round = true` is the exception, not the rule.
[roles.sheet]
radius = 8
fill = "panel"

[roles.row]
height = 23
radius = 5
size = 12
align = "left"
color = "text"
font = "mono"
[roles.row.hover]
fill = "raised"

[roles.row_on]
height = 23
radius = 5
size = 12
align = "left"
fill = "accent_fill"
color = "on_accent"
font = "mono"
[roles.row_on.hover]
fill = "accent"

[roles.list_item]
height = 25
radius = 5
size = 12
align = "left"
fill = "sunken"
color = "text"
# The same row picked out: what a transition opened for editing wears.
[roles.list_item_on]
