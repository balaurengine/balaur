# The editor's whole look, for both readers: the `ui::*` calls a script makes
# name a role, and the nodes in `scenes/main.toml` take the same roles and the
# kind tables below.
type = "widget_theme"
dark = false

# Four surfaces, one seam, three levels of text, one accent and one second
# colour. A call site names one of these; nothing in the shell mixes its own.
[colors]
bg = "#f8f7f3"
panel = "#f1f3f6"
sunken = "#e3e7ec"
raised = "#ffffff"
line = "#dde2e8"
text = "#14181d"
dim = "#5b6670"
faint = "#717b87"
accent = "#2f6a9e"
accent_fill = "#3577b1"
accent_soft = "#dce8f3"
sage = "#4f7f78"
sage_soft = "#dbe8e6"
grid = "#e9ebed"
grid_major = "#d0d6dd"
on_accent = "#f6f8fb"
k_key = "#2b6291"
k_str = "#3f6e67"
k_num = "#2f6a9e"
k_com = "#8e99a5"
k_fn = "#1c2128"
k_type = "#4f7f78"
k_punc = "#6b7683"
node_plain = "#6b7580"
node_2d = "#8a6d1f"
node_3d = "#2f6a9e"
node_ui = "#6a4fa0"
node_phys = "#4f7f78"
# A rig modifier's reach, drawn over the bones it solves: a colour no bone
# and no texture in the viewport is already using.
modifier = "#7a3fa8"
node_bone = "#a05a2c"

# Text. A call site names one of these and says nothing else about type.
[roles.title]
font = "heading"
size = 17
strong = true
color = "text"

[roles.heading]
font = "heading"
size = 11
strong = true
color = "dim"

[roles.body]
font = "ui"
size = 12
color = "text"

[roles.label]
font = "ui"
size = 12
color = "dim"

[roles.mono]
font = "mono"
size = 12
color = "text"

[roles.value]
font = "mono"
size = 12
color = "text"

[roles.meta]
font = "mono"
size = 11
color = "faint"

[roles.code]
font = "mono"
size = 12
color = "text"

# Shapes. Radii are tiles; `round = true` is the exception, not the rule.
[roles.sheet]
radius = 8
fill = "panel"

[roles.row]
height = 23
radius = 5
size = 12
align = "left"
color = "text"
font = "mono"
[roles.row.hover]
fill = "raised"

[roles.row_on]
height = 23
radius = 5
size = 12
align = "left"
fill = "accent_fill"
color = "on_accent"
font = "mono"
[roles.row_on.hover]
fill = "accent"

[roles.list_item]
height = 25
radius = 5
size = 12
align = "left"
fill = "sunken"
color = "text"
[roles.list_item.hover]
fill = "raised"

[roles.tab]
height = 22
radius = 5
size = 12
strong = true
padding_x = 7
color = "faint"
[roles.tab.hover]
color = "dim"

[roles.tab_on]
height = 22
radius = 5
size = 12
strong = true
padding_x = 7
fill = "accent_soft"
color = "accent"
[roles.tab_on.hover]
color = "text"

[roles.tab_close]
height = 22
radius = 4
size = 12
padding_x = 0
color = "faint"

[roles.tab_close.hover]
fill = "raised"
color = "text"

[roles.navtab]
height = 26
radius = 5
size = 12
padding_x = 8
color = "faint"
[roles.navtab.hover]
fill = "raised"
color = "dim"

[roles.navtab_on]
height = 26
radius = 5
size = 12
padding_x = 8
fill = "accent_soft"
color = "accent"
[roles.navtab_on.hover]
color = "text"

[roles.field]
height = 22
radius = 5
size = 12
font = "mono"
fill = "sunken"
color = "text"
[roles.field.hover]
stroke = "line"

[roles.chip]
height = 22
radius = 6
size = 11
strong = true
padding_x = 8
fill = "sunken"
color = "dim"
[roles.chip.hover]
fill = "raised"
color = "text"

[roles.chip_on]
height = 22
radius = 6
size = 11
strong = true
padding_x = 8
fill = "accent_soft"
color = "accent"
[roles.chip_on.hover]
color = "text"

[roles.bar]
radius = 8
size = 11
font = "mono"
fill = "sunken"
color = "faint"

[roles.bar.hover]
fill = "raised"
color = "text"

[roles.button]
height = 28
radius = 5
size = 12
font = "ui"
strong = true
fill = "sunken"
color = "accent"
[roles.button.hover]
fill = "raised"
color = "text"

[roles.button.active]
fill = "accent_soft"

[roles.icon_button]
height = 21
radius = 4
size = 14
padding_x = 6
color = "dim"
[roles.icon_button.hover]
fill = "raised"
color = "text"

[roles.tool]
d = 28
size = 14
color = "dim"
[roles.tool.hover]
fill = "raised"
color = "text"

[roles.tool_on]
d = 28
size = 14
fill = "accent_soft"
color = "accent"
[roles.tool_on.hover]
color = "text"

[roles.transport]
d = 26
size = 14
round = true
fill = "sunken"
color = "dim"
[roles.transport.hover]
fill = "raised"
color = "text"

[roles.transport_on]
d = 26
size = 14
round = true
fill = "accent_fill"
color = "on_accent"
[roles.transport_on.hover]
fill = "accent"

[roles.chip_quiet]
height = 22
radius = 6
size = 11
strong = true
color = "faint"
[roles.chip_quiet.hover]
color = "dim"

[roles.chip_on_quiet]
height = 22
radius = 6
size = 11
strong = true
color = "dim"
[roles.chip_on_quiet.hover]
color = "text"

[roles.toggle]
height = 17

[roles.row_action]
height = 20
radius = 4
size = 12
strong = true
fill = "sunken"
color = "dim"
[roles.row_action.hover]
fill = "raised"
color = "text"

[roles.row_action_on]
height = 20
radius = 4
size = 12
strong = true
fill = "accent_soft"
color = "accent"

[roles.row_action_on.hover]
color = "text"

# The shell's own boxes, as `scenes/main.toml` holds them. `panel` is the
# sheet a dock is drawn on; the two containers only round what clips inside.
[panel]
fill = "panel"
radius = 8
padding = 8

[row]
radius = 8

[column]
radius = 8
