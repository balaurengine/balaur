text_color = "text_subtle"

[roles.text_label]
text_color = "text_muted"

# A row's label marked: what the engine says is off about the property, or a
# value the node changes of its prefab.
[roles.text_label_warning]
text_color = "warning_text"

[roles.text_label_override]
text_color = "primary_text"

# A lane's name, a Timeline track's or a recording's kind: one width, so
# every lane's marks start at one x against the ruler.
[roles.text_lane]
font = "mono"
font_size = "font_size_small"
text_color = "text_default"
width = 150

[roles.text_mark_picker]
