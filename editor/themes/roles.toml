# The editor's look, shared by the dark and the light theme: the roles a
# `ui::*` call or a node names, the kind tables, and the sizes. Colours are
# tokens the two theme files derive from their sources.
type = "widget_theme"

# The editor is denser than a game: every size derives from these two.
[sizes]
font_size = 12
control_height = 24

[panel]
fill = "bg_panel"
corner_radius = "radius_large"
padding = 8

[row]
corner_radius = "radius_large"

[column]
corner_radius = "radius_large"

# Text. A call site names one of these and says nothing else about type.
[roles.text_body]
text_color = "text_default"

[roles.text_caption]
font_family = "mono"
font_size = "font_size_small"
text_color = "text_subtle"

[roles.text_caption_primary]
font_family = "mono"
font_size = "font_size_small"
text_color = "primary_text"

[roles.text_caret_section]
font_size = "font_size_small"
text_color = "text_subtle"
text_align = "end"
width = 16

[roles.text_caret_subsection]
font_size = "font_size_small"
text_color = "text_subtle"
text_align = "end"
width = 28

[roles.text_code]
font_family = "mono"
text_color = "text_default"

[roles.text_code_quiet]
font_family = "mono"
text_color = "text_subtle"

[roles.text_code_secondary]
font_family = "mono"
text_color = "secondary_text"
padding_x = 7

[roles.text_code_success]
font_family = "mono"
text_color = "success_text"

[roles.text_heading]
