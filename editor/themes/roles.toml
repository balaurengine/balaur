# The editor's look, shared by the dark and the light theme: the roles a
# `ui::*` call or a node names, the kind tables, and the sizes. Colours are
# tokens the two theme files derive from their sources.
type = "widget_theme"

# The editor is denser than a game: every size derives from these two.
[sizes]
font_size = 12
control_height = 24

# Kinds of node and the axes keep their own hue whatever the brand colour is,
# so an orange primary cannot make a 3D node read as a bone.
[hues]
node_2d = 83.0
node_3d = 249.0
node_ui = 300.0
node_physics = 182.0
node_bone = 51.0
node_modifier = 315.0
axis_x = 19.0
axis_y = 131.0
axis_z = 254.0

# The viewport grid, this far from the background towards the foreground.
[mixes]
grid_minor = 0.05
grid_major = 0.15

# The disc behind the engine's mark and the rings a touch leaves, the same in
# both halves.
[colors]
brand_plate = "#e9edf2"
input_ripple = "#ffffff"

# The editor's faces. A role names one by its name here, as it names a
# colour by its token; `default` is every text that names none, `icon` the
# glyphs a button or a row draws beside its caption.
[fonts]
default = "fonts/SourceSans3-Regular.ttf"
heading = "fonts/SourceSans3-Semibold.ttf"
mono = "fonts/JetBrainsMono-Regular.ttf"
icon = "fonts/Phosphor.ttf"

# Every button eases between its states and rings itself for the keyboard
# 2 px outside its edge; a role says only its colours and size.
[button]
transition = 0.12

[button.focus]
outline = "primary_text"

# Whatever role it wears, a field is a well below the panel and a dropdown
# a control above it; the mono face is only for paths and code.
[text_field]
transition = 0.12
text_color = "text_default"
fill = "bg_app"
stroke_width = 1
stroke = "border_default"
corner_radius = "radius_small"
height = "control_height"

[text_field.hover]
stroke = "text_subtle"

[text_field.touch]
height = "control_height_touch"

[text_field.focus]
outline = "primary_text"

[text_area]
transition = 0.12
text_color = "text_default"
fill = "bg_app"
stroke_width = 1
stroke = "border_default"
corner_radius = "radius_small"

[text_area.hover]
stroke = "text_subtle"

[text_area.focus]
outline = "primary_text"

[number_field]
transition = 0.12
icon_color = "text_subtle"
text_color = "text_default"
fill = "bg_app"
stroke_width = 1
stroke = "border_default"
corner_radius = "radius_small"
height = "control_height"

[number_field.hover]
stroke = "text_subtle"

[number_field.touch]
height = "control_height_touch"

[number_field.focus]
outline = "primary_text"

[dropdown]
transition = 0.12
text_color = "text_default"
fill = "bg_control"
stroke_width = 1
stroke = "border_default"
corner_radius = "radius_small"
height = "control_height"

[dropdown.hover]
fill = "bg_control_hover"

[dropdown.touch]
height = "control_height_touch"

[dropdown.focus]
outline = "primary_text"

[checkbox]
transition = 0.12

[checkbox.focus]
outline = "primary_text"

[slider]
transition = 0.12

[slider.focus]
outline = "primary_text"

# A colour's swatch is square, the height of a form's field.
[color_picker]
width = "control_height"

# A list's, a tree's and a table's row: a control's height, a finger's on a
# touch screen.
[list]
row_height = "control_height"

[list.touch]
row_height = "control_height_touch"

[tree]
row_height = "control_height"

[tree.touch]
row_height = "control_height_touch"

[panel]
fill = "bg_panel"
corner_radius = "radius_large"
padding = 8

[row]
corner_radius = "radius_large"

[column]
corner_radius = "radius_large"

# Text. A call site names one of these and says nothing else about type.
# The mono face is for what is data, code, a path, a typed value, a log line;
# the shell's own words are in the UI face.
[roles.text_body]
text_color = "text_default"

[roles.text_caption]
font_size = "font_size_small"
text_color = "text_subtle"

[roles.text_caption_primary]
font_size = "font_size_small"
text_color = "primary_text"

[roles.text_code]
font = "mono"
text_color = "text_default"

[roles.text_code_quiet]
font = "mono"
text_color = "text_subtle"

[roles.text_code_secondary]
font = "mono"
text_color = "secondary_text"
padding_x = 7

[roles.text_code_success]
font = "mono"
text_color = "success_text"

[roles.text_caption_success]
font_size = "font_size_small"
text_color = "success_text"

# A data line under something, as a path or a version is: the mono face,
# small and quiet.
[roles.text_code_caption]
font = "mono"
font_size = "font_size_small"
text_color = "text_subtle"

[roles.text_heading]
font = "heading"
font_size = "font_size_small"
font_weight = 700
text_color = "text_muted"
text_transform = "uppercase"

[roles.text_heading_menu]
font_size = "font_size_small"
text_color = "text_subtle"
height = "control_height_small"

[roles.text_hint]
