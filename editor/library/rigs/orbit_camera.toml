# Drag to turn, wheel to pull back. The pivot trails what it watches and the
# camera orbits it, so a designer moves one node and the script never has to
# know where anything else is.

[[nodes]]
id = "rig_orbit"
name = "Orbit rig"

[nodes.script]
source = "scripts/follow.bs"

[nodes.script.props]
target = "../Subject"
lag = 0.15

[[nodes]]
id = "rig_orbit_camera"
name = "Camera"
parent = "rig_orbit"
script = { source = "scripts/orbit_camera.bs" }

[nodes.transform]
position = [0, 2, 8]

[nodes.camera3d]
current = true
