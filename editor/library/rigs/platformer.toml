# Left, right and jump over the 2D character controller, and a camera that
# trails the player one unit above it. The offset's z is the camera's depth.

[[nodes]]
id = "rig_platformer"
name = "Platformer rig"

[[nodes]]
id = "rig_platformer_player"
name = "Player"
parent = "rig_platformer"
script = { source = "scripts/platformer_rig.bs" }

[nodes.transform]
position = [0, 0, 0]

[nodes.shape2d]
shape = { kind = "capsule", radius = 0.4, height = 2.0 }
color = "#e8c37a"

[nodes.character2d]

[nodes.collider2d]
shape = { kind = "capsule", radius = 0.4, height = 2.0 }

[[nodes]]
id = "rig_platformer_camera"
name = "Camera"
parent = "rig_platformer"

[nodes.transform]
position = [0, 0, 10]

[nodes.camera2d]
current = true
pixels_per_unit = 48

[nodes.script]
source = "scripts/follow.bs"

[nodes.script.props]
target = "../Player"
lag = 0.18
offset = [0, 1, 10]
