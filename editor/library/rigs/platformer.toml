# Left, right and jump over the 2D character controller, and a camera that
# trails the player without a script of its own.

[[nodes]]
id = "rig_platformer"
name = "Platformer rig"

[[nodes]]
id = "rig_platformer_player"
name = "Player"
parent = "rig_platformer"
script = { source = "scripts/platformer_rig.rn" }

[nodes.transform]
position = [0, 0, 0]

[nodes.shape2d]
kind = "capsule"
radius = 0.4
height = 2.0
color = "#e8c37a"

[nodes.character2d]

[nodes.collider2d]
kind = "capsule"
radius = 0.4
height = 2.0

[[nodes]]
id = "rig_platformer_camera"
name = "Camera"
parent = "rig_platformer"

[nodes.transform]
position = [0, 0, 10]

[nodes.camera2d]
current = true
pixels_per_unit = 48

[nodes.modifier2d]
kind = "follow"
target = "../Player"
lag = 0.18
offset = [0, 1, 0]
