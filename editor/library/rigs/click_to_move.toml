# Click the ground and walk there. The click is a ray against the plane the
# character stands on, so a flat level needs no navmesh to point at.

[[nodes]]
id = "rig_click_to_move"
name = "Click to move"
script = "scripts/click_to_move.rn"

[nodes.transform]
position = [0, 1, 0]

[nodes.character3d]
snap_to_ground = 0.3

[nodes.collider3d]
kind = "capsule"
radius = 0.35
height = 1.2
