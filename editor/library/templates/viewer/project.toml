[application]
name = "{{name}}"
main_scene = "scenes/main.toml"

# What an export re-encodes on the way into the pack, kept only where it comes
# out smaller. Images go to lossless WebP and uncompressed audio to FLAC with no
# row here; `image_recode` and `audio_recode` choose otherwise.
[export]
# "subset" keeps only the code points the project's scenes and scripts name.
# The largest saving here by far: it takes the `text` example down by 89%.
# `font_ranges` adds hex ranges for text a server sends or a player types.
font_recode = "original"
