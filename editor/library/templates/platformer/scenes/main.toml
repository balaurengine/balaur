# A character on a floor, and a camera that follows it.

[[nodes]]
id = "n_world"
name = "World"

[[nodes]]
id = "n_camera"
name = "Camera"
parent = "n_world"

[nodes.transform]
position = [0, 0, 10]

[nodes.camera2d]
current = true
pixels_per_unit = 48

[[nodes]]
id = "n_ground"
name = "Ground"
parent = "n_world"
body2d = { kind = "static" }

[nodes.transform]
position = [0, -3, 0]

[nodes.shape2d]
kind = "rectangle"
size = [24, 1.0]
color = "#3c4a3a"

[nodes.collider2d]
kind = "rectangle"
size = [24, 1.0]

[[nodes]]
id = "n_player"
name = "Player"
parent = "n_world"
script = { source = "scripts/player.rn" }

[nodes.transform]
position = [0, 0, 0]

[nodes.shape2d]
kind = "capsule"
radius = 0.4
height = 2.0
color = "#e8c37a"

[nodes.character2d]

[nodes.collider2d]
kind = "capsule"
radius = 0.4
height = 2.0
