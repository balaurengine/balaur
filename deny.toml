# cargo-deny: security advisories, dependency bans, and source allowlisting.
# Licence checking is deliberately off.

[graph]
# Audit what we ship, which includes the optional `window` feature and its
# kiss3d/wgpu tree. Left at the default this checked only the headless graph,
# so CI failed on advisories a headless local build could not see.
all-features = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
# The unmaintained crates (rusttype, ttf-parser, paste) all come from kiss3d.
# Actual vulnerabilities stay errors in cargo-deny regardless of this setting.
unmaintained = "none"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Two forks, neither on crates.io: kiss3d with the macOS Command-modifier fix
# and mobile support, rune with `powf`/`powi` on `libm` for determinism
# (docs/DETERMINISM.md). Both are pinned in the root Cargo.toml.
allow-git = [
    "https://github.com/Ughuuu/kiss3d.git",
    "https://github.com/balaurengine/rune.git",
]
