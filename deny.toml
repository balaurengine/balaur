# cargo-deny. The tree cannot be pure MIT: rapier2d/parry2d/winit are
# Apache-2.0 only, kiss3d is BSD-3-Clause, and some deps are MPL-2.0.
[graph]
all-features = false

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unicode-3.0",
  # Fonts bundled by egui via epaint_default_fonts. Both are permissive for
  # embedding and redistribution; they are font licences, not code licences.
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
