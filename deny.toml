# cargo-deny: security advisories, dependency bans, and source allowlisting.
# Licence checking is deliberately off.

[graph]
# Audit what we ship, which includes the optional `window` feature and its
# kiss3d/wgpu tree. Left at the default this checked only the headless graph,
# so CI failed on advisories a headless local build could not see.
all-features = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
# Off. The unmaintained crates here (rusttype, ttf-parser, and paste via
# image's default-formats) all come from kiss3d, and updating kiss3d is not on
# the table right now. Unmaintained is informational anyway: nobody is minding
# the crate, not a known exploit. Actual vulnerabilities are always errors in
# cargo-deny and cannot be switched off here, which is the part that matters.
unmaintained = "none"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The kiss3d patch (see the root Cargo.toml): v0.46.0 plus the macOS
# Command-modifier fix, which is not on crates.io.
allow-git = ["https://github.com/dimforge/kiss3d"]
