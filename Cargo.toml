[workspace]
resolver = "3"
members = ["crates/*"]
# Out-of-workspace on purpose: extension tests must load a separately built plugin.
exclude = ["examples/extension_greeter"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# Pinned to the toolchain, so a build that cannot work fails saying so.
rust-version = "1.98.1"
license = "MIT"
authors = ["Dragos Daian <daian.dragos@yahoo.com>"]
repository = "https://github.com/balaurengine/balaur"
homepage = "https://balaurengine.org"
keywords = ["gamedev", "game-engine", "deterministic", "2d", "3d"]
categories = ["game-engines"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "allow", priority = -1 }
# Noise for an application: these fire on hundreds of sites and none of them
# is a defect.
must_use_candidate       = "allow"
module_name_repetitions  = "allow"
struct_field_names       = "allow"
# Graphics and physics: f32 is the GPU type and these casts are deliberate.
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"
many_single_char_names   = "allow"
redundant_pub_crate      = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
doc_markdown             = "allow"
too_long_first_doc_paragraph = "allow"

[workspace.lints.rust]
unreachable_pub    = "warn"
rust_2018_idioms   = { level = "warn", priority = -1 }

[workspace.dependencies]
regex-lite = "0.1"
# Content hashes for packed binary assets, and the release checksums.
sha2 = "0.11"
balaur_cfg = { path = "crates/balaur_cfg", version = "0.2.0" }
balaur_core = { path = "crates/balaur_core", version = "0.2.0" }
balaur_plugin = { path = "crates/balaur_plugin", version = "0.2.0" }
balaur_script = { path = "crates/balaur_script", version = "0.2.0" }
balaur_script_rune = { path = "crates/balaur_script_rune", version = "0.2.0", default-features = false }
balaur_bs = { path = "crates/balaur_bs", version = "0.2.0", default-features = false }
balaur_script_bs = { path = "crates/balaur_script_bs", version = "0.2.0", default-features = false }
balaur_physics = { path = "crates/balaur_physics", version = "0.2.0", default-features = false }
balaur_animation = { path = "crates/balaur_animation", version = "0.2.0" }
balaur_render = { path = "crates/balaur_render", version = "0.2.0", default-features = false }
balaur_audio = { path = "crates/balaur_audio", version = "0.2.0", default-features = false }
balaur_input = { path = "crates/balaur_input", version = "0.2.0" }
balaur_http = { path = "crates/balaur_http", version = "0.2.0" }
balaur_websocket = { path = "crates/balaur_websocket", version = "0.2.0" }
balaur_webtransport = { path = "crates/balaur_webtransport", version = "0.2.0" }
balaur_gamend = { path = "crates/balaur_gamend", version = "0.2.0" }
balaur_multiplayer = { path = "crates/balaur_multiplayer", version = "0.2.0", default-features = false }
balaur_browser = { path = "crates/balaur_browser", version = "0.2.0" }
balaur_platform = { path = "crates/balaur_platform", version = "0.2.0" }
balaur_apple = { path = "crates/balaur_apple", version = "0.2.0" }
balaur_import = { path = "crates/balaur_import", version = "0.2.0" }
balaur_text = { path = "crates/balaur_text", version = "0.2.0" }
balaur_ui = { path = "crates/balaur_ui", version = "0.2.0" }
balaur = { path = "crates/balaur", version = "0.2.0", default-features = false }
balaur_testkit = { path = "crates/balaur_testkit", version = "0.2.0" }
balaur_export = { path = "crates/balaur_export", version = "0.2.0" }

hecs = "0.11"
# The two features parry's `enhanced-determinism` turns on. Named here too, so a
# crate built without physics in its graph gets the same math, not the platform's.
glamx = { version = "0.3", features = ["libm", "scalar-math"] }
notify = "8"
# `parallel` is added per target in balaur_physics: it threads the solver on
# rayon, which no wasm build can block on. rapier compiles that pipeline only
# without `unsync-callbacks`, so the hooks in balaur_physics hold no `Engine`.
rapier3d = { version = "0.36", features = ["enhanced-determinism", "serde-serialize", "debug-render", "fem"] }
rapier2d = { version = "0.36", features = ["enhanced-determinism", "serde-serialize", "debug-render", "fem"] }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
serde_json = "1"
toml = "1"
anyhow = "1"
# `serde` so the deterministic collections inside a recorded snapshot
# serialize in their insertion order, which is the order that matters.
indexmap = { version = "2", features = ["serde"] }
smallvec = "1.16.2"
smol_str = "0.3"
# egui's bundled faces are the editor's (`balaur/egui-fonts`); a game hands egui
# balaur_text's.
egui = { version = "0.36", default-features = false }
# The widget tree's layout: retained flexbox and grid, so rects are decided
# before anything draws. Block and float are off: Balaur lays out no blocks.
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "flexbox_balance", "grid", "content_size"] }
rustc-hash = "2"
libm = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Bridges `log` records from third-party crates (wgpu, winit, rapier)
# into tracing so they land in the same buffer.
tracing-log = "0.2"
clap = { version = "4", features = ["derive"] }
ureq = "3"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# What a native I/O thread sleeps in: epoll, kqueue or IOCP, until its socket
# is ready or its queue wakes it. Already built through tokio.
mio = { version = "1", default-features = false, features = ["os-poll", "net"] }

# Fast script iteration is the whole point; keep debug builds usable. Line
# tables only, and opt 0 except where an editor frame runs, below.
[profile.dev]
debug = "line-tables-only"

# The crates an editor frame runs through. Rune's handlers and the hecs, glam
# and egui generics instantiate here: at 0 a 2000-node frame ran 2.6x the
# instructions, and 2 or 3 buy 2% more. docs/PLAN-editor-performance.md §9.
[profile.dev.package]
balaur = { opt-level = 1 }
balaur_core = { opt-level = 1 }
balaur_render = { opt-level = 1 }
balaur_script = { opt-level = 1 }
balaur_script_rune = { opt-level = 1 }
balaur_text = { opt-level = 1 }
balaur_ui = { opt-level = 1 }

# A dependency's line tables are copied into each of the 130 test binaries and
# read only when a backtrace passes through one. The workspace keeps its own.
[profile.dev.package."*"]
debug = false
# Rune's VM, egui and hecs: at 0 an editor frame ran 2.6 to 2.9x the instructions.
opt-level = 3

# Optimised, wasmi dispatches each instruction by tail call, and the debug
# checks keep LLVM from making them tail calls: a long `.bs` loop then
# overflows the stack. Release has neither check.
[profile.dev.package.wasmi]
debug-assertions = false
overflow-checks = false

# What ships: whole-program LTO and one codegen unit, a slower link for a
# smaller, faster binary. `panic` stays unwind for the extension seam.
[profile.release]
lto = "fat"
codegen-units = 1

# Every byte is a download the player waits for. Kept off `release` so a
# native build pays nothing for a web trade. `panic = "abort"` is sound only
# here: no browser has `dlopen`, so nothing can panic across the C ABI.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Rune's VM at "z" ran an editor frame in 1.2 to 1.6x the cycles of "s", which
# costs 0.07 MB of brotli; 3 is no quicker for twice that. Same plan, §9.
[profile.web.package]
rune = { opt-level = "s" }
rune-alloc = { opt-level = "s" }
rune-core = { opt-level = "s" }
balaur_script_rune = { opt-level = "s" }

# Four forks. Cargo.lock pins each commit; to hack on one locally, use a
# `paths` override in .cargo/config.toml rather than editing this.
[patch.crates-io]
# 0.14.2 made deterministic and debuggable: `powf`/`powi` and hashing off the
# platform, break points in the VM, an instruction counter. Rune installs its
# stdlib wholesale and nothing can be overridden, so a fork is the only way.
rune = { git = "https://github.com/balaurengine/rune.git", branch = "deterministic-pow" }
# Upstream v0.46.0 plus the opaque web canvas and the engine's three hooks:
# IME events, a mid-pass screen copy for 2D materials, UIKit's safe area.
# On `balaur-wrapped-surface` (Ughuuu/kiss3d#1) until it merges into `balaur-hooks`.
kiss3d = { path = "/Users/dragosdaian/Documents/appsinacup/kiss3d" }
# 0.19.0 on the harfrust and skrifa epaint uses, so one copy of each links.
cosmic-text = { git = "https://github.com/Ughuuu/cosmic-text.git", branch = "balaur-harfrust-0.12" }
# 0.36.2 with glyphs filled by zeno, which the engine's own text already links,
# instead of vello_cpu: 1.4 MB less in a web build. Every crate of the egui
# workspace, so they share one emath and one ecolor.
egui = { git = "https://github.com/Ughuuu/egui.git", branch = "balaur-zeno-glyphs" }
egui-wgpu = { git = "https://github.com/Ughuuu/egui.git", branch = "balaur-zeno-glyphs" }
epaint = { git = "https://github.com/Ughuuu/egui.git", branch = "balaur-zeno-glyphs" }
epaint_default_fonts = { git = "https://github.com/Ughuuu/egui.git", branch = "balaur-zeno-glyphs" }
emath = { git = "https://github.com/Ughuuu/egui.git", branch = "balaur-zeno-glyphs" }
ecolor = { git = "https://github.com/Ughuuu/egui.git", branch = "balaur-zeno-glyphs" }
