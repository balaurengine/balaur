[workspace]
resolver = "2"
members = ["crates/*"]
# Out-of-workspace on purpose: extension tests must load a separately built plugin.
exclude = ["examples/extension_greeter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Pinned to the toolchain, so a build that cannot work fails saying so.
rust-version = "1.98.1"
license = "MIT"
authors = ["Dragos Daian <daian.dragos@yahoo.com>"]
repository = "https://github.com/balaurengine/balaur"
homepage = "https://balaurengine.org"
keywords = ["gamedev", "game-engine", "deterministic", "2d", "3d"]
categories = ["game-engines"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "allow", priority = -1 }
# Noise for an application: these fire on hundreds of sites and none of them
# is a defect.
must_use_candidate       = "allow"
module_name_repetitions  = "allow"
struct_field_names       = "allow"
# Graphics and physics: f32 is the GPU type and these casts are deliberate.
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"
many_single_char_names   = "allow"
redundant_pub_crate      = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
doc_markdown             = "allow"
too_long_first_doc_paragraph = "allow"

[workspace.lints.rust]
unreachable_pub    = "warn"
rust_2018_idioms   = { level = "warn", priority = -1 }

[workspace.dependencies]
# Content hashes for packed binary assets, and the release checksums.
sha2 = "0.11"
balaur_core = { path = "crates/balaur_core", version = "0.1.0" }
balaur_plugin = { path = "crates/balaur_plugin", version = "0.1.0" }
balaur_script = { path = "crates/balaur_script", version = "0.1.0" }
balaur_script_rune = { path = "crates/balaur_script_rune", version = "0.1.0" }
balaur_physics = { path = "crates/balaur_physics", version = "0.1.0", default-features = false }
balaur_anim = { path = "crates/balaur_anim", version = "0.1.0" }
balaur_render = { path = "crates/balaur_render", version = "0.1.0" }
balaur_audio = { path = "crates/balaur_audio", version = "0.1.0" }
balaur_input = { path = "crates/balaur_input", version = "0.1.0" }
balaur_http = { path = "crates/balaur_http", version = "0.1.0" }
balaur_websocket = { path = "crates/balaur_websocket", version = "0.1.0" }
balaur_webtransport = { path = "crates/balaur_webtransport", version = "0.1.0" }
balaur_gamend = { path = "crates/balaur_gamend", version = "0.1.0" }
balaur_platform = { path = "crates/balaur_platform", version = "0.1.0" }
balaur_apple = { path = "crates/balaur_apple", version = "0.1.0" }
balaur_ui = { path = "crates/balaur_ui", version = "0.1.0" }
balaur = { path = "crates/balaur", version = "0.1.0", default-features = false }
balaur_export = { path = "crates/balaur_export", version = "0.1.0" }

hecs = "0.11"
# The two features parry's `enhanced-determinism` turns on. Named here too, so a
# crate built without physics in its graph gets the same math, not the platform's.
glamx = { version = "0.3", features = ["libm", "scalar-math"] }
notify = "8"
# `parallel` threads the solver on rayon; rapier compiles that pipeline only
# without `unsync-callbacks`, so the hooks in balaur_physics hold no `Engine`.
rapier3d = { version = "0.35", features = ["enhanced-determinism", "serde-serialize", "debug-render", "parallel"] }
rapier2d = { version = "0.35", features = ["enhanced-determinism", "serde-serialize", "debug-render", "parallel"] }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
serde_json = "1"
toml = "1"
anyhow = "1"
# `serde` so the deterministic collections inside a recorded snapshot
# serialize in their insertion order, which is the order that matters.
indexmap = { version = "2", features = ["serde"] }
egui = "0.36"
rustc-hash = "2"
libm = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Bridges `log` records from third-party crates (wgpu, winit, rapier)
# into tracing so they land in the same buffer.
tracing-log = "0.2"
clap = { version = "4", features = ["derive"] }
ureq = "3"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# Fast script iteration is the whole point; keep debug builds usable.
# Dev trades runtime speed for iteration speed: opt 0 everywhere, minimal
# debuginfo. Play at full speed with --release.
[profile.dev]
debug = "line-tables-only"

# Every byte is a download the player waits for. Kept off `release` so a
# native build pays nothing for a web trade. `panic = "abort"` is sound only
# here: no browser has `dlopen`, so nothing can panic across the C ABI.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Two forks. Cargo.lock pins both commits; to hack on either locally, use a
# `paths` override in .cargo/config.toml rather than editing this.
[patch.crates-io]
# 0.14.2 made deterministic and debuggable: `powf`/`powi` and hashing off the
# platform, break points in the VM, an instruction counter. Rune installs its
# stdlib wholesale and nothing can be overridden, so a fork is the only way.
rune = { git = "https://github.com/balaurengine/rune.git", branch = "deterministic-pow" }
# Upstream master (v0.46.0, the egui Command-modifier fix and iOS/Android
# support, all merged) plus one web fix: present the canvas opaque, or a
# browser composites the page through a frame whose alpha nothing ever sets.
kiss3d = { git = "https://github.com/Ughuuu/kiss3d.git", branch = "web-fixes" }
