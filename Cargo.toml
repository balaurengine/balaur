[workspace]
resolver = "2"
members = ["crates/*"]
# Out-of-workspace on purpose: extension tests must load a separately built plugin.
exclude = ["examples/extension_greeter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "allow", priority = -1 }
# Noise for an application: these fire on hundreds of sites and none of them
# is a defect.
must_use_candidate       = "allow"
module_name_repetitions  = "allow"
struct_field_names       = "allow"
# Graphics and physics: f32 is the GPU type and these casts are deliberate.
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"
many_single_char_names   = "allow"
redundant_pub_crate      = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
doc_markdown             = "allow"
too_long_first_doc_paragraph = "allow"

[workspace.lints.rust]
unreachable_pub    = "warn"
rust_2018_idioms   = { level = "warn", priority = -1 }

[workspace.dependencies]
balaur_core = { path = "crates/balaur_core", version = "0.1.0" }
balaur_plugin = { path = "crates/balaur_plugin", version = "0.1.0" }
balaur_script = { path = "crates/balaur_script", version = "0.1.0" }
balaur_script_luau = { path = "crates/balaur_script_luau", version = "0.1.0" }
balaur_script_rune = { path = "crates/balaur_script_rune", version = "0.1.0" }
balaur_physics = { path = "crates/balaur_physics", version = "0.1.0" }
balaur_anim = { path = "crates/balaur_anim", version = "0.1.0" }
balaur_render = { path = "crates/balaur_render", version = "0.1.0" }
balaur_audio = { path = "crates/balaur_audio", version = "0.1.0" }
balaur_input = { path = "crates/balaur_input", version = "0.1.0" }
balaur_net = { path = "crates/balaur_net", version = "0.1.0" }
balaur_gamend = { path = "crates/balaur_gamend", version = "0.1.0" }
balaur_ui = { path = "crates/balaur_ui", version = "0.1.0" }
balaur = { path = "crates/balaur", version = "0.1.0", default-features = false }

hecs = "0.11"
mlua = { version = "0.12", features = ["luau", "error-send"] }
glamx = "0.3"
notify = "8"
rapier3d = { version = "0.35", features = ["enhanced-determinism"] }
rapier2d = { version = "0.35", features = ["enhanced-determinism"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
indexmap = "2"
egui = "0.36"
rustc-hash = "2"
libm = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Bridges `log` records from third-party crates (wgpu, winit, rapier)
# into tracing so they land in the same buffer.
tracing-log = "0.2"
clap = { version = "4", features = ["derive"] }
ureq = "3"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# Fast script iteration is the whole point; keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Our kiss3d fork: v0.46.0 + the macOS Command-modifier fix for egui + iOS/Android
# support. Cargo.lock pins the commit; to hack on kiss3d locally, use a `paths`
# override in .cargo/config.toml rather than editing this.
[patch.crates-io]
kiss3d = { git = "https://github.com/Ughuuu/kiss3d.git", branch = "mobile-fixes" }
