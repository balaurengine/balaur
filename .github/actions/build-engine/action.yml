name: Build the Balaur engine
description: >-
  Build the editor and the runtime templates from the checkout this action
  stands in, with whichever cargo features the game needs — the way to get an
  engine the published build does not offer.

inputs:
  target:
    description: >-
      A desktop target to build for this runner: linux-x64, linux-arm64,
      macos-universal or windows-x64. Each is built on its own OS, except
      macos-universal, which lipos both Mac slices into one binary.
    required: false
    default: ""
  platform:
    description: >-
      A runtime template to build instead of a desktop one: ios, android or
      web.
    required: false
    default: ""
  features:
    description: >-
      Cargo features for the editor and desktop runtime, replacing the
      default `window,extensions` (`window,apple,extensions` on a Mac). See
      docs/generated/features.md for what each costs.
    required: false
    default: ""
  web-features:
    description: Cargo features for the web template, replacing its default.
    required: false
    default: ""
  threads:
    description: >-
      Build the web template with wasm atomics and a shared memory. The module
      a browser gets is a different one, loadable only on a cross-origin
      isolated page, so this produces a template beside the plain one rather
      than replacing it. Needs a nightly toolchain, which this action installs.
    required: false
    default: "false"
  variant:
    description: >-
      Names a second build of the same platform, so several can be uploaded
      side by side: `2d`, `server` or `threads` become
      `balaur-template-web-2d` and so on. Empty is the platform's own build,
      the one a release ships.
    required: false
    default: ""
  build-deps:
    description: >-
      Install the system libraries the build links on Linux. Turn off if the
      job installed them already.
    required: false
    default: "true"
  upload:
    description: >-
      Upload what was built, under the same `balaur-*` names a release holds.
    required: false
    default: "true"
  attest:
    description: >-
      Attach Sigstore build provenance to the artifacts. The calling job needs
      `id-token: write` and `attestations: write`.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # A desktop build produces the editor and its runtime; a platform build
    # produces a template. Each is uploaded under the name a release holds.
    - id: what
      shell: bash
      run: |
        set -euo pipefail
        if [ -n '${{ inputs.target }}' ]; then
          echo 'artifact=balaur-${{ inputs.target }}' >>"$GITHUB_OUTPUT"
        elif [ -n '${{ inputs.platform }}' ]; then
          variant='${{ inputs.variant }}'
          echo "artifact=balaur-template-${{ inputs.platform }}${variant:+-$variant}" >>"$GITHUB_OUTPUT"
        else
          echo '::error::build-engine needs either a target or a platform'
          exit 1
        fi

    # A windowed build links winit's X11 and Wayland stacks; a headless one
    # still needs the audio and input libraries.
    - if: inputs.build-deps == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        # The image's Chrome and Microsoft repos, which nothing here installs
        # from: a hash mismatch in one fails the whole `apt-get update`.
        sudo rm -f /etc/apt/sources.list.d/*{google,microsoft}*
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev libudev-dev \
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
          libxkbcommon-dev libwayland-dev

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ steps.what.outputs.artifact }}-${{ inputs.features }}${{ inputs.web-features }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - if: inputs.platform == 'android'
      shell: bash
      run: |
        set -euo pipefail
        bin=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
        # One line per ABI the template carries: the Rust target, and the
        # clang the NDK names it by, which for armv7 is not the triple.
        for pair in \
          aarch64-linux-android:aarch64-linux-android \
          armv7-linux-androideabi:armv7a-linux-androideabi \
          i686-linux-android:i686-linux-android \
          x86_64-linux-android:x86_64-linux-android; do
          target=${pair%%:*}
          prefix=${pair#*:}
          env=$(echo "$target" | tr 'a-z-' 'A-Z_')
          {
            echo "CC_${target//-/_}=$bin/$prefix$API-clang"
            echo "CXX_${target//-/_}=$bin/$prefix$API-clang++"
            echo "AR_${target//-/_}=$bin/llvm-ar"
            echo "CARGO_TARGET_${env}_LINKER=$bin/$prefix$API-clang"
          } >>"$GITHUB_ENV"
        done
      env:
        # The manifest's minSdkVersion in scripts/package_template.sh; a
        # library built for a newer API would not load on a device it names.
        API: "26"

    # The bindgen CLI has to be the exact version the build links against, so
    # the pin is read off Cargo.lock rather than written down twice.
    - if: inputs.platform == 'web'
      shell: bash
      run: |
        set -euo pipefail
        # The image's Chrome and Microsoft repos, which nothing here installs
        # from: a hash mismatch in one fails the whole `apt-get update`.
        sudo rm -f /etc/apt/sources.list.d/*{google,microsoft}*
        sudo apt-get update
        sudo apt-get install -y binaryen brotli bc
        want=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[" ]/,""); sub(/version=/,""); print; exit}' Cargo.lock)
        cargo install wasm-bindgen-cli --version "$want" --locked

    # `-Z build-std` rebuilds std with atomics, and that is nightly only. It
    # is installed beside the pinned stable, never over it.
    - if: inputs.platform == 'web' && inputs.threads == 'true'
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install nightly --profile minimal
        # A separate `component add`. Asking for rust-src during `toolchain
        # install` can report success and leave the component missing, and the
        # build then fails deep in `-Z build-std` with a missing Cargo.lock.
        rustup component add rust-src --toolchain nightly
        rustup target add wasm32-unknown-unknown --toolchain nightly
        test -f "$(rustc +nightly --print sysroot)/lib/rustlib/src/rust/library/Cargo.lock"

    - shell: bash
      env:
        BALAUR_FEATURES: ${{ inputs.features }}
        WEB_FEATURES: ${{ inputs.web-features }}
        WEB_THREADS: ${{ inputs.threads == 'true' && '1' || '' }}
      run: |
        set -euo pipefail
        if [ -n '${{ inputs.target }}' ]; then
          ./scripts/package.sh '${{ inputs.target }}'
        else
          ./scripts/package_template.sh '${{ inputs.platform }}'
        fi

    - if: inputs.upload == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.what.outputs.artifact }}
        path: dist/*
        if-no-files-found: error

    - if: inputs.attest == 'true'
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: dist/*
