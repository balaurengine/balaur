name: Docs

# Both kinds of documentation: what rustdoc builds from the source, and what
# scripts/gen_docs.py generates into docs/generated/ and must not drift from.
# Neither is platform-specific, so both run once.
on:
  # Runs from .github/workflows/runner.yml, which owns the triggers; kept
  # dispatchable so it can still be run on its own from the Actions tab.
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: rustdoc · generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # gen_docs boots the engine to read the script API out of it rather than
      # parsing source, so it needs whatever balaur_cli needs to build.
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --lib
      - name: Regenerate and diff
        run: python3 scripts/gen_docs.py --check
