name: Docs

# Both kinds of documentation, in two jobs so a failure names itself: what
# rustdoc builds from the source, and what scripts/gen_docs.py generates into
# docs/generated/ and must not drift from.
on:
  # Runs from .github/workflows/runner.yml, which owns the triggers; kept
  # dispatchable so it can still be run on its own from the Actions tab.
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `-D warnings` here is mostly about intra-doc links: a `[`Thing`]` that
  # names a private or renamed item is a dead link in the published docs.
  rustdoc:
    name: rustdoc builds with no broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --lib

  generated-docs:
    name: docs/generated is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # gen_docs boots the engine to read the script API out of it rather than
      # parsing source, so it needs whatever balaur_cli needs to build.
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate and diff
        run: python3 scripts/gen_docs.py --check
