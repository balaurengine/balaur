name: Build

# Everything that produces an artifact somebody downloads: a push to main
# refreshes the rolling `nightly` prerelease, a `v*` tag drafts that version,
# and publishing a version stays a human decision.
on:
  # Runs from .github/workflows/runner.yml, which owns the triggers; kept
  # dispatchable so it can still be run on its own from the Actions tab.
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-editor:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: build editor · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # One universal binary rather than two downloads: package.sh builds
          # both slices and lipos them, so Apple Silicon and Intel get the
          # same file.
          - os: macos-latest
            target: macos-universal
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v7
      # The same action a game's own repository calls to build a custom
      # engine, so one that stopped working would fail this build first.
      - uses: ./.github/actions/build-engine
        with:
          target: ${{ matrix.target }}
          attest: ${{ github.event_name == 'push' }}

  # Runtime templates for the non-desktop platforms, packaged as the shape
  # each OS starts (scripts/package_template.sh). Web is wasm-bindgen on
  # wasm32-unknown-unknown, the target kiss3d and wgpu support in a browser.
  build-platforms:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The artifact is an unsigned .app: signing needs a certificate
          # that belongs to whoever ships the game, never to this repo.
          - platform: ios
            host: macos-latest
          - platform: android
            host: ubuntu-latest
          - platform: web
            host: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The action carries the NDK and wasm-bindgen setup each platform needs,
      # so a game building its own template gets the same toolchain this does.
      - uses: ./.github/actions/build-engine
        with:
          platform: ${{ matrix.platform }}
          attest: ${{ github.event_name == 'push' }}

  # Exports a game with each template and checks the result is what the OS
  # installs or a host serves — the half a template build cannot check.
  export-mobile:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: export ${{ matrix.platform }}
    needs: build-platforms
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS for `vtool`, which tells an iOS binary from a host one.
          - platform: ios
            host: macos-latest
          # Ubuntu for the SDK build-tools that assemble and sign the APK.
          - platform: android
            host: ubuntu-latest
          - platform: web
            host: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: actions/download-artifact@v8
        with:
          name: balaur-template-${{ matrix.platform }}
          path: dist
      - uses: Swatinem/rust-cache@v2
        with:
          key: export-${{ matrix.platform }}
      - name: Export a game with the template
        shell: bash
        run: ./scripts/export_check.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: balaur-example-${{ matrix.platform }}
          path: dist/balaur-example-*
          if-no-files-found: error
      - name: Attest what was built
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/balaur-example-*

  # `export-game` over an example, with the engine this run built rather than a
  # published one: the action a game's own repository calls, proven on every
  # push instead of on the day someone else runs it.
  export-with-the-action:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: export a game with the action
    needs: [build-editor, build-platforms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: balaur-linux-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: balaur-template-web
          path: dist
      # Laid out the way the editor download is, so the exporter finds its
      # templates beside the binary and nothing has to be fetched.
      - name: Put this run's engine on PATH
        run: |
          set -euo pipefail
          tar -xzf dist/balaur-editor-linux-x64.tar.gz -C dist
          install=$PWD/dist/balaur-editor-linux-x64
          mkdir -p "$install/templates"
          tar -xzf dist/balaur-template-web.tar.gz -C "$install/templates"
          cp dist/balaur-runtime-linux-x64 "$install/templates/"
          chmod +x "$install/balaur" "$install/templates/balaur-runtime-linux-x64"
          echo "$install" >>"$GITHUB_PATH"
      - uses: ./.github/actions/export-game
        with:
          project: examples/hello
          targets: "linux-x64 web"
          download: "false"
          attest: ${{ github.event_name == 'push' }}

  # The web build as the one download a site refreshes: the glue and module
  # from the web template, plus the editor's project and the examples packed
  # with the linux editor binary (scripts/package_play.sh).
  bundle-web:
    name: bundle web
    needs: [build-editor, build-platforms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The editor binary is windowed, so loading it wants the libraries a
      # build links, though exporting never opens a window.
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev
      - uses: actions/download-artifact@v8
        with:
          name: balaur-linux-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: balaur-template-web
          path: dist
      - name: Pack the web bundle
        run: ./scripts/package_play.sh
      - uses: actions/upload-artifact@v7
        with:
          name: balaur-play
          path: dist/balaur-play.tar.gz
          if-no-files-found: error

  # The only job that publishes anything, so the only one a pull request skips:
  # everything above still builds and is still checked, which is the point of
  # running this on a PR at all.
  draft-release:
    name: draft release
    # A push to main or a `v*` tag, never a manual run: draft_release.sh moves
    # the rolling `nightly` tag to whatever branch it was dispatched from.
    if: github.event_name == 'push'
    needs:
      [build-editor, build-platforms, export-mobile, export-with-the-action, bundle-web]
    runs-on: ubuntu-latest
    # Drafting a release means writing to the repo's releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: balaur-*
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/draft_release.sh dist
