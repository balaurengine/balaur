name: Build

# Everything that produces an artifact somebody downloads.
#
# `build-editor` is named for the artifact people download, but it emits two,
# because they are one program: the editor is a Balaur project that the binary
# runs, and a game is that same binary with a pack appended. Splitting them
# into separate jobs would compile the identical thing twice.
#
# A push to main refreshes a rolling draft release; a `v*` tag drafts that
# version. Publishing stays a human decision.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-editor:
    name: build editor · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # One universal binary rather than two downloads: package.sh builds
          # both slices and lipos them, so Apple Silicon and Intel get the
          # same file.
          - os: macos-latest
            target: macos-universal
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v7
      # A shipped build is windowed, so it links winit's X11/Wayland stack.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      # Builds, stages, and then proves the artifact works: it exports a game
      # with the template it just built and runs that game. See
      # scripts/package.sh — "it compiled" is not the same as "it works".
      - name: Build and package
        shell: bash
        run: ./scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: balaur-${{ matrix.target }}
          path: dist/balaur-*
          if-no-files-found: error

  # Platforms the engine reaches but cannot yet ship a game for.
  #
  # A runtime template has to open a window, and kiss3d is desktop-bound — its
  # egui feature pulls in `rfd`, which has no mobile backend. So there is no
  # honest iOS, Android or web template to build today, and claiming otherwise
  # by publishing a headless binary would be worse than publishing nothing.
  # What these jobs do check is that the engine and its simulation still
  # compile for the platform, which is the half that has to work first.
  #
  # All three are green and required. Audio is a stub on wasm (no cpal host
  # compiles there; see balaur_audio), and the web target is emscripten rather
  # than wasm32-unknown-unknown because Luau is C++ and needs a libc to
  # compile against, which only emscripten provides (mlua#23).
  #
  # `check`, not `build`, because it deliberately produces no artifact: the
  # release ships desktop templates only. Beyond the window, a mobile template
  # is not even a binary — iOS ships a signed .app/.ipa and Android an .apk, so
  # the template is a bundle skeleton carrying the pack as a resource, signed
  # with the developer's credentials rather than CI's. Appending a pack to an
  # executable is a desktop trick. See docs/PLAN-mobile-export.md.
  check-platforms:
    name: check · ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            host: macos-latest
          - target: aarch64-linux-android
            host: ubuntu-latest
          - target: wasm32-unknown-emscripten
            host: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      # Luau is C++, so this needs a C++ compiler for the target, not just a
      # Rust target. API 26 because that is cpal's floor: its Android backend
      # is AAudio, which the platform added in 26.
      - name: Android NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"
      - name: Emscripten
        if: matrix.target == 'wasm32-unknown-emscripten'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest
          echo "$PWD/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Check
        run: cargo check -p balaur --target ${{ matrix.target }}

  draft-release:
    name: draft release
    needs: build-editor
    runs-on: ubuntu-latest
    # Drafting a release means writing to the repo's releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: balaur-*
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/draft_release.sh dist
