name: Build

# Everything that produces an artifact somebody downloads.
#
# The editor and the runtime template are the same binary: the editor is a
# Balaur project the binary runs, and a game is that binary with a pack
# appended. So one compile per platform yields both, and splitting them into
# separate jobs would only compile the identical thing twice.
#
# A push to main refreshes a rolling draft release; a `v*` tag drafts that
# version. Publishing stays a human decision.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
          # macos-13 is the last x86_64 image, and Intel Macs still play games.
          - os: macos-13
            target: macos-x64
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v7
      # A shipped build is windowed, so it links winit's X11/Wayland stack.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      # Builds, stages, and then proves the artifact works: it exports a game
      # with the template it just built and runs that game. See
      # scripts/package.sh — "it compiled" is not the same as "it works".
      - name: Build and package
        shell: bash
        run: ./scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: balaur-${{ matrix.target }}
          path: dist/balaur-*
          if-no-files-found: error

  # Platforms the engine reaches but cannot yet ship a game for.
  #
  # A runtime template has to open a window, and kiss3d is desktop-bound — its
  # egui feature pulls in `rfd`, which has no mobile backend. So there is no
  # honest iOS or Android template to build today, and claiming otherwise by
  # publishing a headless binary would be worse than publishing nothing. What
  # these jobs do check is that the engine and its simulation still compile for
  # the platform, which is the half that has to work first.
  #
  # iOS is green and required. The other two are known-red and report rather
  # than fail: android was never determined, and wasm is blocked upstream in
  # cpal 0.17, whose emscripten backend does not compile.
  build-platforms:
    name: platform · ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            host: macos-latest
            optional: false
          - target: aarch64-linux-android
            host: ubuntu-latest
            optional: true
          - target: wasm32-unknown-emscripten
            host: ubuntu-latest
            optional: true
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      # Luau is C++, so this needs a C++ compiler for the target, not just a
      # Rust target.
      - name: Android NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: Emscripten
        if: matrix.target == 'wasm32-unknown-emscripten'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest
          echo "$PWD/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Check
        run: cargo check -p balaur --target ${{ matrix.target }}

  draft-release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    # Drafting a release means writing to the repo's releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: balaur-*
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/draft_release.sh dist
