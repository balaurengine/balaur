name: Build

# Everything that produces an artifact somebody downloads: a push to main
# refreshes the rolling `nightly` prerelease, a `v*` tag drafts that version,
# and publishing a version stays a human decision.
on:
  # Runs from .github/workflows/runner.yml, which owns the triggers; kept
  # dispatchable so it can still be run on its own from the Actions tab.
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-editor:
    name: build editor · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # One universal binary rather than two downloads: package.sh builds
          # both slices and lipos them, so Apple Silicon and Intel get the
          # same file.
          - os: macos-latest
            target: macos-universal
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v7
      # A shipped build is windowed, so it links winit's X11/Wayland stack.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      # Builds, stages, and then proves the artifact works: it exports a game
      # with the template it just built and runs that game. See
      # scripts/package.sh — "it compiled" is not the same as "it works".
      - name: Build and package
        shell: bash
        run: ./scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: balaur-${{ matrix.target }}
          path: dist/balaur-*
          if-no-files-found: error

  # Runtime templates for the non-desktop platforms, packaged as the shape
  # each OS starts (scripts/package_template.sh). Web is wasm-bindgen on
  # wasm32-unknown-unknown, the target kiss3d and wgpu support in a browser.
  build-platforms:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The artifact is an unsigned .app: signing needs a certificate
          # that belongs to whoever ships the game, never to this repo.
          - platform: ios
            target: aarch64-apple-ios
            host: macos-latest
          # The script stages the APK layout and assembles a debug-signed APK
          # from it, so the template installs with nothing but `adb install`.
          # That keystore is Android's try-it identity, not a credential.
          - platform: android
            target: aarch64-linux-android
            host: ubuntu-latest
          - platform: web
            target: wasm32-unknown-unknown
            host: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      # oboe (cpal's Android backend) is C++, so this needs a C++ compiler for
      # the target, not just a Rust target. API 26 because that is cpal's
      # floor: AAudio, which the platform added in 26.
      - name: Android NDK toolchain
        if: matrix.platform == 'android'
        run: |
          bin=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"
      # The bindgen CLI has to be the exact version the build links against, so
      # the pin is read off Cargo.lock rather than written down twice.
      # binaryen is wasm-opt; brotli is what a static host serves.
      - name: Web toolchain
        if: matrix.platform == 'web'
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen brotli bc
          want=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[" ]/,""); sub(/version=/,""); print; exit}' Cargo.lock)
          echo "wasm-bindgen-cli $want (from Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$want" --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Build template
        shell: bash
        run: ./scripts/package_template.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: balaur-template-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Exports a game with each mobile template and checks the bundle is what the
  # OS installs — the half the template build cannot check. See scripts/.
  export-mobile:
    name: export ${{ matrix.platform }}
    needs: build-platforms
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS for `vtool`, which tells an iOS binary from a host one.
          - platform: ios
            host: macos-latest
          # Ubuntu for the SDK build-tools that assemble and sign the APK.
          - platform: android
            host: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: actions/download-artifact@v8
        with:
          name: balaur-template-${{ matrix.platform }}
          path: dist
      - uses: Swatinem/rust-cache@v2
        with:
          key: export-${{ matrix.platform }}
      - name: Export a game with the template
        shell: bash
        run: ./scripts/export_mobile.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: balaur-example-${{ matrix.platform }}
          path: dist/balaur-example-*
          if-no-files-found: error

  # The web build as the one download a site refreshes: the glue and module
  # from the web template, plus the editor's project and the examples packed
  # with the linux editor binary (scripts/package_play.sh).
  bundle-web:
    name: bundle web
    needs: [build-editor, build-platforms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The editor binary is windowed, so loading it wants the libraries a
      # build links, though exporting never opens a window.
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev
      - uses: actions/download-artifact@v8
        with:
          name: balaur-linux-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: balaur-template-web
          path: dist
      - name: Pack the web bundle
        run: ./scripts/package_play.sh
      - uses: actions/upload-artifact@v7
        with:
          name: balaur-play
          path: dist/balaur-play.tar.gz
          if-no-files-found: error

  # The only job that publishes anything, so the only one a pull request skips:
  # everything above still builds and is still checked, which is the point of
  # running this on a PR at all.
  draft-release:
    name: draft release
    # A push to main or a `v*` tag, never a manual run: draft_release.sh moves
    # the rolling `nightly` tag to whatever branch it was dispatched from.
    if: github.event_name == 'push'
    needs: [build-editor, build-platforms, export-mobile, bundle-web]
    runs-on: ubuntu-latest
    # Drafting a release means writing to the repo's releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: balaur-*
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/draft_release.sh dist
