name: Build

# Everything that produces an artifact somebody downloads: a push to main
# refreshes a rolling draft release, a `v*` tag drafts that version, and
# publishing stays a human decision.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-editor:
    name: build editor · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # One universal binary rather than two downloads: package.sh builds
          # both slices and lipos them, so Apple Silicon and Intel get the
          # same file.
          - os: macos-latest
            target: macos-universal
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v7
      # A shipped build is windowed, so it links winit's X11/Wayland stack.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      # Builds, stages, and then proves the artifact works: it exports a game
      # with the template it just built and runs that game. See
      # scripts/package.sh — "it compiled" is not the same as "it works".
      - name: Build and package
        shell: bash
        run: ./scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: balaur-${{ matrix.target }}
          path: dist/balaur-*
          if-no-files-found: error

  # Runtime templates for the non-desktop platforms, each packaged as the
  # shape its OS actually starts (scripts/package_template.sh). Web is
  # emscripten because Luau is C++ and needs a libc (mlua#23).
  build-platforms:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The artifact is an unsigned .app: signing needs a certificate
          # that belongs to whoever ships the game, never to this repo.
          - platform: ios
            target: aarch64-apple-ios
            host: macos-latest
          # The script stages the APK layout and assembles a debug-signed APK
          # from it, so the template installs with nothing but `adb install`.
          # That keystore is Android's try-it identity, not a credential.
          - platform: android
            target: aarch64-linux-android
            host: ubuntu-latest
          - platform: web
            target: wasm32-unknown-emscripten
            host: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      # Luau is C++, so this needs a C++ compiler for the target, not just a
      # Rust target. API 26 because that is cpal's floor: its Android backend
      # is AAudio, which the platform added in 26.
      - name: Android NDK toolchain
        if: matrix.platform == 'android'
        run: |
          bin=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"
      # Pinned, not `latest`: this build blocks the release now, so an
      # upstream emscripten release must not be able to turn CI red on its own.
      - name: Emscripten
        if: matrix.platform == 'web'
        env:
          EMSDK_VERSION: 4.0.11
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"
          echo "$PWD/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Build template
        shell: bash
        run: ./scripts/package_template.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: balaur-template-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Exports a game with each mobile template and checks the bundle is what the
  # OS installs — the half the template build cannot check. See scripts/.
  export-mobile:
    name: export ${{ matrix.platform }}
    needs: build-platforms
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS for `vtool`, which tells an iOS binary from a host one.
          - platform: ios
            host: macos-latest
          # Ubuntu for the SDK build-tools that assemble and sign the APK.
          - platform: android
            host: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: actions/download-artifact@v4
        with:
          name: balaur-template-${{ matrix.platform }}
          path: dist
      - uses: Swatinem/rust-cache@v2
        with:
          key: export-${{ matrix.platform }}
      - name: Export a game with the template
        shell: bash
        run: ./scripts/export_mobile.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: balaur-example-${{ matrix.platform }}
          path: dist/balaur-example-*
          if-no-files-found: error

  draft-release:
    name: draft release
    needs: [build-editor, build-platforms, export-mobile]
    runs-on: ubuntu-latest
    # Drafting a release means writing to the repo's releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: balaur-*
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/draft_release.sh dist
