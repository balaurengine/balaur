name: All

# The one entry point: the other four are reusable workflows, called from here
# rather than each subscribing to pushes itself. Lint reads the code, test runs
# it, docs checks both kinds of documentation, build produces the downloads.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: all-${{ github.ref }}
  # Superseding a branch is free; superseding `main` is not. A cancelled run
  # saves no build cache and leaves no verdict on the commit that made it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  docs:
    uses: ./.github/workflows/docs.yml

  test:
    uses: ./.github/workflows/test.yml

  # Runs on pull requests too; build.yml skips the one job that publishes.
  # The token stays writable because a called workflow cannot grant itself more.
  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Signing credentials do not cross into a called workflow on their own,
    # and without them the Mac build has an identity name but no certificate.
    secrets: inherit
    uses: ./.github/workflows/build.yml
