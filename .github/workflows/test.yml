name: Test

# Everything that actually runs the engine. Static checks are in lint.yml,
# documentation in docs.yml, and anything producing a download in build.yml.

on:
  # Runs from .github/workflows/runner.yml, which owns the triggers; kept
  # dispatchable so it can still be run on its own from the Actions tab.
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # No RUSTFLAGS here: it replaces .cargo/config.toml's wholesale, dropping
  # the Swift rpath. Warnings are lint.yml's, where clippy denies them.

  # The cargo e2e suites (full app boots over real sockets) gate on this so
  # a plain local `cargo test` skips them; CI always runs everything.
  BALAUR_E2E: "1"

  # Software Vulkan for the Windows runner. Pinned: a Mesa that changes under
  # a render step is a difference nobody can explain afterwards.
  MESA_VERSION: "26.2.0"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On all three desktop platforms, because platform code is where the engine
  # actually differs: path handling, the macOS dock-icon path, and the windowed
  # backend's wgpu/winit stack. A single Linux job exercised none of it.
  test:
    name: tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Audio and input for the headless build; X11/Wayland/xkb for the
      # windowed one, which links winit; Mesa's Vulkan for the render steps,
      # which ask a runner with no GPU for a device.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          # The image's Chrome and Microsoft repos, which nothing here installs
          # from: a hash mismatch in one fails the whole `apt-get update`.
          sudo rm -f /etc/apt/sources.list.d/*{google,microsoft}*
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libvulkan1 mesa-vulkan-drivers
      # The same software Vulkan, in its Windows spelling: the runner has the
      # loader and no driver, and the GL fallback answers 1.1, not 3.3.
      - name: Windows software GPU
        if: runner.os == 'Windows'
        # pwsh, alone in a file of bash: registering the driver means a
        # native path and a `/v` flag, and Git Bash rewrites both.
        shell: pwsh
        run: |
          curl.exe -sSL --retry 5 --retry-delay 2 --retry-all-errors -o mesa.7z `
            "https://github.com/pal1000/mesa-dist-win/releases/download/${env:MESA_VERSION}/mesa3d-${env:MESA_VERSION}-release-msvc.7z"
          # The manifest names its library relatively, so the two stay together.
          7z x mesa.7z -omesa x64/vulkan_lvp.dll x64/lvp_icd.x86_64.json `
            x64/opengl32.dll x64/libgallium_wgl.dll
          $icd = (Resolve-Path mesa/x64/lvp_icd.x86_64.json).Path
          # The registry, not VK_DRIVER_FILES: the loader ignored the variable
          # and looked here, which is what `Found no drivers!` was reporting.
          $key = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name $icd -PropertyType DWord -Value 0 -Force | Out-Null
          Get-ItemProperty -Path $key
          # And GL, because wgpu enumerates every backend: this runner's is
          # the 1.1 GDI one, and the render died right after saying so. An
          # app-local opengl32.dll answers 4.6, beside the binary e2e.sh runs.
          New-Item -ItemType Directory -Force -Path target/e2e/bin | Out-Null
          Copy-Item mesa/x64/opengl32.dll, mesa/x64/libgallium_wgl.dll target/e2e/bin/
          "GALLIUM_DRIVER=llvmpipe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      # A process per test, run in parallel, rather than one binary at a time.
      # nextest has no doctest runner, so those stay with cargo.
      - name: Unit and integration tests
        shell: bash
        run: |
          cargo nextest run --workspace --no-fail-fast
          cargo test --workspace --doc
      # Extensions are off by default, so `--workspace` above never builds the
      # dlopen path, the cdylib, or the tests that load one at run time.
      - name: Extension tests
        shell: bash
        run: |
          cargo test -p balaur_plugin --features dylib
          cargo test -p balaur --features extensions
      # A build with a subsystem switched off is the point of having features;
      # nothing else builds or runs one.
      - name: Without the optional subsystems
        shell: bash
        run: |
          cargo build -p balaur_cli --no-default-features
          cargo test -p balaur_core -p balaur_physics --no-default-features
      # examples/ are Balaur projects, not cargo examples; scripts/e2e.sh says
      # why all five modes are needed. Windows is on trial: render and the
      # editor exited 122 there, and the step after this reads the real code.
      - name: E2E — run, export, play, edit and render every example project
        shell: bash
        run: ./scripts/e2e.sh
      # If the E2E died on Windows it did so with exit 122 and nothing on
      # stderr. bash keeps 8 bits of a Windows exit code; this keeps all 32.
      - name: Windows — the real exit code, and the engine's own log
        if: runner.os == 'Windows' && !cancelled()
        continue-on-error: true
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
        run: |
          $bin = 'target/e2e/bin/balaur.exe'
          foreach ($case in @(
            @('run',  'examples/angrynerds', '--offscreen', '--frames', '10'),
            @('edit', 'examples/angrynerds', '--frames', '10')
          )) {
            & $bin @case 2>&1 | Select-Object -Last 15
            $code = $LASTEXITCODE
            '{0,-5} exit {1} = 0x{1:X8}' -f $case[0], $code
          }
          Get-ChildItem "$env:APPDATA/balaur/*/logs/run.log" -ErrorAction SilentlyContinue |
            ForEach-Object { "==== $_"; Get-Content $_ -Tail 40 }
      - if: runner.os == 'Windows' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: windows-balaur-logs
          path: ~/AppData/Roaming/balaur/*/logs/run.log
          if-no-files-found: ignore
      - name: Upload pack digests
        uses: actions/upload-artifact@v7
        with:
          name: packs-${{ matrix.os }}
          path: target/e2e/digests.txt
      # A pack agreeing across platforms says the encoder is reproducible. It
      # says nothing about whether two CPUs stepped the same physics, which is
      # what this records and the simulation job diffs.
      - name: Determinism — record the per-tick digest trace
        shell: bash
        run: ./scripts/determinism_trace.sh record target/determinism
      - name: Upload determinism traces
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.os }}
          path: target/determinism/traces.txt


  # The multi-platform half of the determinism promise; see
  # scripts/compare_packs.sh for what it does and does not claim.
  packs-match:
    name: every platform exports an identical pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packs-*
          path: digests
      - name: Compare
        run: ./scripts/compare_packs.sh digests

  # The other multi-platform half: same sources, same simulation. A failure
  # here names the tick two platforms parted on.
  simulation-matches:
    name: every platform steps the same simulation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: traces-*
          path: traces
      - name: Compare
        run: ./scripts/determinism_trace.sh compare traces

  # The promise is that one binary reproduces a simulation everywhere. If the
  # binary is not reproducible from one runner's own sources, that promise is
  # not testable and a divergence cannot be bisected.
  reproducible-build:
    name: the same sources build the same binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        run: |
          # The image's Chrome and Microsoft repos, which nothing here installs
          # from: a hash mismatch in one fails the whole `apt-get update`.
          sudo rm -f /etc/apt/sources.list.d/*{google,microsoft}*
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build twice, compare
        run: ./scripts/reproducible_build.sh

  # What the tests actually reach, reported rather than gated: a threshold is
  # a number people write tests against, and nothing here should turn red
  # because a well-tested change moved a percentage.
  coverage:
    name: line coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same set the test job takes: coverage runs the e2e suite, which
      # renders on a real adapter, and a runner without the software Vulkan
      # driver has none to find.
      - name: Linux build deps
        run: |
          # The image's Chrome and Microsoft repos, which nothing here installs
          # from: a hash mismatch in one fails the whole `apt-get update`.
          sudo rm -f /etc/apt/sources.list.d/*{google,microsoft}*
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libvulkan1 mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Prebuilt, as with nextest above: `cargo install` rebuilt the coverage
      # tool from source every run, for 2m35s of the job's clock.
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      # rust-toolchain.toml pins only rustfmt and clippy.
      - name: llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Measure
        run: ./scripts/coverage.sh
      # Per crate, in the run summary, because one workspace percentage is
      # mostly a weighted average of balaur_core and balaur_render.
      - name: Summarise
        run: |
          python3 scripts/coverage_report.py --markdown target/coverage/lcov.info \
            >>"$GITHUB_STEP_SUMMARY"
      - name: Upload lcov
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
