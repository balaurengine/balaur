name: Channel

# Points a version line's rolling tag at a published release.
on:
  # Runs from .github/workflows/runner.yml, which owns the triggers; kept
  # dispatchable so a channel can be moved by hand from the Actions tab.
  workflow_call:
    inputs:
      tag:
        description: "The published release's tag, e.g. v0.1.0"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "The published release's tag, e.g. v0.1.0"
        type: string
        required: true

jobs:
  move:
    name: move the channel pointer
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    # Writing a release, the same permission drafting one needs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Point the channel at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: ./scripts/move_channel.sh "$TAG"
