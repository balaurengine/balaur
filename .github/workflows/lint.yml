name: Lint

# The platform-independent gates, run once rather than per-OS. Clippy lives
# in ci.yml instead: what it sees genuinely differs per platform.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Format
        run: cargo fmt --all --check

  project-lints:
    name: project lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Naming, function length, deterministic iteration, tracing over log —
      # the rules in docs/NAMING.md that no compiler enforces.
      - name: Project lints
        run: python3 scripts/house_lints.py --fail-on-error
      # Every language in the tree, not just Rust: Luau, Rune, the workflows
      # and the scripts themselves. Generated files are skipped by their banner.
      - name: Comment lints
        run: python3 scripts/comment_lints.py --fail-on-error
