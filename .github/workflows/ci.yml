name: CI

# Does the change work? Formatting and project lints are in lint.yml,
# documentation in docs.yml, and anything that produces a downloadable
# artifact in build.yml.

on:
  # Runs from .github/workflows/runner.yml, which owns the triggers; kept
  # dispatchable so it can still be run on its own from the Actions tab.
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The cargo e2e suites (full app boots over real sockets) gate on this so
  # a plain local `cargo test` skips them; CI always runs everything.
  BALAUR_E2E: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Correctness, on all three desktop platforms, because platform code is where
  # the engine actually differs: path handling, the macOS dock-icon path, and the
  # windowed backend's wgpu/winit stack. A single Linux job compiled none of it.
  check:
    name: ${{ matrix.os }} · clippy · test · e2e
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Audio and input for the headless build; X11/Wayland/xkb for the
      # windowed one, which links winit.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Without this the windowed backend — kiss3d, wgpu, egui, and the macOS
      # objc2 dock-icon code — is compiled by nobody but whoever last ran the
      # editor. It is off by default, so `--all-targets` above never reaches it.
      - name: Clippy (windowed)
        run: cargo clippy -p balaur_cli --features window --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Extensions are off by default, so `--workspace` above never builds the
      # dlopen path, the cdylib, or the tests that load one at run time.
      - name: Clippy (extensions)
        run: cargo clippy -p balaur_plugin -p balaur --features balaur/extensions --all-targets -- -D warnings
      - name: Test (extensions)
        run: |
          cargo test -p balaur_plugin --features dylib
          cargo test -p balaur --features extensions
      # extension_greeter is deliberately outside the workspace, so the clippy
      # and test steps above never reach it. It is the only thing proving an
      # extension builds without the engine's build tree.
      - name: Clippy (out-of-tree extension)
        run: |
          cargo clippy --manifest-path examples/extension_greeter/Cargo.toml \
            --target-dir target/extension_greeter --all-targets -- -D warnings
      # A build with a subsystem switched off is the point of having features;
      # nothing else checks that one still compiles.
      - name: Build without the optional subsystems
        run: cargo build -p balaur_cli --no-default-features
      # examples/ are Balaur projects, not cargo examples: run, export and play
      # each one. See scripts/e2e.sh for why all three are needed.
      - name: E2E — run, export, play and edit every example project
        shell: bash
        run: ./scripts/e2e.sh
      - name: Upload pack digests
        uses: actions/upload-artifact@v4
        with:
          name: packs-${{ matrix.os }}
          path: target/e2e/digests.txt

  # The multi-platform half of the determinism promise; see
  # scripts/compare_packs.sh for what it does and does not claim.
  packs-match:
    name: packs are identical across platforms
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: packs-*
          path: digests
      - name: Compare
        run: ./scripts/compare_packs.sh digests

  supply-chain:
    name: advisories · bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
