# The signing toolchain as a container image. See docker/README.md. Its own
# workflow because container.yml waits on `build`, and this holds no engine.
name: container-signer

on:
  workflow_call:

jobs:
  signer:
    name: publish signing container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The arm64 layer runs `rcodesign --version` and `apksigner version` on
      # an amd64 runner, so it needs emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Work out the tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/balaur-signer"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            echo "signer=${image}:${version},${image}:latest" >>"$GITHUB_OUTPUT"
          else
            echo "signer=${image}:nightly" >>"$GITHUB_OUTPUT"
          fi

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A pull request builds it to prove the Dockerfile still works; only a
      # push publishes. Same rule the rest of this repo applies to releases.
      - name: The signing toolchain
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.signer
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.signer }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Signing tools for Balaur exports: rcodesign, apksigner, osslsigncode
            org.opencontainers.image.licenses=MIT
