version: 2
# One pull request a week for every ecosystem below. Pairs that must move
# together (rapier with parry, i_triangle with i_overlay) always share it.
multi-ecosystem-groups:
  dependencies:
    schedule: { interval: weekly }
updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    # Raise the requirement in Cargo.toml, not only the version Cargo.lock holds.
    versioning-strategy: increase
    ignore:
      # bincode 3.0.0 is a `compile_error!` tombstone: the project stopped at 2.
      - dependency-name: bincode
        versions: [">= 3"]
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: npm
    directory: /editors/code
    patterns: ["*"]
    multi-ecosystem-group: dependencies
