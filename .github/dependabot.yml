version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    ignore:
      # bincode 3.0.0 is a `compile_error!` tombstone: the project stopped at 2.
      - dependency-name: bincode
        versions: [">= 3"]
    # A crate lands in the first group it matches. Each pair moves together:
    # rapier pins its parry, and i_triangle pins its i_overlay.
    groups:
      physics:
        patterns: [rapier*, parry*]
      polygons:
        patterns: [i_overlay, i_triangle]
      patch-and-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /editors/code
    schedule: { interval: weekly }
